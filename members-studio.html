p.","level":"B2","track":"Practical Speaking and Writing"}],"platinum":[{"id":"advanced-linking-and-argument","tier":"platinum","title":"Advanced Linking and Argument","goal":"Build nuanced arguments with concession, contrast and consequence.","rule":"Use however for contrast between independent statements, whereas to compare differences, nevertheless to reinforce a surprising result, and therefore for a logical consequence. These words are not interchangeable. A good argument also addresses a reasonable objection rather than pretending no opposing view exists.","sentence":"Remote work saves commuting time; nevertheless, some employees miss informal collaboration.","scenario":"A company is considering four-day working weeks. Prepare a balanced briefing that acknowledges productivity, staffing, morale and possible difficulties. Use linking phrases only where their logical meaning fits.","level":"B2–C1","track":"Advanced British English"},{"id":"precision-register-and-nuance","tier":"platinum","title":"Precision, Register and Nuance","goal":"Choose vocabulary for audience, strength of claim and level of formality.","rule":"Advanced fluency is not about inserting the longest word possible. Compare assert, suggest and speculate: each conveys a different level of confidence. In professional messages, may indicate possibility; definitely communicates high certainty. Prefer precise familiar language to impressive but inaccurate synonyms.","sentence":"The evidence suggests a moderate improvement, although results vary by group.","scenario":"You are updating a client about a pilot programme with encouraging but incomplete results. Your message must be optimistic without making claims that the evidence cannot support.","level":"C1","track":"Advanced British English"},{"id":"disagree-diplomatically-in-meetings","tier":"platinum","title":"Disagree Diplomatically in Meetings","goal":"Challenge ideas while maintaining working relationships.","rule":"Polite disagreement acknowledges the other point before adding evidence or a different perspective. Phrases like I see the reasoning, but... and One concern might be... invite discussion. Avoid false agreement: if the proposal is unsafe or impossible, state the problem explicitly and explain why.","sentence":"I can see the benefit of a faster launch. My concern is that we haven't finished the accessibility checks.","scenario":"A manager suggests launching a product before final testing. You believe this creates avoidable problems, but the team is under pressure. Raise your objection, support it and offer a workable alternative.","level":"C1","track":"Advanced British English"},{"id":"run-a-productive-meeting","tier":"platinum","title":"Run a Productive Meeting","goal":"Open, guide and summarise a meeting with clear actions.","rule":"A good chair states the purpose and desired outcome, keeps contributions relevant, summarises decisions and confirms owners and deadlines. Language such as Let's move on to..., Could we hear from...?, and To summarise, we've agreed... helps. Do not confuse discussion with decisions unless someone commits to an action.","sentence":"To summarise, Sam will send the draft by Tuesday, and we'll review it on Thursday.","scenario":"Your team has 20 minutes to decide the priorities for a customer launch. Two people keep repeating the same points and one quiet colleague has useful technical experience.","level":"C1","track":"Advanced British English"},{"id":"negotiate-terms-and-trade-offs","tier":"platinum","title":"Negotiate Terms and Trade-offs","goal":"Make proposals, concessions and conditional offers confidently.","rule":"Negotiation involves identifying priorities, exploring alternatives and trading concessions. Useful structures include If you can..., we'd be able to..., In return for..., and Could we find a middle ground? Avoid agreeing before confirming what the other party has promised.","sentence":"If you can deliver by Wednesday, we'd be willing to place a larger order.","scenario":"A supplier offers a good price but a delivery date that is too late. You need earlier delivery while keeping a constructive long-term relationship.","level":"C1","track":"Professional Fluency"},{"id":"job-interviews-with-the-star-method","tier":"platinum","title":"Job Interviews with the STAR Method","goal":"Turn experience into specific evidence-rich interview answers.","rule":"STAR stands for Situation, Task, Action and Result. The action should explain what you personally did, while the result should be accurate and specific. Avoid inventing numerical achievements or spending most of the answer on what the team did without you.","sentence":"Our team faced a backlog. I reorganised the handover checklist and checked priorities each morning. We cleared the urgent work by Friday.","scenario":"An interviewer asks about a difficult deadline, a conflict and a mistake you learned from. Prepare responses that sound genuine rather than memorised.","level":"B2–C1","track":"Professional Fluency"},{"id":"give-a-persuasive-presentation","tier":"platinum","title":"Give a Persuasive Presentation","goal":"Guide listeners with signposting, concrete examples and a clear takeaway.","rule":"An effective presentation begins with the question it will answer, sets out a small number of points, supports each with evidence and finishes with a memorable conclusion. Signposting should help orientation, not fill every sentence with Firstly, Secondly and Finally.","sentence":"Today I'll explain why our response times changed, what the data shows and what we propose next.","scenario":"You are presenting a five-minute improvement proposal to senior colleagues. Some care about cost and others care about customer experience. Both groups need to understand your recommendation.","level":"C1","track":"Professional Fluency"},{"id":"lead-a-difficult-customer-conversation","tier":"platinum","title":"Lead a Difficult Customer Conversation","goal":"Acknowledge frustration while setting realistic expectations.","rule":"Empathy names the experience without making an impossible promise. First acknowledge what has happened, then clarify what is known, explain the next action and give a realistic update time. Avoid saying I guarantee when the outcome is uncertain.","sentence":"I understand why the delay is frustrating. I'll check the tracking details and update you by 3 pm.","scenario":"A customer's delivery is overdue and they need the goods for an event. The tracking data is incomplete and they are understandably angry. Your job is to help without inventing certainty.","level":"C1","track":"Professional Fluency"},{"id":"ielts-speaking-part-2-extended-answer","tier":"platinum","title":"IELTS Speaking Part 2: Extended Answer","goal":"Build a coherent two-minute response without memorising an unnatural script.","rule":"Use the one-minute preparation to choose a simple example, note key events and feelings, and organise beginning, development and reflection. Answer the card rather than forcing memorised idioms into every sentence. Develop details so the examiner can follow your story. This is practice, not an official band assessment.","sentence":"I'd like to talk about a teacher who encouraged me. I first met her when... What stayed with me was...","scenario":"Describe a person who helped you learn something important. Include who they were, what you learned, how the learning happened and why it mattered to you.","level":"B2–C1","track":"IELTS Excellence"},{"id":"ielts-speaking-part-3-develop-ideas","tier":"platinum","title":"IELTS Speaking Part 3: Develop Ideas","goal":"Answer abstract follow-up questions with reasoning, examples and balanced views.","rule":"Part 3 requires more than a personal anecdote. Explain a broader point, give a concrete example and consider a limitation or alternative view. It is acceptable to qualify claims with in many cases or it depends on. Avoid pretending statistics you do not know are facts.","sentence":"Schools can build confidence by allowing students to practise public speaking. However, quieter students may need smaller-group activities first.","scenario":"An examiner asks whether technology has changed the way people learn and whether governments should fund adult education. Move from personal experience to broader arguments.","level":"C1","track":"IELTS Excellence"},{"id":"ielts-writing-task-2-balanced-essay","tier":"platinum","title":"IELTS Writing Task 2: Balanced Essay","goal":"Plan and write a focused argument with coherent paragraphs and justified examples.","rule":"Read the precise instruction first: discuss both views, agree/disagree and advantages/disadvantages demand different structures. Write a thesis that answers the actual question. Use topic sentences, logical development and specific examples; avoid memorised introductions that could fit any question. This practice is not official scoring.","sentence":"Although online learning is flexible, face-to-face teaching may offer immediate interaction. A blended approach can combine both strengths.","scenario":"Some people believe English should be taught entirely online, while others prefer classrooms. Discuss both views and give your own opinion.","level":"C1","track":"IELTS Excellence"},{"id":"ielts-academic-task-1-describe-data","tier":"platinum","title":"IELTS Academic Task 1: Describe Data","goal":"Select key trends and comparisons without inventing explanations.","rule":"For Academic Task 1, introduce the graphic, provide a clear overview and support it with selected comparisons. Use approximate language when exact values are unavailable, and avoid explaining why trends happened unless the data actually provides the cause. Distinguish a percentage-point rise from a percent increase.","sentence":"Participation rose from 20% to 30%, an increase of ten percentage points.","scenario":"A chart shows three kinds of language-study activity between 2020 and 2025. Online lessons increase, printed workbook use declines and small-group speaking remains stable. You must describe, not evaluate, the trends.","level":"B2–C1","track":"IELTS Excellence"},{"id":"ielts-listening-paraphrase-and-distractors","tier":"platinum","title":"IELTS Listening: Paraphrase and Distractors","goal":"Identify meaning when speakers change their minds or paraphrase answers.","rule":"Listening tests often replace the exact wording in the question with a synonym. Pay attention to corrections: We originally planned Tuesday, but we've moved it to Thursday. The first date is a distractor. Anticipate the information type without guessing before hearing the full statement.","sentence":"We were going to meet on Tuesday, but we've changed it to Thursday. The answer is Thursday.","scenario":"A student discusses course times with an adviser. The adviser mentions two older schedules, corrects one room number and confirms the final booking at the end. You must identify the confirmed details.","level":"B2–C1","track":"IELTS Excellence"},{"id":"toeic-workplace-listening-decisions","tier":"platinum","title":"TOEIC Workplace Listening Decisions","goal":"Use context and implied meaning to understand workplace conversations.","rule":"In workplace listening, the correct response may not repeat the question's words. If someone says The meeting room is already booked, they may be refusing a proposal rather than giving a room description. Identify who is speaking, what problem exists and what action follows. This is an original practice exercise, not an official TOEIC question.","sentence":"Could we meet in Room B? I'm afraid that's booked, but Room D is free. They will probably use Room D.","scenario":"Two colleagues need to move a client meeting. One suggests a room that is unavailable and another recommends a video call. The final decision depends on the client's travel arrangements.","level":"B1–B2","track":"TOEIC Excellence"},{"id":"toeic-business-reading-and-email-chains","tier":"platinum","title":"TOEIC Business Reading and Email Chains","goal":"Track decisions, times and responsibilities across several workplace messages.","rule":"Business reading questions often require you to combine information from an email, notice and revised schedule. Identify the latest message, changes to earlier instructions, who owns each action and any deadlines. Do not assume the first document is still current after an update.","sentence":"Monday's email requests a draft by Wednesday; Tuesday's update changes the deadline to Thursday.","scenario":"You receive a supplier email, then a correction from the project manager and a revised delivery schedule. One document changes the location while another changes the date. Summarise the final arrangements.","level":"B2","track":"TOEIC Excellence"},{"id":"evaluate-claims-and-evidence","tier":"platinum","title":"Evaluate Claims and Evidence","goal":"Identify bias, missing context, selective numbers and unsupported conclusions.","rule":"Strong critical reading asks who makes a claim, what evidence supports it, what alternatives exist and which uncertainties remain. A dramatic statistic may still be misleading without a sample, timeframe or comparison group. Avoid calling something false merely because you disagree with it.","sentence":"A survey of 75 volunteers suggests interest, but the small self-selected sample limits wider conclusions.","scenario":"A website claims that 95% of users improve their English after seven days but gives no definition of improvement, method or comparison group. Decide which follow-up questions are necessary before believing the claim.","level":"C1","track":"Reading Mastery"},{"id":"summarise-without-plagiarising","tier":"platinum","title":"Summarise without Plagiarising","goal":"Paraphrase meaning accurately and acknowledge limits.","rule":"Good summarising keeps the main claims and logical relationships while changing the sentence structure and selection of details. Replacing every third word with a synonym is not reliable paraphrasing. In academic contexts, attribution is still necessary even when ideas are expressed in your own words.","sentence":"Original: Flexible hours allow adults to study around work. Summary: A variable timetable may help employed learners fit lessons into daily life.","scenario":"A report describes the benefits and drawbacks of remote learning. You need to provide an accurate short briefing for a colleague who has no time to read the report.","level":"C1","track":"Reading Mastery"},{"id":"write-a-persuasive-proposal","tier":"platinum","title":"Write a Persuasive Proposal","goal":"Combine a clear recommendation, benefits, evidence, risks and implementation steps.","rule":"A proposal should tell the reader exactly what decision is requested. Show likely benefits, honest costs and risks, and a sequence for implementation. Distinguish evidence from projections and avoid promising outcomes that have not been validated.","sentence":"I recommend a four-week pilot, measured by attendance, learner progress and cost per active student.","scenario":"An education business is considering a new speaking course. Management needs a proposal explaining who it serves, how it works, how success will be measured and what could go wrong.","level":"C1","track":"Writing Mastery"},{"id":"edit-for-clarity-and-concision","tier":"platinum","title":"Edit for Clarity and Concision","goal":"Improve organisation and meaning without removing necessary detail.","rule":"Editing starts with purpose: what must the reader understand or do? Cut duplication, replace vague nouns with specific ones and break overloaded sentences. Preserve essential qualifications. Concision does not mean deleting context or removing politeness from a sensitive message.","sentence":"Due to a scheduling conflict, we need to move Thursday's review to Friday at 10 am.","scenario":"A long customer-support message repeats itself, hides the requested action and contains several ambiguous dates. Edit it into a concise, accurate response that customers can follow.","level":"C1","track":"Writing Mastery"},{"id":"integrated-airport-and-hotel-mission","tier":"platinum","title":"Integrated Airport and Hotel Mission","goal":"Combine planning, listening, problem-solving and professional language.","rule":"Real-life fluency means adapting when the first plan fails. Clarify information, explain a problem, propose alternatives and confirm the result. Use suitable register with airport staff, hotel reception and a colleague. Your final account should clearly distinguish known information from assumptions.","sentence":"Our flight has been delayed. Could you confirm whether the transfer booking can be moved to 9 pm?","scenario":"You arrive in a new city two hours late. Your airport transfer has left, the hotel says your booking may be cancelled and you have a meeting in the morning. You must prioritise the issues and resolve them in order.","level":"B2–C1","track":"Mastery Challenges"},{"id":"integrated-workplace-crisis-mission","tier":"platinum","title":"Integrated Workplace Crisis Mission","goal":"Synthesize competing facts and communicate a clear action plan.","rule":"Under pressure, accurate communication requires a verified timeline, named responsibilities and updates tailored to each audience. Internal notes can be detailed; customer messages should be accurate, calm and concise. Avoid speculative blame or promises you cannot keep.","sentence":"We are investigating the issue and will provide the next confirmed update at 4 pm.","scenario":"A service outage affects customer appointments, an important delivery and staff schedules. You receive conflicting reports. Decide what to verify first, what to tell customers and what action each colleague should take.","level":"C1","track":"Mastery Challenges"},{"id":"research-debate-and-defend-a-position","tier":"platinum","title":"Research, Debate and Defend a Position","goal":"Build a defensible position using credible sources and fair counterarguments.","rule":"A strong argument uses a clearly bounded claim, credible evidence and reasoning. Anticipate the most serious counterargument rather than attacking a weak version. Distinguish descriptive evidence from your own evaluation and acknowledge limitations. Do not invent source titles or statistics.","sentence":"The evidence supports a limited pilot, although long-term retention is still uncertain.","scenario":"A community organisation is deciding whether to fund online adult education. Stakeholders disagree about inclusion, cost and outcomes. Prepare a decision brief that respects the strongest arguments on both sides.","level":"C1–C2","track":"Mastery Challenges"},{"id":"final-british-english-fluency-portfolio","tier":"platinum","title":"Final British English Fluency Portfolio","goal":"Demonstrate transferable learning across speaking, reading, grammar and writing.","rule":"A portfolio should collect evidence from multiple tasks and identify what has improved and what still needs practice. Include a revised piece of writing, a spoken performance, a reading summary and a practical communication task. Reflection should point to observable changes rather than claiming a level based on confidence alone.","sentence":"My first email was unclear about the deadline; my revised version names the date and the next action.","scenario":"You are applying for a new role abroad. Prepare a complete English-language portfolio showing that you can introduce yourself, handle a practical difficulty, write persuasively and evaluate a source.","level":"C1–C2","track":"Mastery Challenges"},{"id":"platinum-extension-0","tier":"platinum","title":"Evaluating Conflicting Evidence","goal":"Assess competing sources without oversimplifying.","rule":"Assess competing sources without oversimplifying. Notice the relationship between each clause and the intended register.","sentence":"Although the surveys disagree, both reveal a change in behaviour.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Academic English"},{"id":"platinum-extension-1","tier":"platinum","title":"Qualifying Academic Claims","goal":"Avoid overly confident statements.","rule":"Avoid overly confident statements. Notice the relationship between each clause and the intended register.","sentence":"The findings appear to support a cautious interpretation.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Academic English"},{"id":"platinum-extension-2","tier":"platinum","title":"Counterargument Architecture","goal":"Build and answer counterarguments.","rule":"Build and answer counterarguments. Notice the relationship between each clause and the intended register.","sentence":"Critics may object, yet the broader evidence is persuasive.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Academic English"},{"id":"platinum-extension-3","tier":"platinum","title":"Nuanced Concession","goal":"Acknowledge opposing views convincingly.","rule":"Acknowledge opposing views convincingly. Notice the relationship between each clause and the intended register.","sentence":"While the proposal has merit, its costs remain uncertain.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Academic English"},{"id":"platinum-extension-4","tier":"platinum","title":"Framing an Executive Summary","goal":"Summarise decisions with clarity.","rule":"Summarise decisions with clarity. Notice the relationship between each clause and the intended register.","sentence":"The analysis identifies three immediate priorities for the board.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Academic English"},{"id":"platinum-extension-5","tier":"platinum","title":"Crisis Communication","goal":"Respond responsibly to uncertainty.","rule":"Respond responsibly to uncertainty. Notice the relationship between each clause and the intended register.","sentence":"We acknowledge the disruption and will provide further updates.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Academic English"},{"id":"platinum-extension-6","tier":"platinum","title":"Cross-cultural Negotiation","goal":"Negotiate respectfully across cultures.","rule":"Negotiate respectfully across cultures. Notice the relationship between each clause and the intended register.","sentence":"Would it be possible to revisit the proposed delivery schedule?","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Academic English"},{"id":"platinum-extension-7","tier":"platinum","title":"Persuasive Evidence Language","goal":"Use evidence to support a recommendation.","rule":"Use evidence to support a recommendation. Notice the relationship between each clause and the intended register.","sentence":"The available data strongly suggests a measurable improvement.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Academic English"},{"id":"platinum-extension-8","tier":"platinum","title":"Hedging With Modal Verbs","goal":"Describe uncertainty precisely.","rule":"Describe uncertainty precisely. Notice the relationship between each clause and the intended register.","sentence":"The discrepancy could have resulted from a reporting error.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Academic English"},{"id":"platinum-extension-9","tier":"platinum","title":"Advanced Conditionals in Debate","goal":"Discuss alternative historical outcomes.","rule":"Discuss alternative historical outcomes. Notice the relationship between each clause and the intended register.","sentence":"Had the policy changed earlier, the outcome might have differed.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Academic English"},{"id":"platinum-extension-10","tier":"platinum","title":"Emphasis With Inversion","goal":"Control formal emphasis and word order.","rule":"Control formal emphasis and word order. Notice the relationship between each clause and the intended register.","sentence":"Not until the final review did the error become apparent.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Academic English"},{"id":"platinum-extension-11","tier":"platinum","title":"Information Focus and Clefts","goal":"Emphasise an important part of an argument.","rule":"Emphasise an important part of an argument. Notice the relationship between each clause and the intended register.","sentence":"What concerns the team most is the lack of reliable data.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Professional Influence"},{"id":"platinum-extension-12","tier":"platinum","title":"Reduced Relative Clauses","goal":"Write compact formal sentences.","rule":"Write compact formal sentences. Notice the relationship between each clause and the intended register.","sentence":"Applicants shortlisted for interview will receive an email.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Professional Influence"},{"id":"platinum-extension-13","tier":"platinum","title":"Nominalisation Practice","goal":"Recognise compact academic style.","rule":"Recognise compact academic style. Notice the relationship between each clause and the intended register.","sentence":"The implementation of the plan requires additional funding.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Professional Influence"},{"id":"platinum-extension-14","tier":"platinum","title":"Cohesive Paragraph Design","goal":"Connect an argument across paragraphs.","rule":"Connect an argument across paragraphs. Notice the relationship between each clause and the intended register.","sentence":"Furthermore, the report outlines several practical alternatives.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Professional Influence"},{"id":"platinum-extension-15","tier":"platinum","title":"Subtle Cause and Effect","goal":"Express causes without assuming certainty.","rule":"Express causes without assuming certainty. Notice the relationship between each clause and the intended register.","sentence":"The revised timetable contributed to a noticeable improvement.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Professional Influence"},{"id":"platinum-extension-16","tier":"platinum","title":"Evaluating Source Reliability","goal":"Question the credibility of a source.","rule":"Question the credibility of a source. Notice the relationship between each clause and the intended register.","sentence":"The article cites no independent evidence for its central claim.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Professional Influence"},{"id":"platinum-extension-17","tier":"platinum","title":"Bias and Framing","goal":"Identify slanted language.","rule":"Identify slanted language. Notice the relationship between each clause and the intended register.","sentence":"The headline presents a narrow interpretation of the events.","scenario":"Prepare a concise and precise professional or academic explanation for a real function cards(list,section){return list.length?list.map(x=>{let done=state.wins[section+':'+x.id],tier=required(section,x);return `<button class="rl-card" data-open="${safe(section)}" data-id="${safe(x.id)}"><span class="rl-art">${visual(section,x)}</span><span class="rl-cardmain"><strong>${safe(x.title)}</strong><p>${safe(itemTitle(x,section)).slice(0,180)}</p><span class="rl-cardfoot"><span class="rl-tag ${tier}">${safe(tier)}</span><span class="rl-tag ${done?'complete':''}">${done?'✓ Complete':can(tier)?'Start →':'🔒 Unlock'}</span></span></span></button>`}).join(''):`<p class="rl-empty">No matching activities. Change your search to see more.</p>`}
const totalMinutes=()=>Object.values(state.minutes).reduce((n,v)=>n+v,0);
function render(){const sec=sections.find(x=>x[0]===state.section)||sections[0];root.innerHTML=`<header class="rl-header"><div class="rl-brand"><div class="rl-logo">RJ</div><div><strong>RJ Language Academy</strong><small>ENGLISH FOR LIFE</small></div></div><div class="rl-actions"><a class="rl-link" href="/">← Home</a><button class="rl-link" id="rlSound" style="border:0;background:transparent;cursor:pointer">${state.sound?'♫ Sound on':'♪ Sound off'}</button><span class="rl-pill">Preview: ${fmtName()}</span></div></header><div class="rl-layout"><aside class="rl-sidebar"><h2>Explore our studios</h2>${sections.map(x=>`<button class="rl-sidebtn" data-section="${x[0]}" ${x[0]===state.section?'aria-current="page"':''}><span>${safe(x[1])}</span><small>${dataFor(x[0]).length}</small></button>`).join('')}<h2>Preview access</h2><button class="rl-sidebtn" data-section="journey">My English Journey</button><button class="rl-sidebtn" data-section="plans">Membership plans</button></aside><main class="rl-main"><div class="rl-hero"><div class="rl-eyebrow">Active British English · ${safe(sec[1])}</div><h1>${state.section==='journey'?'My English Journey':state.section==='plans'?'Choose your membership':safe(sec[1])}</h1><p>Read the teaching, build your own language, check your answer and practise a real situation. Your progress stays on this browser.</p></div><div class="rl-stats"><div class="rl-stat"><b>${D.silver.length}</b><small>Silver lessons</small></div><div class="rl-stat"><b>${D.gold.length}</b><small>Gold lessons</small></div><div class="rl-stat"><b>${D.platinum.length}</b><small>Advanced Platinum lessons</small></div><div class="rl-stat"><b>${progressCount()}</b><small>Activities completed</small></div></div><div id="rlContent"></div></main></div><div id="rlLesson" hidden></div><div id="rlPaywall" hidden></div>`;
if(state.section==='plans'){document.getElementById('rlContent').innerHTML=`<div class="rl-toolbar"><h2>Monthly membership</h2></div><div class="rl-grid">${['silver','gold','platinum'].map(t=>`<article class="rl-stat"><h2>${safe(t.toUpperCase())}</h2><b>${PLANS[t]}<small>/month</small></b><p>Full access to ${t==='silver'?'60 foundational courses':t==='gold'?'130 intermediate lessons, 40 stories and 12 conversations':'180 advanced lessons, reading adventures and IELTS exam practice'}.</p><button class="rl-btn" data-upgrade="${t}">Explore ${t}</button></article>`).join('')}</div><p class="rl-mini" style="margin-top:25px">Stripe is not connected. Pricing buttons show a checkout-information overlay; no charges or entitlement changes occur.</p>`;return}
if(state.section==='journey'){document.getElementById('rlContent').innerHTML=`<div class="rl-toolbar"><h2>Progress by studio</h2></div><div class="rl-grid">${sections.map(x=>`<section class="rl-stat"><strong>${safe(x[1])}: ${countDone(x[0])} / ${dataFor(x[0]).length}</strong><div class="rl-progress" style="margin-top:12px"><span style="width:${Math.round(100*countDone(x[0])/Math.max(1,dataFor(x[0]).length))}%"></span></div></section>`).join('')}</div><p class="rl-mini" style="margin-top:20px">Saved locally. Progress does not sync between devices or prove membership.</p>`;return}
document.getElementById('rlContent').innerHTML=`<div class="rl-toolbar"><h2>${safe(sec[1])} <small class="rl-count">${dataFor(sec[0]).length} activities</small></h2><input aria-label="Search lessons" id="rlSearch" placeholder="Find a lesson or skill" value="${safe(state.search)}"><select class="rl-select" id="rlLevel" aria-label="Filter by level"><option value="all">All levels</option>${['A1','A2','B1','B2','C1','C2','IELTS'].map(x=>`<option value="${x}" ${state.level===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="rl-grid" id="rlCards"></div><p class="rl-mini" style="margin-top:22px">Demo content is accessible in local preview; payment security requires server-verified subscriptions before launch.</p>`;renderCards()}
function renderCards(){const el=document.getElementById('rlCards');if(!el)return;let x=dataFor(state.section).filter(i=>(i.title||'').toLowerCase().includes(state.search.toLowerCase())&&(state.level==='all'||(i.level||'')===state.level));el.innerHTML=cards(x,state.section)}
function paywall(tier){const el=document.getElementById('rlPaywall');if(!el)return;el.hidden=false;el.className='rl-paywall';el.innerHTML=`<div class="rl-dialog" role="dialog" aria-modal="true" aria-label="Membership access"><h2>Unlock ${safe(tier)} learning</h2><p>Continue this activity with RJ ${safe(tier)} from <b>${PLANS[tier]}/month</b>.</p><button class="rl-btn" id="rlCheckout">Join via Stripe ↗</button> <button class="rl-btn alt" id="rlPayClose">Maybe later</button><div class="rl-note" id="rlPayNote">Stripe checkout is not connected. No payment can be taken in this preview.</div><p class="rl-mini">To test content without paying, use the temporary preview selector below.</p><select id="rlDemoTier" class="rl-select">${Object.keys(TIERS).map(x=>`<option value="${x}" ${state.tier===x?'selected':''}>Preview ${x}</option>`).join('')}</select></div>`;
el.querySelector('#rlPayClose').onclick=()=>el.hidden=true;el.querySelector('#rlCheckout').onclick=()=>{el.querySelector('#rlPayNote').textContent='Stripe checkout is not configured. No payment was taken.';audio.error()};el.querySelector('#rlDemoTier').onchange=e=>{state.tier=e.target.value;el.hidden=true;render()}}
const tokenize=s=>(s||'').match(/[\p{L}\p{N}']+|[^\s\p{L}\p{N}']/gu)||[];
const terms=s=>(s||'').match(/[\p{L}\p{N}']+/gu)||[];
function shuffle(items,seed){let a=items.map((v,i)=>({v,i})),h=hash(seed);for(let i=a.length-1;i>0;i--){h=(Math.imul(h,1664525)+1013904223)>>>0;let j=h%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function start(section,id){const item=dataFor(section).find(x=>x.id===id);if(!item)return;let tier=required(section,item);if(!can(tier)){paywall(tier);return}let sentence=item.sentence||item.answer||(item.text?'The story shows that language helps us understand others.':'');const a=state.active={section,item,stage:0,selected:null,tokens:tokenize(sentence).filter(x=>!/^\W+$/.test(x)),chosen:[],mistakes:0,check:false,typed:'',seconds:60,timer:null,word:sentence};a.bank=shuffle(a.tokens,item.id);const overlay=document.getElementById('rlLesson');overlay.hidden=false;overlay.className='rl-lesson';document.body.style.overflow='hidden';paintLesson()}
function closeLesson(){if(state.active?.timer)clearInterval(state.active.timer);state.active=null;document.body.style.overflow='';document.getElementById('rlLesson').hidden=true;render()}
// Six-stage active learning canvas: discover, analyse, build, repair, produce, apply.
const STAGE_NAMES=['Discover','Understand','Build','Repair','Produce','Real-world mission'];
const keyWord=a=>a.tokens.find(w=>w.length>=5)||a.tokens[0]||'English';
function instruction(a){return [
  'Tap the key word or phrase from the example to begin.',
  'Select the accurate rule, then check your understanding.',
  'Tap the word tiles to rebuild the model sentence.',
  'Repair the sentence by choosing the accurate version.',
  'Write an original example using this language pattern.',
  'Complete the real-world mission with a suitable English response.'
][a.stage]}
function explain(a){let x=a.item;
 if(a.stage===0)return x.rule||x.goal||x.text||x.prompt||x.speaker||x.title;
 if(a.stage===1)return x.goal||x.title;
 if(a.stage===2)return 'Word order changes meaning. Build the exact model before creating your own example.';
 if(a.stage===3)return 'Check word order, capitalisation, punctuation and grammatical accuracy.';
 if(a.stage===4)return x.rule||x.goal||x.title;
 return x.scenario||x.text||x.prompt||x.followup||x.goal||x.title;
}
function paintLesson(){const a=state.active;if(!a)return;const el=document.getElementById('rlLesson'),lesson=a.item;
 el.innerHTML=`<div class="rl-lesson-top"><button class="rl-btn alt" id="rlBack">← Library</button><strong>${safe(lesson.title)}</strong><div class="rl-progress" aria-label="Lesson progress"><span style="width:${(a.stage+1)/6*100}%"></span></div><span class="rl-tag">${a.stage+1}/6</span></div><div class="rl-workspace"><article class="rl-teach"><div class="rl-eyebrow">RJ ACTIVE LEARNING · STAGE ${a.stage+1}</div><h2>${safe(lesson.title)}</h2><p>${safe(explain(a)).replace(/\n/g,'<br>')}</p><div class="rl-hint">${safe(instruction(a))}</div>${a.section==='conversations'?'<button class="rl-btn alt rl-cta" id="rlSpeak">▶ Hear conversation line</button>':''}</article><div class="rl-lab"><div class="rl-eyebrow">INTERACTIVE WORKSPACE</div><div class="rl-steps">${STAGE_NAMES.map((x,i)=>`<span class="rl-step ${a.stage===i?'current':''}">${i+1}. ${x}</span>`).join('')}</div><div id="rlPuzzle"></div><div class="rl-lab-actions"><button class="rl-btn alt" id="rlReset">Reset stage</button><button class="rl-btn" id="rlCheck">Check my work →</button></div></div></div><div class="rl-feedback" id="rlFeedback" hidden></div>`;
 el.querySelector('#rlBack').onclick=closeLesson;
 el.querySelector('#rlReset').onclick=()=>{a.chosen=[];a.typed='';a.selected=null;a.check=false;a.reveal=false;paintPuzzle()};
 el.querySelector('#rlCheck').onclick=check;
 const speak=el.querySelector('#rlSpeak');if(speak)speak.onclick=()=>{if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(lesson.speaker||lesson.sentence||lesson.title);u.lang='en-GB';u.rate=.94;let voice=speechSynthesis.getVoices().find(v=>/en-GB/i.test(v.lang));if(voice)u.voice=voice;speechSynthesis.speak(u)};
 paintPuzzle();
}
function exampleSentence(a){return a.item.sentence||a.item.answer||a.item.text||a.item.prompt||a.item.title||'Practising every day improves your English.'}
function firstChangedSentence(sentence){const original=String(sentence).trim();const split=original.split(/\s+/);if(split.length>4){let k=Math.min(split.length-1,Math.max(1,Math.floor(split.length/2)));const out=split.slice();out[k]=out[k].replace(/[.,;!?]$/,'');out[0]=out[0][0].toLowerCase()+out[0].slice(1);return out.join(' ')}return original.toLowerCase().replace(/[.!?]$/,'')}
function paintPuzzle(){const a=state.active;if(!a)return;const zone=document.getElementById('rlPuzzle'),f=document.getElementById('rlFeedback');if(f)f.hidden=true;const sentence=exampleSentence(a);
 if(a.stage===0){const focus=keyWord(a),options=shuffle([focus,'never','always'].filter((x,i,arr)=>arr.indexOf(x)===i),a.item.id+'disc').map(x=>x.v);
  zone.innerHTML=`<h3>Explore the example</h3><p class="rl-speech">${safe(sentence)}</p><p class="rl-mini">Find the anchor word <strong>${safe(focus)}</strong> in this sentence. Tap the matching word tile.</p><div class="rl-tiles">${options.map(o=>`<button class="rl-tile rl-choice ${a.selected===o?'selected':''}" data-choice="${safe(o)}">${safe(o)}</button>`).join('')}</div>`;
 }else if(a.stage===1){const rule=a.item.rule||a.item.goal||'Choose a clear, accurate English expression.', options=shuffle([rule,'This pattern must never be used in a complete sentence.','This expression has the same meaning in every situation without exceptions.'],a.item.id+'understand').map(x=>x.v);
  zone.innerHTML=`<h3>Which teaching note is accurate?</h3><p class="rl-mini">Examine each explanation, then select the one that accurately describes the model.</p><div class="rl-tiles rl-choices">${options.map(o=>`<button class="rl-tile rl-choice ${a.selected===o?'selected':''}" data-choice="${safe(o)}">${safe(o)}</button>`).join('')}</div>`;
 }else if(a.stage===2){let chosen=a.chosen.map(i=>a.bank[i].v).join(' '),options=a.bank.map((x,i)=>({...x,key:i})).filter(x=>!a.chosen.includes(x.key));
  zone.innerHTML=`<h3>Assemble a complete sentence</h3><div class="rl-zone" id="rlAnswerZone">${chosen?safe(chosen):'<span class="rl-mini">Tap the blocks below to construct the sentence...</span>'}</div><div class="rl-tiles">${options.map(x=>`<button class="rl-tile" data-word="${x.key}">${safe(x.v)}</button>`).join('')}</div><button class="rl-btn alt rl-cta" id="rlUndo">↶ Undo word</button>`;
  zone.querySelector('#rlUndo').onclick=()=>{a.chosen.pop();paintPuzzle()};
  zone.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{a.chosen.push(Number(b.dataset.word));paintPuzzle()});
 }else if(a.stage===3){let original=sentence,incorrect=firstChangedSentence(original),options=shuffle([original,incorrect],a.item.id+'repair').map(x=>x.v);
  zone.innerHTML=`<h3>Repair the sentence</h3><p class="rl-mini">Compare the sentence forms. Tap the accurate, appropriately punctuated version.</p><div class="rl-tiles rl-choices">${options.map(o=>`<button class="rl-tile rl-choice ${a.selected===o?'selected':''}" data-choice="${safe(o)}">${safe(o)}</button>`).join('')}</div>`;
 }else{let prompt=a.stage===4?'Write a different sentence using the same language pattern.':'Respond to the real-world scenario using a clear point, a reason and a next step.';
  zone.innerHTML=`<h3>${a.stage===4?'Produce your own English':'Your real-world mission'}</h3><p class="rl-mini">${safe(prompt)}</p>${a.stage===5?`<p class="rl-speech">${safe(a.item.scenario||a.item.prompt||a.item.text||a.item.speaker||a.item.goal||a.item.title)}</p>`:''}${a.section==='ielts'?`<div class="rl-timer" id="rlClock">${Math.floor(a.seconds/60)}:${String(a.seconds%60).padStart(2,'0')}</div><button class="rl-btn alt" id="rlStartTimer">Start 60-second preparation</button>`:''}<textarea id="rlWriting" class="rl-textarea" aria-label="Write your English response" placeholder="Write your own English here...">${safe(a.typed||'')}</textarea><p class="rl-mini">This browser checks structure and length, not full grammatical or IELTS-band accuracy.</p>`;
  zone.querySelector('#rlWriting').oninput=e=>a.typed=e.target.value;
  const timer=zone.querySelector('#rlStartTimer');if(timer)timer.onclick=()=>{if(a.timer)return;a.timer=setInterval(()=>{a.seconds--;const c=document.getElementById('rlClock');if(c)c.textContent=`${Math.floor(Math.max(0,a.seconds)/60)}:${String(Math.max(0,a.seconds)%60).padStart(2,'0')}`;if(a.seconds<=0){clearInterval(a.timer);a.timer=null;audio.success()}},1000)};
 }
 zone.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{a.selected=b.dataset.choice;zone.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('selected',x===b))});
}
function feedback(ok,title,message){const f=document.getElementById('rlFeedback');if(!f)return;f.className='rl-feedback'+(ok?' good':' bad');f.innerHTML=`<strong>${safe(title)}</strong><p>${safe(message)}</p>${ok?'<button class="rl-btn" id="rlNext">Next step →</button>':'<button class="rl-btn alt" id="rlRetry">Try again</button>'}`;f.hidden=false;
 const next=f.querySelector('#rlNext');if(next)next.onclick=()=>{const a=state.active;if(!a)return;if(a.timer){clearInterval(a.timer);a.timer=null}if(a.stage<5){a.stage++;a.chosen=[];a.typed='';a.selected=null;a.seconds=60;paintLesson()}else{markCompleted(a);const section=a.section,list=dataFor(section),at=list.findIndex(x=>x.id===a.item.id);closeLesson();if(at+1<list.length&&confirm('Activity complete! Open the next '+section+' lesson?'))start(section,list[at+1].id)}};
 const retry=f.querySelector('#rlRetry');if(retry)retry.onclick=()=>f.hidden=true;
}
function check(){const a=state.active;if(!a)return;let ok=false,reason='',correct='';const sentence=exampleSentence(a),answerZone=document.getElementById('rlAnswerZone');
 if(a.stage===0){correct=keyWord(a);ok=a.selected===correct;reason='Find and tap the anchor word shown beneath the example.'}
 else if(a.stage===1){correct=a.item.rule||a.item.goal||'Choose a clear, accurate English expression.';ok=a.selected===correct;reason='Read the teaching note carefully. An absolute claim with “never” or “every situation” is unlikely to be correct.'}
 else if(a.stage===2){const actual=a.chosen.map(i=>a.bank[i].v);ok=actual.length===a.tokens.length&&actual.every((x,i)=>x===a.tokens[i]);reason='Begin with “'+a.tokens.slice(0,Math.min(3,a.tokens.length)).join(' ')+'”, then add the remaining blocks in the model order.'}
 else if(a.stage===3){correct=sentence;ok=a.selected===correct;reason='Look for correct capital letters, punctuation and word order.'}
 else{const text=(a.typed||'').trim(),wordCount=terms(text).length,hasSentence=/\b(?:am|is|are|was|were|have|has|had|do|does|did|can|could|would|should|will|be|been|have|had|are|I|you|we|they|he|she|it|there)\b/i.test(text);ok=wordCount>=(a.stage===4?9:18)&&/[.!?]$/.test(text)&&hasSentence;reason='Write '+(a.stage===4?'at least nine':'at least eighteen')+' words, a clear grammatical subject and verb, a specific detail and sentence-ending punctuation. You can use more than one sentence.'}
 const selectedNodes=document.querySelectorAll('.rl-choice.selected');selectedNodes.forEach(node=>{node.classList.remove('right','wrong');node.classList.add(ok?'right':'wrong')});
 if(answerZone){answerZone.style.background=ok?'#10b981':'#ef4444';answerZone.style.color='#fff';answerZone.style.borderColor=ok?'#059669':'#dc2626'}
 if(ok){audio.success();feedback(true,a.stage===5?'Mission submitted!':'Excellent work!',a.stage>=4?'Your response passes basic structure checks. This is not an automated guarantee of grammar or IELTS accuracy.':'That matches the lesson model. Progress to the next stage.')}else{a.mistakes++;audio.error();feedback(false,'Try another approach',reason)}
}
function markCompleted(a){let key=a.section+':'+a.item.id;if(!state.wins[key]){state.wins[key]={day:dateKey(),mistakes:a.mistakes};const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);let p=[yesterday.getFullYear(),String(yesterday.getMonth()+1).padStart(2,'0'),String(yesterday.getDate()).padStart(2,'0')].join('-');state.streak=state.day===p?state.streak+1:state.day===dateKey()?Math.max(1,state.streak):1;state.day=dateKey()}state.attempts[key]=(state.attempts[key]||0)+1;save()}
function issueClick(evt){let target=evt.target.closest('button,a');if(target)audio.click()}
document.addEventListener('click',issueClick,{capture:true});root.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.section){state.section=b.dataset.section;state.search='';state.level='all';render()}else if(b.dataset.open){start(b.dataset.open,b.dataset.id)}else if(b.dataset.upgrade)paywall(b.dataset.upgrade);else if(b.id==='rlSound'){state.sound=!state.sound;save();render()}});
root.addEventListener('input',e=>{if(e.target.id==='rlSearch'){state.search=e.target.value;renderCards()}});root.addEventListener('change',e=>{if(e.target.id==='rlLevel'){state.level=e.target.value;renderCards()}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.active)closeLesson();const wall=document.getElementById('rlPaywall');if(wall)wall.hidden=true}});
// Time tracking while a challenge is active and browser tab is in foreground.
let activityAt=Date.now();document.addEventListener('pointerdown',()=>activityAt=Date.now(),{passive:true});document.addEventListener('keydown',()=>activityAt=Date.now());setInterval(()=>{if(!state.active||document.hidden||Date.now()-activityAt>60000)return;let today=dateKey();state.minutes[today]=(state.minutes[today]||0)+.25;save()},15000);
// Preview only. Real entitlements must be returned by your Stripe-verifying server.
const q=new URLSearchParams(location.search);if(q.get('preview')==='1'&&TIERS[q.get('tier')]!==undefined)state.tier=q.get('tier');
render();
})();
</script></body></html>

*,*::before,*::after{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;color:var(--rl-ink);font-family:'DM Sans','Segoe UI',Arial,sans-serif;background:radial-gradient(circle at 85% 12%,#e9deff 0,transparent 32%),var(--rl-bg)}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #a17eeb;outline-offset:3px}button:disabled{opacity:.48;cursor:not-allowed}button{transition:transform .16s,box-shadow .16s,background .16s}button:not(:disabled):hover{transform:translateY(-2px)}button:not(:disabled):active{transform:translateY(2px) scale(.985)}[hidden]{display:none!important}
.rl-header{position:sticky;top:0;z-index:20;background:linear-gradient(108deg,#27143f,#49257e);color:white;min-height:77px;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:11px clamp(16px,4vw,60px);box-shadow:0 6px 20px #2c124b24}.rl-brand{display:flex;align-items:center;gap:12px}.rl-logo{width:48px;height:48px;display:grid;place-items:center;font-size:19px;font-weight:900;border:2px solid #d8afff;border-radius:14px;color:white;background:#ffffff16}.rl-brand strong{font-size:16px;display:block}.rl-brand small{display:block;font-size:11px;letter-spacing:1.3px;color:#e3d1f5}.rl-actions{display:flex;align-items:center;gap:9px}.rl-link{color:white;font-size:13px;text-decoration:none;padding:8px;border-radius:7px}.rl-link:hover{background:#ffffff14}.rl-pill{font-size:11px;font-weight:800;white-space:nowrap;background:#ffffff22;color:white;padding:9px 12px;border:1px solid #ffffff33;border-radius:60px}
.rl-layout{display:grid;grid-template-columns:minmax(0,242px) minmax(0,1fr);min-height:calc(100dvh - 77px)}.rl-sidebar{background:#fff;border-right:1px solid var(--rl-line);padding:21px 14px}.rl-sidebar h2{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:#a492bc;margin:8px 11px 12px}.rl-sidebtn{border:0;border-radius:12px;background:transparent;color:#443457;width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;padding:12px;margin-bottom:4px;font-size:13px;font-weight:750}.rl-sidebtn:hover,.rl-sidebtn[aria-current=page]{background:#f0eaff;color:#5e37a0}.rl-main{min-width:0;padding:clamp(16px,3vw,37px);max-width:1550px;width:100%;margin:0 auto}.rl-hero{position:relative;background:linear-gradient(120deg,#2e174e,#5f37a6 70%,#a85fc0);border-radius:25px;color:white;padding:32px clamp(24px,3.5vw,55px);min-height:200px;overflow:hidden}.rl-hero::after{content:'✦';position:absolute;right:35px;top:-35px;font-size:240px;color:#ffffff11;pointer-events:none}.rl-eyebrow{font-size:11px;letter-spacing:2px;font-weight:850;text-transform:uppercase;color:#cbaaf4}.rl-hero h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(28px,4vw,45px);line-height:1.08;margin:12px 0}.rl-hero p{line-height:1.6;max-width:650px;color:#eddefd}.rl-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px 0}.rl-stat{padding:18px;background:white;border-radius:17px;border:1px solid var(--rl-line);box-shadow:0 10px 23px #2d144411}.rl-stat b{display:block;font-size:27px;color:#6436a1}.rl-stat small{color:#716780;font-size:12px}.rl-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:25px 0 17px}.rl-toolbar h2{margin:0 auto 0 0;font-size:clamp(19px,2vw,27px)}.rl-toolbar input{background:#fff;border:1px solid #ddd1ec;border-radius:10px;min-width:180px;padding:11px 13px;max-width:280px;width:100%}.rl-select{border:1px solid #d5c3ed;color:#5c3b8a;border-radius:10px;background:white;padding:11px}.rl-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.rl-card{min-width:0;overflow:hidden;background:white;border:1px solid var(--rl-line);border-radius:21px;text-align:left;box-shadow:0 5px 0 #e9e1f4,0 10px 27px #20133112;padding:0;display:flex;flex-direction:column;color:#241a3a}.rl-card:hover{box-shadow:0 8px 0 #e3d7f5,0 15px 31px #20133118}.rl-art{display:grid;place-items:center;width:100%;height:158px;overflow:hidden}.rl-art svg{height:100%;width:100%}.rl-cardmain{padding:17px;display:flex;flex:1;flex-direction:column;gap:8px}.rl-cardmain strong{font-size:16px;line-height:1.4}.rl-cardmain p{font-size:12px;line-height:1.55;color:var(--rl-muted);margin:0 0 8px;flex:1}.rl-cardfoot{display:flex;gap:8px;justify-content:space-between;align-items:center}.rl-tag{display:inline-flex;align-items:center;background:#f0eaff;color:#693e98;border-radius:8px;font-size:10px;font-weight:850;text-transform:uppercase;padding:6px 9px;letter-spacing:.4px}.rl-tag.gold{background:#fff1d8;color:#86601a}.rl-tag.platinum{background:#eadcf7;color:#69308a}.rl-tag.complete{background:#e7f7ef;color:#14815d}.rl-empty{grid-column:1/-1;background:white;border:1px solid var(--rl-line);border-radius:16px;padding:28px;text-align:center;color:var(--rl-muted)}.rl-btn{display:inline-flex;justify-content:center;align-items:center;gap:7px;background:#6c42ad;color:#fff;padding:11px 18px;border:0;border-radius:11px;font-size:13px;font-weight:850;box-shadow:0 4px 0 #442579}.rl-btn.alt{background:white;color:#55317e;border:1px solid #d7cae6;box-shadow:0 4px 0 #e5def0}.rl-btn:disabled{box-shadow:none}.rl-progress{height:10px;background:#ece4f7;border-radius:10px;overflow:hidden}.rl-progress>span{display:block;height:100%;background:linear-gradient(90deg,#683db7,#c36ddf);transition:width .3s}
.rl-lesson{position:fixed;inset:0;z-index:70;display:grid;grid-template-rows:68px minmax(0,1fr);background:var(--rl-bg);height:100dvh;overflow:hidden}.rl-lesson-top{display:flex;align-items:center;gap:16px;padding:9px 17px;background:white;border-bottom:1px solid var(--rl-line)}.rl-lesson-top strong{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:min(430px,33vw)}.rl-lesson-top .rl-progress{flex:1}.rl-workspace{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);gap:14px;padding:14px;min-height:0;overflow:hidden}.rl-teach,.rl-lab{background:white;border:1px solid var(--rl-line);border-radius:21px;min-height:0;overflow:auto;overscroll-behavior:contain;padding:clamp(18px,2.5vw,35px)}.rl-teach h2{font:700 clamp(25px,3vw,36px)/1.2 'Playfair Display',Georgia,serif}.rl-teach p{line-height:1.7;font-size:15px;color:#514961}.rl-hint{background:#f3edff;border:1px solid #e3d8f8;border-radius:14px;padding:18px;line-height:1.5;font-size:14px;color:#5f3d87}.rl-lab{position:relative;padding-bottom:98px;background:radial-gradient(circle at 85% 3%,#f4ebff,transparent 49%),white}.rl-lab h3{font-size:21px;margin:8px 0 18px}.rl-zone{border:2px dashed #c5b6de;background:#f8f5ff;border-radius:15px;min-height:95px;line-height:1.8;font-weight:780;word-wrap:break-word;padding:15px;margin-bottom:16px}.rl-tiles{display:flex;flex-wrap:wrap;gap:10px}.rl-tile{border-radius:11px;padding:11px 15px;color:#2f3449;border:1px solid #bbc8d8;background:#fff;box-shadow:0 3px 0 #dbe0eb;font-size:14px;font-weight:800}.rl-tile.selected{background:#eff6ff;border-color:#94a3b8}.rl-tile.correct{background:#10b981;border-color:#059669;color:white}.rl-tile.incorrect{background:#ef4444;border-color:#dc2626;color:white}.rl-textarea{width:100%;height:120px;resize:vertical;border-radius:13px;border:1px solid #bfc1d8;background:#fff;padding:13px;line-height:1.6}.rl-textarea:focus{outline:3px solid #c9b8ef}.rl-lab-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.rl-feedback{position:absolute;bottom:15px;left:16px;right:16px;z-index:8;box-shadow:0 18px 42px #19122c35;padding:15px 17px;background:white;border:1px solid #ded8eb;border-left:6px solid #10b981;border-radius:15px;max-height:40%;overflow:auto;animation:rl-up .2s ease-out}.rl-feedback.bad{border-left-color:#ef4444}.rl-feedback strong{display:block;margin-bottom:5px}.rl-feedback p{margin:0 0 12px;color:#5e596e;font-size:13px;line-height:1.5}@keyframes rl-up{from{opacity:.4;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.rl-paywall{position:fixed;z-index:90;inset:0;background:#1b1027b8;display:grid;place-items:center;padding:16px}.rl-dialog{width:min(460px,95vw);background:white;border-radius:23px;padding:26px;box-shadow:0 24px 60px #08040f6b}.rl-dialog h2{font:700 30px 'Playfair Display',Georgia,serif}.rl-dialog p{line-height:1.6;color:#595267}.rl-dialog .rl-btn{margin:5px}.rl-note{font-size:12px;color:#8f6171;padding:12px;background:#fff3f5;border-radius:11px}.rl-steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.rl-step{padding:7px 12px;border-radius:999px;background:#f2eef9;color:#685784;font-size:12px;font-weight:800}.rl-step.current{background:#6741af;color:white}.rl-cta{margin-top:10px}.rl-navtop{display:flex;align-items:center;gap:9px}.rl-count{color:#7b7088;font-size:12px}.rl-speech{line-height:1.75;background:#f6f1ff;border-radius:16px;padding:20px;color:#3e3550}.rl-timer{font-size:38px;font-weight:900;color:#603a9b}.rl-mini{font-size:12px;color:#756c83}.rl-highlight{background:#e9dcff;padding:2px 5px;border-radius:5px}
@media(max-width:1080px){.rl-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.rl-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

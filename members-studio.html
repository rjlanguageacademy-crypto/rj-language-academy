<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#49257e"><title>Learning Studios | RJ Language Academy</title><meta name="description" content="RJ Silver, Gold and Platinum guided British English lessons, interactive reading, conversations and IELTS preparation."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>:root{--rl-ink:#241b3d;--rl-muted:#6b6680;--rl-line:#e6dff1;--rl-violet:#6642ad;--rl-bg:#f8f6fd;--rl-green:#10b981;--rl-red:#ef4444}
*,*::before,*::after{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;color:var(--rl-ink);font-family:'DM Sans','Segoe UI',Arial,sans-serif;background:radial-gradient(circle at 85% 12%,#e9deff 0,transparent 32%),var(--rl-bg)}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #a17eeb;outline-offset:3px}button:disabled{opacity:.48;cursor:not-allowed}button{transition:transform .16s,box-shadow .16s,background .16s}button:not(:disabled):hover{transform:translateY(-2px)}button:not(:disabled):active{transform:translateY(2px) scale(.985)}[hidden]{display:none!important}
.rl-header{position:sticky;top:0;z-index:20;background:linear-gradient(108deg,#27143f,#49257e);color:white;min-height:77px;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:11px clamp(16px,4vw,60px);box-shadow:0 6px 20px #2c124b24}.rl-brand{display:flex;align-items:center;gap:12px}.rl-logo{width:48px;height:48px;display:grid;place-items:center;font-size:19px;font-weight:900;border:2px solid #d8afff;border-radius:14px;color:white;background:#ffffff16}.rl-brand strong{font-size:16px;display:block}.rl-brand small{display:block;font-size:11px;letter-spacing:1.3px;color:#e3d1f5}.rl-actions{display:flex;align-items:center;gap:9px}.rl-link{color:white;font-size:13px;text-decoration:none;padding:8px;border-radius:7px}.rl-link:hover{background:#ffffff14}.rl-pill{font-size:11px;font-weight:800;white-space:nowrap;background:#ffffff22;color:white;padding:9px 12px;border:1px solid #ffffff33;border-radius:60px}
.rl-layout{display:grid;grid-template-columns:minmax(0,242px) minmax(0,1fr);min-height:calc(100dvh - 77px)}.rl-sidebar{background:#fff;border-right:1px solid var(--rl-line);padding:21px 14px}.rl-sidebar h2{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:#a492bc;margin:8px 11px 12px}.rl-sidebtn{border:0;border-radius:12px;background:transparent;color:#443457;width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;padding:12px;margin-bottom:4px;font-size:13px;font-weight:750}.rl-sidebtn:hover,.rl-sidebtn[aria-current=page]{background:#f0eaff;color:#5e37a0}.rl-main{min-width:0;padding:clamp(16px,3vw,37px);max-width:1550px;width:100%;margin:0 auto}.rl-hero{position:relative;background:linear-gradient(120deg,#2e174e,#5f37a6 70%,#a85fc0);border-radius:25px;color:white;padding:32px clamp(24px,3.5vw,55px);min-height:200px;overflow:hidden}.rl-hero::after{content:'✦';position:absolute;right:35px;top:-35px;font-size:240px;color:#ffffff11;pointer-events:none}.rl-eyebrow{font-size:11px;letter-spacing:2px;font-weight:850;text-transform:uppercase;color:#cbaaf4}.rl-hero h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(28px,4vw,45px);line-height:1.08;margin:12px 0}.rl-hero p{line-height:1.6;max-width:650px;color:#eddefd}.rl-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px 0}.rl-stat{padding:18px;background:white;border-radius:17px;border:1px solid var(--rl-line);box-shadow:0 10px 23px #2d144411}.rl-stat b{display:block;font-size:27px;color:#6436a1}.rl-stat small{color:#716780;font-size:12px}.rl-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:25px 0 17px}.rl-toolbar h2{margin:0 auto 0 0;font-size:clamp(19px,2vw,27px)}.rl-toolbar input{background:#fff;border:1px solid #ddd1ec;border-radius:10px;min-width:180px;padding:11px 13px;max-width:280px;width:100%}.rl-select{border:1px solid #d5c3ed;color:#5c3b8a;border-radius:10px;background:white;padding:11px}.rl-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.rl-card{min-width:0;overflow:hidden;background:white;border:1px solid var(--rl-line);border-radius:21px;text-align:left;box-shadow:0 5px 0 #e9e1f4,0 10px 27px #20133112;padding:0;display:flex;flex-direction:column;color:#241a3a}.rl-card:hover{box-shadow:0 8px 0 #e3d7f5,0 15px 31px #20133118}.rl-art{display:grid;place-items:center;width:100%;height:158px;overflow:hidden}.rl-art svg{height:100%;width:100%}.rl-cardmain{padding:17px;display:flex;flex:1;flex-direction:column;gap:8px}.rl-cardmain strong{font-size:16px;line-height:1.4}.rl-cardmain p{font-size:12px;line-height:1.55;color:var(--rl-muted);margin:0 0 8px;flex:1}.rl-cardfoot{display:flex;gap:8px;justify-content:space-between;align-items:center}.rl-tag{display:inline-flex;align-items:center;background:#f0eaff;color:#693e98;border-radius:8px;font-size:10px;font-weight:850;text-transform:uppercase;padding:6px 9px;letter-spacing:.4px}.rl-tag.gold{background:#fff1d8;color:#86601a}.rl-tag.platinum{background:#eadcf7;color:#69308a}.rl-tag.complete{background:#e7f7ef;color:#14815d}.rl-empty{grid-column:1/-1;background:white;border:1px solid var(--rl-line);border-radius:16px;padding:28px;text-align:center;color:var(--rl-muted)}.rl-btn{display:inline-flex;justify-content:center;align-items:center;gap:7px;background:#6c42ad;color:#fff;padding:11px 18px;border:0;border-radius:11px;font-size:13px;font-weight:850;box-shadow:0 4px 0 #442579}.rl-btn.alt{background:white;color:#55317e;border:1px solid #d7cae6;box-shadow:0 4px 0 #e5def0}.rl-btn:disabled{box-shadow:none}.rl-progress{height:10px;background:#ece4f7;border-radius:10px;overflow:hidden}.rl-progress>span{display:block;height:100%;background:linear-gradient(90deg,#683db7,#c36ddf);transition:width .3s}
.rl-lesson{position:fixed;inset:0;z-index:70;display:grid;grid-template-rows:68px minmax(0,1fr);background:var(--rl-bg);height:100dvh;overflow:hidden}.rl-lesson-top{display:flex;align-items:center;gap:16px;padding:9px 17px;background:white;border-bottom:1px solid var(--rl-line)}.rl-lesson-top strong{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:min(430px,33vw)}.rl-lesson-top .rl-progress{flex:1}.rl-workspace{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);gap:14px;padding:14px;min-height:0;overflow:hidden}.rl-teach,.rl-lab{background:white;border:1px solid var(--rl-line);border-radius:21px;min-height:0;overflow:auto;overscroll-behavior:contain;padding:clamp(18px,2.5vw,35px)}.rl-teach h2{font:700 clamp(25px,3vw,36px)/1.2 'Playfair Display',Georgia,serif}.rl-teach p{line-height:1.7;font-size:15px;color:#514961}.rl-hint{background:#f3edff;border:1px solid #e3d8f8;border-radius:14px;padding:18px;line-height:1.5;font-size:14px;color:#5f3d87}.rl-lab{position:relative;padding-bottom:98px;background:radial-gradient(circle at 85% 3%,#f4ebff,transparent 49%),white}.rl-lab h3{font-size:21px;margin:8px 0 18px}.rl-zone{border:2px dashed #c5b6de;background:#f8f5ff;border-radius:15px;min-height:95px;line-height:1.8;font-weight:780;word-wrap:break-word;padding:15px;margin-bottom:16px}.rl-tiles{display:flex;flex-wrap:wrap;gap:10px}.rl-tile{border-radius:11px;padding:11px 15px;color:#2f3449;border:1px solid #bbc8d8;background:#fff;box-shadow:0 3px 0 #dbe0eb;font-size:14px;font-weight:800}.rl-tile.selected{background:#eff6ff;border-color:#94a3b8}.rl-tile.correct{background:#10b981;border-color:#059669;color:white}.rl-tile.incorrect{background:#ef4444;border-color:#dc2626;color:white}.rl-textarea{width:100%;height:120px;resize:vertical;border-radius:13px;border:1px solid #bfc1d8;background:#fff;padding:13px;line-height:1.6}.rl-textarea:focus{outline:3px solid #c9b8ef}.rl-lab-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.rl-feedback{position:absolute;bottom:15px;left:16px;right:16px;z-index:8;box-shadow:0 18px 42px #19122c35;padding:15px 17px;background:white;border:1px solid #ded8eb;border-left:6px solid #10b981;border-radius:15px;max-height:40%;overflow:auto;animation:rl-up .2s ease-out}.rl-feedback.bad{border-left-color:#ef4444}.rl-feedback strong{display:block;margin-bottom:5px}.rl-feedback p{margin:0 0 12px;color:#5e596e;font-size:13px;line-height:1.5}@keyframes rl-up{from{opacity:.4;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.rl-paywall{position:fixed;z-index:90;inset:0;background:#1b1027b8;display:grid;place-items:center;padding:16px}.rl-dialog{width:min(460px,95vw);background:white;border-radius:23px;padding:26px;box-shadow:0 24px 60px #08040f6b}.rl-dialog h2{font:700 30px 'Playfair Display',Georgia,serif}.rl-dialog p{line-height:1.6;color:#595267}.rl-dialog .rl-btn{margin:5px}.rl-note{font-size:12px;color:#8f6171;padding:12px;background:#fff3f5;border-radius:11px}.rl-steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.rl-step{padding:7px 12px;border-radius:999px;background:#f2eef9;color:#685784;font-size:12px;font-weight:800}.rl-step.current{background:#6741af;color:white}.rl-cta{margin-top:10px}.rl-navtop{display:flex;align-items:center;gap:9px}.rl-count{color:#7b7088;font-size:12px}.rl-speech{line-height:1.75;background:#f6f1ff;border-radius:16px;padding:20px;color:#3e3550}.rl-timer{font-size:38px;font-weight:900;color:#603a9b}.rl-mini{font-size:12px;color:#756c83}.rl-highlight{background:#e9dcff;padding:2px 5px;border-radius:5px}
@media(max-width:1080px){.rl-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.rl-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:750px){.rl-layout{grid-template-columns:1fr}.rl-sidebar{display:flex;overflow-x:auto;gap:5px;padding:9px;position:sticky;top:74px;z-index:15}.rl-sidebar h2{display:none}.rl-sidebtn{width:auto;white-space:nowrap;margin:0;padding:9px;font-size:12px}.rl-header{padding:8px 12px;min-height:68px}.rl-brand strong{font-size:12px}.rl-brand small{font-size:9px}.rl-logo{width:40px;height:40px}.rl-link{font-size:11px}.rl-main{padding:13px}.rl-grid{grid-template-columns:1fr}.rl-hero{padding:23px}.rl-stats{gap:9px}.rl-stat b{font-size:23px}.rl-workspace{grid-template-columns:1fr;grid-template-rows:minmax(145px,.37fr) minmax(0,.63fr);gap:7px;padding:8px}.rl-teach,.rl-lab{padding:15px}.rl-teach h2{font-size:20px;margin:4px 0}.rl-teach p{font-size:12px}.rl-hint{padding:10px;font-size:12px}.rl-lesson-top{height:66px;gap:6px;padding:7px}.rl-lesson-top strong{max-width:115px;font-size:11px}.rl-lab{padding-bottom:95px}.rl-lab h3{font-size:17px}.rl-feedback{bottom:7px;left:8px;right:8px;max-height:48%}.rl-cardfoot{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><div id="rlApp" aria-label="RJ Language Academy learning studios"></div><script>window.RJLoopContent = {"silver":[{"id":"introduce-yourself-naturally","tier":"silver","title":"Introduce Yourself Naturally","goal":"Introduce yourself, give useful details and ask a follow-up question.","rule":"A natural introduction normally gives your name, where you are from and one relevant detail. In a first conversation, leave space for the other person to reply. Ask a question instead of delivering a long speech.","sentence":"Hi, I'm Mina. I'm from Bangkok, but I live in Bedford now. What about you?","scenario":"A new colleague has joined your team in the UK. You meet at the coffee machine before work. They smile and ask whether you are new. Keep your answer friendly and brief, then help them join the conversation.","level":"A1","track":"Everyday British English"},{"id":"present-simple-and-present-continuous","tier":"silver","title":"Present Simple and Present Continuous","goal":"Choose accurately between routines and actions happening now.","rule":"Use the present simple for routines, habits and general facts: I work on Mondays. Use the present continuous for a temporary action happening now or around now: I'm working on a difficult project this week. Some state verbs, such as know, usually do not take the continuous form.","sentence":"I usually take the bus, but I'm walking to work today.","scenario":"A friend calls while you are preparing dinner. Tell them what you are doing now, what you usually do after work and why tonight is different. Contrast the two time frames clearly.","level":"A1","track":"Everyday British English"},{"id":"in-on-and-at-for-time","tier":"silver","title":"In, On and At for Time","goal":"Explain and use the main time prepositions correctly.","rule":"Use at for exact clock times, on for named days and dates, and in for months, years and broad parts of the day. Say at 8:30, on Friday, in October and in the morning. Some expressions are exceptions: at night, on Monday morning, at the weekend in common British usage.","sentence":"My interview is at half past ten on Tuesday in November.","scenario":"You are arranging a group lesson with students in three countries. You need to give a date, a day and an exact start time. Write an unambiguous confirmation that everyone can check later.","level":"A1–A2","track":"Everyday British English"},{"id":"tell-a-story-in-the-past","tier":"silver","title":"Tell a Story in the Past","goal":"Tell an understandable story using past simple and useful sequencing.","rule":"Use the past simple to report completed actions and events: arrived, missed, called, found. Time markers such as first, then, after that and finally help listeners follow the sequence. Keep the order clear and add a result or reaction at the end.","sentence":"Yesterday I missed the bus, so I walked to the station. Fortunately, I caught the next train.","scenario":"You arrived late for a meeting after your train was cancelled. Explain what happened without blaming everyone else. Give the sequence, what you tried and the eventual result.","level":"A2","track":"Everyday British English"},{"id":"will-going-to-and-arrangements","tier":"silver","title":"Will, Going To and Arrangements","goal":"Talk about predictions, decisions and plans naturally.","rule":"Use going to for intentions already decided and predictions based on visible evidence. Use will for a decision made at the moment of speaking or a general prediction. Use the present continuous with future time for arrangements already organised: I'm meeting Lara at six.","sentence":"I've booked the tickets. We're flying to Manchester on Friday. I think it'll be busy.","scenario":"Your friend asks you to help organise a weekend trip. Some things are already booked, some are intentions and one decision must be made immediately. Explain the differences accurately.","level":"A2","track":"Everyday British English"},{"id":"for-and-since-with-present-perfect","tier":"silver","title":"For and Since with Present Perfect","goal":"Describe how long something has continued until now.","rule":"Use for with a duration, such as for three months or for a long time. Use since with a starting point, such as since 2022 or since Monday. Present perfect links a past beginning to the present: I've lived here for two years. Present perfect continuous can emphasise an ongoing activity: I've been studying since breakfast.","sentence":"She's worked here since May, and she's been learning English for six months.","scenario":"You meet someone at an English-language meetup. They ask about your job, where you live and how long you have been learning English. Give three accurate answers with different time expressions.","level":"A2","track":"Everyday British English"},{"id":"to-and-for-purpose-and-benefit","tier":"silver","title":"To and For: Purpose and Benefit","goal":"Explain why something happens or who receives a benefit.","rule":"Use to plus the base verb when you mean purpose: I went online to book a ticket. Use for plus a noun or -ing form to describe function or benefit: This app is for learning vocabulary; the gift is for Sam. Do not put a plain verb directly after for when you mean purpose.","sentence":"I went to the library to study. This quiet room is for students.","scenario":"You are recommending a language course to a friend. Explain what the course is for, why you personally joined it and what activities it helps you do.","level":"A2","track":"Practical Grammar"},{"id":"but-although-and-however","tier":"silver","title":"But, Although and However","goal":"Connect contrasting ideas in complete sentences.","rule":"But joins contrasting clauses inside a sentence. Although introduces a dependent clause and can appear at the beginning or in the middle. However links two independent ideas and normally takes punctuation: The test was difficult. However, I finished it. Avoid starting a sentence with Although and forgetting the main clause.","sentence":"Although the train was delayed, we arrived on time. The journey was long, but comfortable.","scenario":"A hotel looks excellent in photographs, but its location is inconvenient and its rooms are expensive. Write a balanced review using three different ways to express contrast.","level":"A2","track":"Practical Grammar"},{"id":"articles-a-an-and-the","tier":"silver","title":"Articles: A, An and The","goal":"Make sentences more natural by choosing or omitting articles.","rule":"Use a or an when introducing one non-specific countable thing, and the when both speaker and listener know which thing is meant. Choose a or an by sound rather than spelling: an hour, a university. Many plural and uncountable general statements take no article: Books are useful; Water is essential.","sentence":"I saw a café near the station. The café had an outdoor table.","scenario":"A friend is visiting your town for the first time. Recommend a restaurant and a park. Introduce the places, then refer back to them naturally without repeating names.","level":"A2","track":"Practical Grammar"},{"id":"ask-for-directions-and-clarify","tier":"silver","title":"Ask for Directions and Clarify","goal":"Understand and give directions without getting lost.","rule":"Start with a clear landmark. Use go straight on, turn left, cross the road, opposite and next to. If a direction is unclear, ask for a repeat: Sorry, did you say the second left? Check the destination before walking away.","sentence":"Go past the bank, take the second right and the library is opposite the station.","scenario":"A visitor is trying to reach the library from the railway station. There are two turns and one confusing junction. Give precise directions and offer a clarification if they look uncertain.","level":"A2","track":"Real-Life Tasks"},{"id":"polite-requests-in-british-english","tier":"silver","title":"Polite Requests in British English","goal":"Make requests that sound friendly and appropriately formal.","rule":"Could you...? and Would you mind...? often sound less direct than an imperative. Add please where natural, but do not rely on please alone to make a command polite. With Would you mind, use an -ing verb: Would you mind opening the window? For a response, try Of course, No problem or I'm afraid I can't today.","sentence":"Could you send me the details when you have a moment, please?","scenario":"You need a colleague to swap a short shift and a receptionist to correct a booking. The situations require slightly different levels of formality. Choose wording carefully.","level":"A2","track":"Real-Life Tasks"},{"id":"shopping-returns-and-refunds","tier":"silver","title":"Shopping, Returns and Refunds","goal":"Explain a shopping problem and ask for a reasonable solution.","rule":"State what you bought, when you bought it and what went wrong. Use clear factual language and an appropriate request: Could I exchange it? I would like a refund, please. Distinguish a refund, a replacement and an exchange.","sentence":"I bought these headphones last Saturday, but the left side doesn't work. Could I have a replacement?","scenario":"You bought a kettle that stopped working after two days. A shop assistant asks what happened and whether you have a receipt. Explain the situation and ask for your preferred outcome.","level":"A2","track":"Real-Life Tasks"},{"id":"silver-extension-0","tier":"silver","title":"Subject and Verb Agreement","goal":"Match singular subjects with the right verb.","rule":"Match singular subjects with the right verb. Watch the sentence structure as you work through the activity.","sentence":"The new student enjoys British English lessons.","scenario":"Use this language in an everyday British English situation.","level":"A1–A2","track":"Syntax Builders"},{"id":"silver-extension-1","tier":"silver","title":"Polite Sentence Order","goal":"Assemble a respectful classroom request.","rule":"Assemble a respectful classroom request. Watch the sentence structure as you work through the activity.","sentence":"Could you explain the instructions once more?","scenario":"Use this language in an everyday British English situation.","level":"A1–A2","track":"Syntax Builders"},{"id":"silver-extension-2","tier":"silver","title":"Negatives With Do and Does","goal":"Build a negative statement with an auxiliary.","rule":"Build a negative statement with an auxiliary. Watch the sentence structure as you work through the activity.","sentence":"My brother does not drink coffee.","scenario":"Use this language in an everyday British English situation.","level":"A1–A2","track":"Syntax Builders"},{"id":"silver-extension-3","tier":"silver","title":"Question Word Workshop","goal":"Arrange a clear information question.","rule":"Arrange a clear information question. Watch the sentence structure as you work through the activity.","sentence":"Where does your friend work on Fridays?","scenario":"Use this language in an everyday British English situation.","level":"A1–A2","track":"Syntax Builders"},{"id":"silver-extension-4","tier":"silver","title":"Prepositions for Places","goal":"Place objects using accurate prepositions.","rule":"Place objects using accurate prepositions. Watch the sentence structure as you work through the activity.","sentence":"The blue notebook is on the desk.","scenario":"Use this language in an everyday British English situation.","level":"A1–A2","track":"Daily Grammar Clinics"},{"id":"silver-extension-5","tier":"silver","title":"Everyday Adverbs","goal":"Put frequency adverbs in natural positions.","rule":"Put frequency adverbs in natural positions. Watch the sentence structure as you work through the activity.","sentence":"She usually catches the early bus.","scenario":"Use this language in an everyday British English situation.","level":"A1–A2","track":"Daily Grammar Clinics"},{"id":"silver-extension-6","tier":"silver","title":"Vocabulary: Around the Home","goal":"Practise language for household tasks.","rule":"Practise language for household tasks. Watch the sentence structure as you work through the activity.","sentence":"Please put the clean dishes in the cupboard.","scenario":"Use this language in an everyday British English situation.","level":"A1–A2","track":"Daily Grammar Clinics"},{"id":"silver-extension-7","tier":"silver","title":"Vocabulary: Shopping","goal":"Handle a typical shop conversation.","rule":"Handle a typical shop conversation. Watch the sentence structure as you work through the activity.","sentence":"I would like to return this jacket please.","scenario":"Use this language in an everyday British English situation.","level":"A1–A2","track":"Daily Grammar Clinics"},{"id":"silver-extension-8","tier":"silver","title":"Vocabulary: Work and Study","goal":"Use vocabulary for work and education.","rule":"Use vocabulary for work and education. Watch the sentence structure as you work through the activity.","sentence":"I have an appointment with my tutor tomorrow.","scenario":"Use this language in an everyday British English situation.","level":"A1–A2","track":"Vocabulary Flashcards"},{"id":"silver-extension-9","tier":"silver","title":"Vocabulary: Travel","goal":"Understand useful travel words.","rule":"Understand useful travel words. Watch the sentence structure as you work through the activity.","sentence":"We need to change trains at Birmingham.","scenario":"Use this language in an everyday British English situation.","level":"A1–A2","track":"Vocabulary Flashcards"},{"id":"silver-extension-10","tier":"silver","title":"Vocabulary: Food and Orders","goal":"Use polite restaurant vocabulary.","rule":"Use polite restaurant vocabulary. Watch the sentence structure as you work through the activity.","sentence":"Could we have the bill when you are ready?","scenario":"Use this language in an everyday British English situation.","level":"A1–A2","track":"Vocabulary Flashcards"},{"id":"silver-extension-11","tier":"silver","title":"Pronunciation: Word Stress","goal":"Notice meaning and stress in English words.","rule":"Notice meaning and stress in English words. Watch the sentence structure as you work through the activity.","sentence":"The photographer captured a beautiful sunset.","scenario":"Use this language in an everyday British English situation.","level":"A1–A2","track":"Vocabulary Flashcards"}],"gold":[{"id":"change-an-appointment-professionally","tier":"gold","title":"Change an Appointment Professionally","goal":"Reschedule a booking politely and confirm the new arrangement.","rule":"A complete rescheduling message acknowledges the original booking, explains briefly that you cannot attend, proposes one or two alternatives and asks for confirmation. Use Could we move...?, Would Tuesday suit you? and Thank you for understanding. Avoid giving unnecessary personal details.","sentence":"I'm afraid I can't make our appointment on Thursday. Would Friday morning be possible instead?","scenario":"You have a dental appointment on Thursday but your work schedule has changed. You need to reschedule without sounding careless. The receptionist offers a time that you cannot accept.","level":"B1","track":"Confident Conversations"},{"id":"present-perfect-or-past-simple","tier":"gold","title":"Present Perfect or Past Simple?","goal":"Distinguish life experience, continuing situations and finished past events.","rule":"Use present perfect when the exact finished time is not important or the period connects to now: I've visited Scotland twice. Use past simple when you name a finished time: I visited Edinburgh in 2023. With yesterday, last week and in 2020, past simple is usually the correct choice.","sentence":"I've tried Thai food, but I first tried it when I visited Bangkok in 2024.","scenario":"A new colleague asks about countries you have visited and the most interesting trip you took. Start with experience and then move to specific events and dates.","level":"B1","track":"Confident Conversations"},{"id":"tell-better-stories-with-past-perfect","tier":"gold","title":"Tell Better Stories with Past Perfect","goal":"Make the order of two past events clear.","rule":"Past perfect, had plus past participle, can show that one past event occurred before another past event: By the time I arrived, the meeting had started. You do not need past perfect in every sentence. Establish the earlier event once, then continue naturally with past simple.","sentence":"When I reached the platform, the train had already left, so I called my colleague.","scenario":"You arrive at a wedding and discover that the ceremony started early. Explain the chain of events that led to your late arrival and what had happened before you got there.","level":"B1","track":"Confident Conversations"},{"id":"first-and-second-conditionals","tier":"gold","title":"First and Second Conditionals","goal":"Choose between a likely future consequence and an imagined situation.","rule":"The first conditional uses if plus present simple, followed by will or another likely future result: If it rains, we'll stay inside. The second uses if plus past simple, often followed by would, for an imagined or less likely situation: If I had more time, I'd travel. Avoid putting will directly into the ordinary if-clause.","sentence":"If the train is late, I'll call you. If I had a car, I'd drive.","scenario":"You are planning an event on a rainy weekend. Explain what you will do if the weather changes. Then imagine how you would plan it differently with an unlimited budget.","level":"B1","track":"Grammar in Action"},{"id":"modals-for-advice-and-possibility","tier":"gold","title":"Modals for Advice and Possibility","goal":"Explain advice, certainty and uncertainty accurately.","rule":"Use should or ought to for advice, must for a strong obligation or deduction, might or may for possibility, and can't for a deduction that something is impossible. Context determines meaning: You must wear a badge is obligation; She must be tired is deduction. Avoid using mustn't to mean don't need to.","sentence":"You should check the timetable. He might be delayed. She must be exhausted.","scenario":"A new employee is worried about their first week. Give sensible advice, explain what is compulsory and speculate about why a colleague has not arrived.","level":"B1–B2","track":"Grammar in Action"},{"id":"write-clear-and-polite-emails","tier":"gold","title":"Write Clear and Polite Emails","goal":"Organise an email with purpose, action and next steps.","rule":"A useful professional email has a relevant subject, a brief opening, the reason for writing, a clear request and a courteous closing. Short paragraphs help the reader. Use Could you confirm...? for a request, and Please find attached... only if there really is an attachment.","sentence":"Subject: Updated meeting time. Hello Sam, Could we move our meeting to 2 pm? Please let me know if that works. Kind regards, Mina.","scenario":"A supplier has not sent a document you need for tomorrow. You want to follow up professionally, mention the deadline and suggest a quick alternative without sounding hostile.","level":"B1","track":"Workplace English"},{"id":"small-talk-without-awkwardness","tier":"gold","title":"Small Talk Without Awkwardness","goal":"Start, extend and close light workplace conversations.","rule":"Small talk often begins with a shared situation, such as the journey, weekend or event. Use open follow-up questions and brief personal answers. Respect boundaries: do not assume colleagues want to discuss salary, religion or private matters. Close naturally with Lovely chatting—I'd better get back.","sentence":"How was your weekend? That sounds lovely. Have you been there before?","scenario":"You are attending your first team lunch with people you hardly know. One colleague mentions a concert, while another describes a long commute. Keep the chat moving without interrogating either person.","level":"B1","track":"Workplace English"},{"id":"read-for-meaning-and-inference","tier":"gold","title":"Read for Meaning and Inference","goal":"Identify main ideas, implied meanings and evidence rather than guessing.","rule":"A text can state information directly or imply it through tone and context. First locate the writer's main claim. Next find the sentence that supports an inference. A plausible answer without textual support is still a guess. Distinguish fact from opinion and notice contrast markers such as however and despite.","sentence":"The café was full despite the rain. This suggests it was popular enough to attract customers in poor weather.","scenario":"An article says a council is extending library opening hours after more residents requested evening access. Read between the lines: what need is being addressed, and what information is still missing?","level":"B1–B2","track":"Reading and Writing"},{"id":"build-an-effective-paragraph","tier":"gold","title":"Build an Effective Paragraph","goal":"Use a topic sentence, explanation, evidence and a concluding link.","rule":"A focused paragraph usually develops one controlling idea. Begin with a topic sentence, explain why the idea matters, provide a specific example and connect it back to the question. Avoid adding several unrelated examples or repeating the same sentence in different words.","sentence":"Flexible study times help adults learn consistently. For example, a parent may study after putting the children to bed. This flexibility reduces missed lessons.","scenario":"You are writing an article about whether online courses can help busy adults. Your reader expects a clear argument and a concrete example, not a string of unsupported opinions.","level":"B2","track":"Reading and Writing"},{"id":"make-a-complaint-and-negotiate-a-solution","tier":"gold","title":"Make a Complaint and Negotiate a Solution","goal":"Be firm, respectful and specific about a service problem.","rule":"A persuasive complaint separates facts from feelings. Explain the problem, its impact and the solution you request. Use I was disappointed because..., Could you offer...?, and I would appreciate a reply by... Avoid accusations that you cannot prove.","sentence":"The room was not cleaned when we arrived. Could you move us to another room or arrange cleaning immediately?","scenario":"You have booked a hotel for an important trip. The room is noisy and the heating doesn't work. The receptionist suggests a small discount, but you need a usable room.","level":"B1–B2","track":"Real-Life Fluency"},{"id":"pronunciation-stress-and-intonation","tier":"gold","title":"Pronunciation: Stress and Intonation","goal":"Use emphasis and intonation to express meaning rather than reading every word equally.","rule":"English is stress-timed: important content words often receive stronger beats than grammar words. Sentence stress can change implied meaning: I wanted the BLUE one contrasts blue with other colours. Rising and falling intonation also help indicate unfinished thoughts, questions and certainty. Pronunciation practice is not simply speaking faster.","sentence":"I ordered the BLUE jacket, not the black one. I ORDERED it; I didn't just look at it.","scenario":"A shop assistant has brought the wrong size and colour. You need to correct the misunderstanding without sounding angry. Use contrastive stress so they understand exactly which detail is wrong.","level":"B2","track":"Real-Life Fluency"},{"id":"collocations-and-phrasal-verbs-in-context","tier":"gold","title":"Collocations and Phrasal Verbs in Context","goal":"Choose word combinations that sound natural in British English.","rule":"Collocations are words frequently used together, such as make a decision, heavy traffic and meet a deadline. Phrasal verbs may be separable or inseparable: turn the music down or turn down the music, but look after the children. Learn each expression with a complete example and register.","sentence":"We need to make a decision before Friday and follow up with the supplier.","scenario":"Your team is organising an event under pressure. Several colleagues use unnatural combinations. Rewrite their updates so the language sounds fluent and appropriate.","level":"B2","track":"Real-Life Fluency"},{"id":"gold-managing-misunderstandings-politely","tier":"gold","title":"Managing misunderstandings politely","goal":"Clarify misunderstandings without sounding defensive.","rule":"When there has been confusion, acknowledge the issue, describe the facts without blaming, and check the next action. Could we check what was agreed? and I may have misunderstood are useful softeners. State deadlines precisely.","sentence":"I think we may have understood the deadline differently. Could we confirm whether the report is due on Thursday or Friday?","scenario":"A colleague believes you agreed to send a report on Thursday, but your notes say Friday. Resolve the misunderstanding in a calm two-minute conversation.","level":"B1","track":"Workplace English"},{"id":"gold-making-comparisons-with-nuance","tier":"gold","title":"Making comparisons with nuance","goal":"Compare options and justify your preference with accurate structures.","rule":"Use comparative forms such as cheaper than and more convenient than for two options. Use as ... as to signal similar qualities. Add however or although to acknowledge a disadvantage. Avoid double comparatives such as more better.","sentence":"The train is slightly more expensive than the coach, but it is almost twice as fast.","scenario":"You are helping a visitor choose between a train, coach and taxi for a weekend journey. They care about cost and convenience.","level":"B1","track":"Practical Grammar"},{"id":"gold-present-perfect-versus-past-simple","tier":"gold","title":"Present perfect versus past simple","goal":"Connect experiences to the present and finished events to a past time.","rule":"Use the present perfect for experience or recent events relevant now when no finished past time is specified: I have visited York. Use past simple with finished time expressions: I visited York last year. Do not combine present perfect with yesterday or last Friday.","sentence":"I have visited Scotland twice. I went there most recently in 2024.","scenario":"A colleague asks you about places you have worked and a recent job interview. Distinguish experience from a particular finished event.","level":"B1","track":"Practical Grammar"},{"id":"gold-disagreeing-respectfully-in-meetings","tier":"gold","title":"Disagreeing respectfully in meetings","goal":"Challenge an idea while keeping colleagues engaged.","rule":"Lead with a shared aim, state a specific concern, give a reason and suggest an alternative. Try I see your point, but ... or Could we consider ...? Avoid attacking the speaker; address the proposal.","sentence":"I see why that might save time. My concern is the impact on customers. Could we trial it for one week?","scenario":"In a team meeting someone proposes shortening customer support hours. You disagree because customers may need evening support.","level":"B1","track":"Workplace English"},{"id":"gold-conditionals-for-real-decisions","tier":"gold","title":"Conditionals for real decisions","goal":"Use zero, first and second conditionals to discuss facts and possibilities.","rule":"Zero conditional describes usual results: If you heat water, it boils. First conditional describes a possible future: If it rains, we will stay in. Second conditional describes an unreal or less likely situation: If I had more time, I would practise more.","sentence":"If we finish early, we will take the later train. If I had a car, I would drive.","scenario":"You are planning an outdoor team event. Weather and transport may change, and a colleague asks about an unlikely alternative.","level":"B1","track":"Practical Grammar"},{"id":"gold-understanding-implied-meaning","tier":"gold","title":"Understanding implied meaning","goal":"Recognise polite indirect language and what speakers intend.","rule":"Meaning often depends on context rather than the literal words. I am not sure that will work may politely mean disagreement. Ask a checking question if important: Do you mean we should try another option? Distinguish a cautious suggestion from a confirmed decision.","sentence":"That might be difficult to arrange at short notice. Shall we look at next week?","scenario":"A manager says a proposal is interesting but may need more work. Decide whether it is approval, rejection or a request to revise.","level":"B1–B2","track":"Reading & Listening"},{"id":"gold-reporting-speech-accurately","tier":"gold","title":"Reporting speech accurately","goal":"Report another person’s request, suggestion and statement clearly.","rule":"After said, use a reported clause or include to someone: She said that she was busy; She told me that she was busy. For requests use asked someone to do something. Backshifting of tenses is common when reporting past conversations but not always compulsory for still-true statements.","sentence":"He said he was unavailable and asked me to call on Monday.","scenario":"After an important phone call, your colleague asks what the client said, requested and promised.","level":"B1","track":"Practical Grammar"},{"id":"gold-phrasal-verbs-in-everyday-life","tier":"gold","title":"Phrasal verbs in everyday life","goal":"Use common phrasal verbs meaningfully and avoid literal translations.","rule":"Phrasal verbs combine a verb with a particle: look up a word, put off a meeting, run out of time. Some are separable: turn the light off or turn it off, but not turn off it. Context determines the meaning.","sentence":"We ran out of time, so we put off the meeting until Friday.","scenario":"You are organising a community event. Supplies are low, one guest cancels and a schedule changes. Use natural phrasal verbs in updates.","level":"B1","track":"Vocabulary in Context"},{"id":"gold-writing-a-balanced-opinion","tier":"gold","title":"Writing a balanced opinion","goal":"Organise a nuanced opinion with evidence, contrast and a conclusion.","rule":"Introduce the issue and your position, support it with two distinct reasons, acknowledge one counterargument and end with a clear judgement. Linking words guide the reader, but ideas—not a long list of connectors—create coherence.","sentence":"Online lessons are convenient; however, some learners benefit from speaking with other people in real time.","scenario":"You are writing an article for an international student magazine: Should every university course include online learning?","level":"B1–B2","track":"Writing Studio"},{"id":"gold-complaints-and-service-recovery","tier":"gold","title":"Complaints and service recovery","goal":"Explain a service problem politely and request a practical resolution.","rule":"Give factual details first: when, where, what you expected and what occurred. Describe the impact without exaggerating. State an achievable request and offer a timeframe for a response. A calm tone can be firm.","sentence":"I ordered the blue model on 4 May, but received the black one. Could you arrange a replacement?","scenario":"A parcel arrives with the wrong product two days before a family celebration. Contact customer support and ask for the correct item or a refund.","level":"B1","track":"Real-Life Tasks"},{"id":"gold-managing-conversation-turns","tier":"gold","title":"Managing conversation turns","goal":"Participate naturally rather than dominating or giving one-word replies.","rule":"Use short responses to show listening: I see, Really? and That makes sense. Add a follow-up question before changing the topic. To interrupt politely, try Sorry to interrupt, could I just clarify one point? Avoid repeating the same filler constantly.","sentence":"That sounds challenging. How did you deal with it?","scenario":"You join a new study group. Two people are talking about their jobs; contribute one personal example without taking over.","level":"B1–B2","track":"Speaking Studio"},{"id":"gold-customer-service","tier":"gold","title":"Explaining a Product Problem","goal":"Describe a problem politely and ask for a practical solution.","rule":"Name the issue, add one detail and make a clear request.","sentence":"I received the wrong size so could you arrange an exchange?","scenario":"A shop has sent the wrong size of jacket. Ask the support agent for an exchange.","level":"B1","track":"Practical Communication"},{"id":"gold-office-follow-up","tier":"gold","title":"Following Up After a Meeting","goal":"Confirm decisions and responsibilities in a professional message.","rule":"A useful follow-up restates the decision, action and deadline.","sentence":"I will send the revised proposal by Thursday afternoon.","scenario":"After a project meeting, you need to confirm your next action to a colleague.","level":"B2","track":"Professional English"},{"id":"gold-extra-0","tier":"gold","title":"Handling a Rental Enquiry","goal":"Ask precise questions about accommodation.","rule":"Ask precise questions about accommodation. Connect the two main ideas clearly.","sentence":"Could you confirm whether the flat is available in November?","scenario":"Practise this skill in a realistic British English conversation.","level":"B1–B2","track":"Intermediate English"},{"id":"gold-extra-1","tier":"gold","title":"Describing Changing Habits","goal":"Explain an evolving routine.","rule":"Explain an evolving routine. Connect the two main ideas clearly.","sentence":"I have been travelling by train more often recently.","scenario":"Practise this skill in a realistic British English conversation.","level":"B1–B2","track":"Intermediate English"},{"id":"gold-extra-2","tier":"gold","title":"Clarifying an Appointment","goal":"Resolve a scheduling misunderstanding.","rule":"Resolve a scheduling misunderstanding. Connect the two main ideas clearly.","sentence":"I thought our meeting was scheduled for next Wednesday.","scenario":"Practise this skill in a realistic British English conversation.","level":"B1–B2","track":"Intermediate English"},{"id":"gold-extra-3","tier":"gold","title":"Expressing a Preference","goal":"Give a practical preference with a reason.","rule":"Give a practical preference with a reason. Connect the two main ideas clearly.","sentence":"I would rather travel early to avoid heavy traffic.","scenario":"Practise this skill in a realistic British English conversation.","level":"B1–B2","track":"Intermediate English"},{"id":"gold-extra-4","tier":"gold","title":"Summarising a Short Article","goal":"Present an author's main argument fairly.","rule":"Present an author's main argument fairly. Connect the two main ideas clearly.","sentence":"The article argues that exercise improves concentration.","scenario":"Practise this skill in a realistic British English conversation.","level":"B1–B2","track":"Intermediate English"},{"id":"gold-extra-5","tier":"gold","title":"Comparing Travel Options","goal":"Balance advantages and disadvantages.","rule":"Balance advantages and disadvantages. Connect the two main ideas clearly.","sentence":"Although the coach costs less, the train is quicker.","scenario":"Practise this skill in a realistic British English conversation.","level":"B1–B2","track":"Intermediate English"},{"id":"gold-extra-6","tier":"gold","title":"Presenting a Past Achievement","goal":"Describe an achievement with clear results.","rule":"Describe an achievement with clear results. Connect the two main ideas clearly.","sentence":"I managed to complete the project ahead of schedule.","scenario":"Practise this skill in a realistic British English conversation.","level":"B1–B2","track":"Intermediate English"},{"id":"gold-extra-7","tier":"gold","title":"Making a Conditional Suggestion","goal":"Offer a hypothetical alternative politely.","rule":"Offer a hypothetical alternative politely. Connect the two main ideas clearly.","sentence":"If we left earlier, we could avoid the traffic.","scenario":"Practise this skill in a realistic British English conversation.","level":"B1–B2","track":"Intermediate English"},{"id":"gold-extra-8","tier":"gold","title":"Explaining an Unexpected Delay","goal":"Describe a problem and its cause.","rule":"Describe a problem and its cause. Connect the two main ideas clearly.","sentence":"Due to a signal failure, our train arrived thirty minutes late.","scenario":"Practise this skill in a realistic British English conversation.","level":"B1–B2","track":"Intermediate English"},{"id":"gold-extra-9","tier":"gold","title":"Giving Constructive Feedback","goal":"Deliver balanced and helpful feedback.","rule":"Deliver balanced and helpful feedback. Connect the two main ideas clearly.","sentence":"Your introduction is clear, but the conclusion needs more detail.","scenario":"Practise this skill in a realistic British English conversation.","level":"B1–B2","track":"Intermediate English"},{"id":"gold-extra-10","tier":"gold","title":"Arranging a Follow-up Call","goal":"Make a professional next-step request.","rule":"Make a professional next-step request. Connect the two main ideas clearly.","sentence":"Would you be available to discuss the proposal tomorrow?","scenario":"Practise this skill in a realistic British English conversation.","level":"B1–B2","track":"Intermediate English"}],"platinum":[{"id":"advanced-linking-and-argument","tier":"platinum","title":"Advanced Linking and Argument","goal":"Build nuanced arguments with concession, contrast and consequence.","rule":"Use however for contrast between independent statements, whereas to compare differences, nevertheless to reinforce a surprising result, and therefore for a logical consequence. These words are not interchangeable. A good argument also addresses a reasonable objection rather than pretending no opposing view exists.","sentence":"Remote work saves commuting time; nevertheless, some employees miss informal collaboration.","scenario":"A company is considering four-day working weeks. Prepare a balanced briefing that acknowledges productivity, staffing, morale and possible difficulties. Use linking phrases only where their logical meaning fits.","level":"B2–C1","track":"Advanced British English"},{"id":"precision-register-and-nuance","tier":"platinum","title":"Precision, Register and Nuance","goal":"Choose vocabulary for audience, strength of claim and level of formality.","rule":"Advanced fluency is not about inserting the longest word possible. Compare assert, suggest and speculate: each conveys a different level of confidence. In professional messages, may indicate possibility; definitely communicates high certainty. Prefer precise familiar language to impressive but inaccurate synonyms.","sentence":"The evidence suggests a moderate improvement, although results vary by group.","scenario":"You are updating a client about a pilot programme with encouraging but incomplete results. Your message must be optimistic without making claims that the evidence cannot support.","level":"C1","track":"Advanced British English"},{"id":"disagree-diplomatically-in-meetings","tier":"platinum","title":"Disagree Diplomatically in Meetings","goal":"Challenge ideas while maintaining working relationships.","rule":"Polite disagreement acknowledges the other point before adding evidence or a different perspective. Phrases like I see the reasoning, but... and One concern might be... invite discussion. Avoid false agreement: if the proposal is unsafe or impossible, state the problem explicitly and explain why.","sentence":"I can see the benefit of a faster launch. My concern is that we haven't finished the accessibility checks.","scenario":"A manager suggests launching a product before final testing. You believe this creates avoidable problems, but the team is under pressure. Raise your objection, support it and offer a workable alternative.","level":"C1","track":"Advanced British English"},{"id":"run-a-productive-meeting","tier":"platinum","title":"Run a Productive Meeting","goal":"Open, guide and summarise a meeting with clear actions.","rule":"A good chair states the purpose and desired outcome, keeps contributions relevant, summarises decisions and confirms owners and deadlines. Language such as Let's move on to..., Could we hear from...?, and To summarise, we've agreed... helps. Do not confuse discussion with decisions unless someone commits to an action.","sentence":"To summarise, Sam will send the draft by Tuesday, and we'll review it on Thursday.","scenario":"Your team has 20 minutes to decide the priorities for a customer launch. Two people keep repeating the same points and one quiet colleague has useful technical experience.","level":"C1","track":"Advanced British English"},{"id":"negotiate-terms-and-trade-offs","tier":"platinum","title":"Negotiate Terms and Trade-offs","goal":"Make proposals, concessions and conditional offers confidently.","rule":"Negotiation involves identifying priorities, exploring alternatives and trading concessions. Useful structures include If you can..., we'd be able to..., In return for..., and Could we find a middle ground? Avoid agreeing before confirming what the other party has promised.","sentence":"If you can deliver by Wednesday, we'd be willing to place a larger order.","scenario":"A supplier offers a good price but a delivery date that is too late. You need earlier delivery while keeping a constructive long-term relationship.","level":"C1","track":"Professional Fluency"},{"id":"job-interviews-with-the-star-method","tier":"platinum","title":"Job Interviews with the STAR Method","goal":"Turn experience into specific evidence-rich interview answers.","rule":"STAR stands for Situation, Task, Action and Result. The action should explain what you personally did, while the result should be accurate and specific. Avoid inventing numerical achievements or spending most of the answer on what the team did without you.","sentence":"Our team faced a backlog. I reorganised the handover checklist and checked priorities each morning. We cleared the urgent work by Friday.","scenario":"An interviewer asks about a difficult deadline, a conflict and a mistake you learned from. Prepare responses that sound genuine rather than memorised.","level":"B2–C1","track":"Professional Fluency"},{"id":"give-a-persuasive-presentation","tier":"platinum","title":"Give a Persuasive Presentation","goal":"Guide listeners with signposting, concrete examples and a clear takeaway.","rule":"An effective presentation begins with the question it will answer, sets out a small number of points, supports each with evidence and finishes with a memorable conclusion. Signposting should help orientation, not fill every sentence with Firstly, Secondly and Finally.","sentence":"Today I'll explain why our response times changed, what the data shows and what we propose next.","scenario":"You are presenting a five-minute improvement proposal to senior colleagues. Some care about cost and others care about customer experience. Both groups need to understand your recommendation.","level":"C1","track":"Professional Fluency"},{"id":"lead-a-difficult-customer-conversation","tier":"platinum","title":"Lead a Difficult Customer Conversation","goal":"Acknowledge frustration while setting realistic expectations.","rule":"Empathy names the experience without making an impossible promise. First acknowledge what has happened, then clarify what is known, explain the next action and give a realistic update time. Avoid saying I guarantee when the outcome is uncertain.","sentence":"I understand why the delay is frustrating. I'll check the tracking details and update you by 3 pm.","scenario":"A customer's delivery is overdue and they need the goods for an event. The tracking data is incomplete and they are understandably angry. Your job is to help without inventing certainty.","level":"C1","track":"Professional Fluency"},{"id":"ielts-speaking-part-2-extended-answer","tier":"platinum","title":"IELTS Speaking Part 2: Extended Answer","goal":"Build a coherent two-minute response without memorising an unnatural script.","rule":"Use the one-minute preparation to choose a simple example, note key events and feelings, and organise beginning, development and reflection. Answer the card rather than forcing memorised idioms into every sentence. Develop details so the examiner can follow your story. This is practice, not an official band assessment.","sentence":"I'd like to talk about a teacher who encouraged me. I first met her when... What stayed with me was...","scenario":"Describe a person who helped you learn something important. Include who they were, what you learned, how the learning happened and why it mattered to you.","level":"B2–C1","track":"IELTS Excellence"},{"id":"ielts-speaking-part-3-develop-ideas","tier":"platinum","title":"IELTS Speaking Part 3: Develop Ideas","goal":"Answer abstract follow-up questions with reasoning, examples and balanced views.","rule":"Part 3 requires more than a personal anecdote. Explain a broader point, give a concrete example and consider a limitation or alternative view. It is acceptable to qualify claims with in many cases or it depends on. Avoid pretending statistics you do not know are facts.","sentence":"Schools can build confidence by allowing students to practise public speaking. However, quieter students may need smaller-group activities first.","scenario":"An examiner asks whether technology has changed the way people learn and whether governments should fund adult education. Move from personal experience to broader arguments.","level":"C1","track":"IELTS Excellence"},{"id":"ielts-writing-task-2-balanced-essay","tier":"platinum","title":"IELTS Writing Task 2: Balanced Essay","goal":"Plan and write a focused argument with coherent paragraphs and justified examples.","rule":"Read the precise instruction first: discuss both views, agree/disagree and advantages/disadvantages demand different structures. Write a thesis that answers the actual question. Use topic sentences, logical development and specific examples; avoid memorised introductions that could fit any question. This practice is not official scoring.","sentence":"Although online learning is flexible, face-to-face teaching may offer immediate interaction. A blended approach can combine both strengths.","scenario":"Some people believe English should be taught entirely online, while others prefer classrooms. Discuss both views and give your own opinion.","level":"C1","track":"IELTS Excellence"},{"id":"ielts-academic-task-1-describe-data","tier":"platinum","title":"IELTS Academic Task 1: Describe Data","goal":"Select key trends and comparisons without inventing explanations.","rule":"For Academic Task 1, introduce the graphic, provide a clear overview and support it with selected comparisons. Use approximate language when exact values are unavailable, and avoid explaining why trends happened unless the data actually provides the cause. Distinguish a percentage-point rise from a percent increase.","sentence":"Participation rose from 20% to 30%, an increase of ten percentage points.","scenario":"A chart shows three kinds of language-study activity between 2020 and 2025. Online lessons increase, printed workbook use declines and small-group speaking remains stable. You must describe, not evaluate, the trends.","level":"B2–C1","track":"IELTS Excellence"},{"id":"ielts-listening-paraphrase-and-distractors","tier":"platinum","title":"IELTS Listening: Paraphrase and Distractors","goal":"Identify meaning when speakers change their minds or paraphrase answers.","rule":"Listening tests often replace the exact wording in the question with a synonym. Pay attention to corrections: We originally planned Tuesday, but we've moved it to Thursday. The first date is a distractor. Anticipate the information type without guessing before hearing the full statement.","sentence":"We were going to meet on Tuesday, but we've changed it to Thursday. The answer is Thursday.","scenario":"A student discusses course times with an adviser. The adviser mentions two older schedules, corrects one room number and confirms the final booking at the end. You must identify the confirmed details.","level":"B2–C1","track":"IELTS Excellence"},{"id":"toeic-workplace-listening-decisions","tier":"platinum","title":"TOEIC Workplace Listening Decisions","goal":"Use context and implied meaning to understand workplace conversations.","rule":"In workplace listening, the correct response may not repeat the question's words. If someone says The meeting room is already booked, they may be refusing a proposal rather than giving a room description. Identify who is speaking, what problem exists and what action follows. This is an original practice exercise, not an official TOEIC question.","sentence":"Could we meet in Room B? I'm afraid that's booked, but Room D is free. They will probably use Room D.","scenario":"Two colleagues need to move a client meeting. One suggests a room that is unavailable and another recommends a video call. The final decision depends on the client's travel arrangements.","level":"B1–B2","track":"TOEIC Excellence"},{"id":"toeic-business-reading-and-email-chains","tier":"platinum","title":"TOEIC Business Reading and Email Chains","goal":"Track decisions, times and responsibilities across several workplace messages.","rule":"Business reading questions often require you to combine information from an email, notice and revised schedule. Identify the latest message, changes to earlier instructions, who owns each action and any deadlines. Do not assume the first document is still current after an update.","sentence":"Monday's email requests a draft by Wednesday; Tuesday's update changes the deadline to Thursday.","scenario":"You receive a supplier email, then a correction from the project manager and a revised delivery schedule. One document changes the location while another changes the date. Summarise the final arrangements.","level":"B2","track":"TOEIC Excellence"},{"id":"evaluate-claims-and-evidence","tier":"platinum","title":"Evaluate Claims and Evidence","goal":"Identify bias, missing context, selective numbers and unsupported conclusions.","rule":"Strong critical reading asks who makes a claim, what evidence supports it, what alternatives exist and which uncertainties remain. A dramatic statistic may still be misleading without a sample, timeframe or comparison group. Avoid calling something false merely because you disagree with it.","sentence":"A survey of 75 volunteers suggests interest, but the small self-selected sample limits wider conclusions.","scenario":"A website claims that 95% of users improve their English after seven days but gives no definition of improvement, method or comparison group. Decide which follow-up questions are necessary before believing the claim.","level":"C1","track":"Reading Mastery"},{"id":"summarise-without-plagiarising","tier":"platinum","title":"Summarise without Plagiarising","goal":"Paraphrase meaning accurately and acknowledge limits.","rule":"Good summarising keeps the main claims and logical relationships while changing the sentence structure and selection of details. Replacing every third word with a synonym is not reliable paraphrasing. In academic contexts, attribution is still necessary even when ideas are expressed in your own words.","sentence":"Original: Flexible hours allow adults to study around work. Summary: A variable timetable may help employed learners fit lessons into daily life.","scenario":"A report describes the benefits and drawbacks of remote learning. You need to provide an accurate short briefing for a colleague who has no time to read the report.","level":"C1","track":"Reading Mastery"},{"id":"write-a-persuasive-proposal","tier":"platinum","title":"Write a Persuasive Proposal","goal":"Combine a clear recommendation, benefits, evidence, risks and implementation steps.","rule":"A proposal should tell the reader exactly what decision is requested. Show likely benefits, honest costs and risks, and a sequence for implementation. Distinguish evidence from projections and avoid promising outcomes that have not been validated.","sentence":"I recommend a four-week pilot, measured by attendance, learner progress and cost per active student.","scenario":"An education business is considering a new speaking course. Management needs a proposal explaining who it serves, how it works, how success will be measured and what could go wrong.","level":"C1","track":"Writing Mastery"},{"id":"edit-for-clarity-and-concision","tier":"platinum","title":"Edit for Clarity and Concision","goal":"Improve organisation and meaning without removing necessary detail.","rule":"Editing starts with purpose: what must the reader understand or do? Cut duplication, replace vague nouns with specific ones and break overloaded sentences. Preserve essential qualifications. Concision does not mean deleting context or removing politeness from a sensitive message.","sentence":"Due to a scheduling conflict, we need to move Thursday's review to Friday at 10 am.","scenario":"A long customer-support message repeats itself, hides the requested action and contains several ambiguous dates. Edit it into a concise, accurate response that customers can follow.","level":"C1","track":"Writing Mastery"},{"id":"integrated-airport-and-hotel-mission","tier":"platinum","title":"Integrated Airport and Hotel Mission","goal":"Combine planning, listening, problem-solving and professional language.","rule":"Real-life fluency means adapting when the first plan fails. Clarify information, explain a problem, propose alternatives and confirm the result. Use suitable register with airport staff, hotel reception and a colleague. Your final account should clearly distinguish known information from assumptions.","sentence":"Our flight has been delayed. Could you confirm whether the transfer booking can be moved to 9 pm?","scenario":"You arrive in a new city two hours late. Your airport transfer has left, the hotel says your booking may be cancelled and you have a meeting in the morning. You must prioritise the issues and resolve them in order.","level":"B2–C1","track":"Mastery Challenges"},{"id":"integrated-workplace-crisis-mission","tier":"platinum","title":"Integrated Workplace Crisis Mission","goal":"Synthesize competing facts and communicate a clear action plan.","rule":"Under pressure, accurate communication requires a verified timeline, named responsibilities and updates tailored to each audience. Internal notes can be detailed; customer messages should be accurate, calm and concise. Avoid speculative blame or promises you cannot keep.","sentence":"We are investigating the issue and will provide the next confirmed update at 4 pm.","scenario":"A service outage affects customer appointments, an important delivery and staff schedules. You receive conflicting reports. Decide what to verify first, what to tell customers and what action each colleague should take.","level":"C1","track":"Mastery Challenges"},{"id":"research-debate-and-defend-a-position","tier":"platinum","title":"Research, Debate and Defend a Position","goal":"Build a defensible position using credible sources and fair counterarguments.","rule":"A strong argument uses a clearly bounded claim, credible evidence and reasoning. Anticipate the most serious counterargument rather than attacking a weak version. Distinguish descriptive evidence from your own evaluation and acknowledge limitations. Do not invent source titles or statistics.","sentence":"The evidence supports a limited pilot, although long-term retention is still uncertain.","scenario":"A community organisation is deciding whether to fund online adult education. Stakeholders disagree about inclusion, cost and outcomes. Prepare a decision brief that respects the strongest arguments on both sides.","level":"C1–C2","track":"Mastery Challenges"},{"id":"final-british-english-fluency-portfolio","tier":"platinum","title":"Final British English Fluency Portfolio","goal":"Demonstrate transferable learning across speaking, reading, grammar and writing.","rule":"A portfolio should collect evidence from multiple tasks and identify what has improved and what still needs practice. Include a revised piece of writing, a spoken performance, a reading summary and a practical communication task. Reflection should point to observable changes rather than claiming a level based on confidence alone.","sentence":"My first email was unclear about the deadline; my revised version names the date and the next action.","scenario":"You are applying for a new role abroad. Prepare a complete English-language portfolio showing that you can introduce yourself, handle a practical difficulty, write persuasively and evaluate a source.","level":"C1–C2","track":"Mastery Challenges"},{"id":"platinum-extension-0","tier":"platinum","title":"Evaluating Conflicting Evidence","goal":"Assess competing sources without oversimplifying.","rule":"Assess competing sources without oversimplifying. Notice the relationship between each clause and the intended register.","sentence":"Although the surveys disagree, both reveal a change in behaviour.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Academic English"},{"id":"platinum-extension-1","tier":"platinum","title":"Qualifying Academic Claims","goal":"Avoid overly confident statements.","rule":"Avoid overly confident statements. Notice the relationship between each clause and the intended register.","sentence":"The findings appear to support a cautious interpretation.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Academic English"},{"id":"platinum-extension-2","tier":"platinum","title":"Counterargument Architecture","goal":"Build and answer counterarguments.","rule":"Build and answer counterarguments. Notice the relationship between each clause and the intended register.","sentence":"Critics may object, yet the broader evidence is persuasive.","scenario":"Prepa

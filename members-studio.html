</style></head><body><div id="rlApp" aria-label="RJ Language Academy learning studios"></div><script>window.RJLoopContent = {"silver":[{"id":"introduce-yourself-naturally","tier":"silver","title":"Introduce Yourself Naturally","goal":"Introduce yourself, give useful details and ask a follow-up question.","rule":"A natural introduction normally gives your name, where you are from and one relevant detail. In a first conversation, leave space for the other person to reply. Ask a question instead of delivering a long speech.","sentence":"Hi, I'm Mina. I'm from Bangkok, but I live in Bedford now. What about you?","scenario":"A new colleague has joined your team in the UK. You meet at the coffee machine before work. They smile and ask whether you are new. Keep your answer friendly and brief, then help them join the conversation.","level":"A1","track":"Everyday British English"},{"id":"present-simple-and-present-continuous","tier":"silver","title":"Present Simple and Present Continuous","goal":"Choose accurately between routines and actions happening now.","rule":"Use the present simple for routines, habits and general facts: I work on Mondays. Use the present continuous for a temporary action happening now or around now: I'm working on a difficult project this week. Some state verbs, such as know, usually do not take the continuous form.","sentence":"I usually take the bus, but I'm walking to work today.","scenario":"A friend calls while you are preparing dinner. Tell them what you are doing now, what you usually do after work and why tonight is different. Contrast the two time frames clearly.","level":"A1","track":"Everyday British English"},{"id":"in-on-and-at-for-time","tier":"silver","title":"In, On and At for Time","goal":"Explain and use the main time prepositions correctly.","rule":"Use at for exact clock times, on for named days and dates, and in for months, years and broad parts of the day. Say at 8:30, on Friday, in October and in the morning. Some expressions are exceptions: at night, on Monday morning, at the weekend in common British usage.","sentence":"My interview is at half past ten on Tuesday in November.","scenario":"You are arranging a group lesson with students in three countries. You need to give a date, a day and an exact start time. Write an unambiguous confirmation that everyone can check later.","level":"A1–A2","track":"Everyday British English"},{"id":"tell-a-story-in-the-past","tier":"silver","title":"Tell a Story in the Past","goal":"Tell an understandable story using past simple and useful sequencing.","rule":"Use the past simple to report completed actions and events: arrived, missed, called, found. Time markers such as first, then, after that and finally help listeners follow the sequence. Keep the order clear and add a result or reaction at the end.","sentence":"Yesterday I missed the bus, so I walked to the station. Fortunately, I caught the next train.","scenario":"You arrived late for a meeting after your train was cancelled. Explain what happened without blaming everyone else. Give the sequence, what you tried and the eventual result.","level":"A2","track":"Everyday British English"},{"id":"will-going-to-and-arrangements","tier":"silver","title":"Will, Going To and Arrangements","goal":"Talk about predictions, decisions and plans naturally.","rule":"Use going to for intentions already decided and predictions based on visible evidence. Use will for a decision made at the moment of speaking or a general prediction. Use the present continuous with future time for arrangements already organised: I'm meeting Lara at six.","sentence":"I've booked the tickets. We're flying to Manchester on Friday. I think it'll be busy.","scenario":"Your friend asks you to help organise a weekend trip. Some things are already booked, some are intentions and one decision must be made immediately. Explain the differences accurately.","level":"A2","track":"Everyday British English"},{"id":"for-and-since-with-present-perfect","tier":"silver","title":"For and Since with Present Perfect","goal":"Describe how long something has continued until now.","rule":"Use for with a duration, such as for three months or for a long time. Use since with a starting point, such as since 2022 or since Monday. Present perfect links a past beginning to the present: I've lived here for two years. Present perfect continuous can emphasise an ongoing activity: I've been studying since breakfast.","sentence":"She's worked here since May, and she's been learning English for six months.","scenario":"You meet someone at an English-language meetup. They ask about your job, where you live and how long you have been learning English. Give three accurate answers with different time expressions.","level":"A2","track":"Everyday British English"},{"id":"to-and-for-purpose-and-benefit","tier":"silver","title":"To and For: Purpose and Benefit","goal":"Explain why something happens or who receives a benefit.","rule":"Use to plus the base verb when you mean purpose: I went online to book a ticket. Use for plus a noun or -ing form to describe function or benefit: This app is for learning vocabulary; the gift is for Sam. Do not put a plain verb directly after for when you mean purpose.","sentence":"I went to the library to study. This quiet room is for students.","scenario":"You are recommending a language course to a friend. Explain what the course is for, why you personally joined it and what activities it helps you do.","level":"A2","track":"Practical Grammar"},{"id":"but-although-and-however","tier":"silver","title":"But, Although and However","goal":"Connect contrasting ideas in complete sentences.","rule":"But joins contrasting clauses inside a sentence. Although introduces a dependent clause and can appear at the beginning or in the middle. However links two independent ideas and normally takes punctuation: The test was difficult. However, I finished it. Avoid starting a sentence with Although and forgetting the main clause.","sentence":"Although the train was delayed, we arrived on time. The journey was long, but comfortable.","scenario":"A hotel looks excellent in photographs, but its location is inconvenient and its rooms are expensive. Write a balanced review using three different ways to express contrast.","level":"A2","track":"Practical Grammar"},{"id":"articles-a-an-and-the","tier":"silver","title":"Articles: A, An and The","goal":"Make sentences more natural by choosing or omitting articles.","rule":"Use a or an when introducing one non-specific countable thing, and the when both speaker and listener know which thing is meant. Choose a or an by sound rather than spelling: an hour, a university. Many plural and uncountable general statements take no article: Books are useful; Water is essential.","sentence":"I saw a café near the station. The café had an outdoor table.","scenario":"A friend is visiting your town for the first time. Recommend a restaurant and a park. Introduce the places, then refer back to them naturally without repeating names.","level":"A2","track":"Practical Grammar"},{"id":"ask-for-directions-and-clarify","tier":"silver","title":"Ask for Directions and Clarify","goal":"Understand and give directions without getting lost.","rule":"Start with a clear landmark. Use go straight on, turn left, cross the road, opposite and next to. If a direction is unclear, ask for a repeat: Sorry, did you say the second left? Check the destination before walking away.","sentence":"Go past the bank, take the second right and the library is opposite the station.","scenario":"A visitor is trying to reach the library from the railway station. There are two turns and one confusing junction. Give precise directions and offer a clarification if they look uncertain.","level":"A2","track":"Real-Life Tasks"},{"id":"polite-requests-in-british-english","tier":"silver","title":"Polite Requests in British English","goal":"Make requests that sound friendly and appropriately formal.","rule":"Could you...? and Would you mind...? often sound less direct than an imperative. Add please where natural, but do not rely on please alone to make a command polite. With Would you mind, use an -ing verb: Would you mind opening the window? For a response, try Of course, No problem or I'm afraid I can't today.","sentence":"Could you send me the details when you have a moment, please?","scenario":"You need a colleague to swap a short shift and a receptionist to correct a booking. The situations require slightly different levels of formality. Choose wording carefully.","level":"A2","track":"Real-Life Tasks"},{"id":"shopping-returns-and-refunds","tier":"silver","title":"Shopping, Returns and Refunds","goal":"Explain a shopping problem and ask for a reasonable solution.","rule":"State what you bought, when you bought it and what went wrong. Use clear factual language and an appropriate request: Could I exchange it? I would like a refund, please. Distinguish a refund, a replacement and an exchange.","sentence":"I bought these headphones last Saturday, but the left side doesn't work. Could I have a replacement?","scenario":"You bought a kettle that stopped working after two days. A shop assistant asks what happened and whether you have a receipt. Explain the situation and ask for your preferred outcome.","level":"A2","track":"Real-Life Tasks"},{"id":"silver-extension-0","tier":"silver","title":"Subject and Verb Agreement","goal":"Match singular subjects with the right verb.","rule":"Match singular subjects with the right verb. Watch the sentence structure as you work through the activity.","sentence":"The new student enjoys British English lessons.","scenario":"Use this language in an everyday British English situation.","level":"A1–A2","track":"Syntax Builders"},{"id":"silver-extension-1","tier":"silver","title":"Polite Sentence Order","goal":"Assemble a respectful classroom request.","rule":"Assemble a respectful classroom request. Watch the sentence structure as you work through the activity.","sentence":"Could you explain the instructions once more?","scenario":"Use this language in an everyday British English situation.","level":"A1–A2","track":"Syntax Builders"},{"id":"silver-extension-2","tier":"silver","title":"Negatives With Do and Does","goal":"Build a negative statement with an auxiliary.","rule":"Build a negative statement with an auxiliary. Watch the sentence structure as you work through the activity.","sentence":"My brother does not drink coffee.","scenario":"Use this language in an everyday British English situation.","level":"A1–A2","track":"Syntax Builders"},{"id":"silver-extension-3","tier":"silver","title":"Question Word Workshop","goal":"Arrange a clear information question.","rule":"Arrange a clear information question. Watch the sentence structure as you work through the activity.","sentence":"Where does your friend work on Fridays?","scenario":"Use this language in an everyday British English situation.","level":"A1–A2","track":"Syntax Builders"},{"id":"silver-extension-4","tier":"silver","title":"Prepositions for Places","goal":"Place objects using accurate prepositions.","rule":"Place objects using accurate prepositions. Watch the sentence structure as you work through the activity.","sentence":"The blue notebook is on the desk.","scenario":"Use this language in an everyday British English situation.","level":"A1–A2","track":"Daily Grammar Clinics"},{"id":"silver-extension-5","tier":"silver","title":"Everyday Adverbs","goal":"Put frequency adverbs in natural positions.","rule":"Put frequency adverbs in natural positions. Watch the sentence structure as you work through the activity.","sentence":"She usually catches the early bus.","scenario":"Use this language in an everyday British English situation.","level":"A1–A2","track":"Daily Grammar Clinics"},{"id":"silver-extension-6","tier":"silver","title":"Vocabulary: Around the Home","goal":"Practise language for household tasks.","rule":"Practise language for household tasks. Watch the sentence structure as you work through the activity.","sentence":"Please put the clean dishes in the cupboard.","scenario":"Use this language in an everyday British English situation.","level":"A1–A2","track":"Daily Grammar Clinics"},{"id":"silver-extension-7","tier":"silver","title":"Vocabulary: Shopping","goal":"Handle a typical shop conversation.","rule":"Handle a typical shop conversation. Watch the sentence structure as you work through the activity.","sentence":"I would like to return this jacket please.","scenario":"Use this language in an everyday British English situation.","level":"A1–A2","track":"Daily Grammar Clinics"},{"id":"silver-extension-8","tier":"silver","title":"Vocabulary: Work and Study","goal":"Use vocabulary for work and education.","rule":"Use vocabulary for work and education. Watch the sentence structure as you work through the activity.","sentence":"I have an appointment with my tutor tomorrow.","scenario":"Use this language in an everyday British English situation.","level":"A1–A2","track":"Vocabulary Flashcards"},{"id":"silver-extension-9","tier":"silver","title":"Vocabulary: Travel","goal":"Understand useful travel words.","rule":"Understand useful travel words. Watch the sentence structure as you work through the activity.","sentence":"We need to change trains at Birmingham.","scenario":"Use this language in an everyday British English situation.","level":"A1–A2","track":"Vocabulary Flashcards"},{"id":"silver-extension-10","tier":"silver","title":"Vocabulary: Food and Orders","goal":"Use polite restaurant vocabulary.","rule":"Use polite restaurant vocabulary. Watch the sentence structure as you work through the activity.","sentence":"Could we have the bill when you are ready?","scenario":"Use this language in an everyday British English situation.","level":"A1–A2","track":"Vocabulary Flashcards"},{"id":"silver-extension-11","tier":"silver","title":"Pronunciation: Word Stress","goal":"Notice meaning and stress in English words.","rule":"Notice meaning and stress in English words. Watch the sentence structure as you work through the activity.","sentence":"The photographer captured a beautiful sunset.","scenario":"Use this language in an everyday British English situation.","level":"A1–A2","track":"Vocabulary Flashcards"},{"id":"silver-foundation-1","tier":"silver","title":"Personal pronouns","goal":"Use personal pronouns accurately in practical British English.","rule":"Use she for a singular female subject and he for a singular male subject. A subject pronoun comes before the verb.","sentence":"She works in a hospital.","scenario":"A new learner is practising personal pronouns in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A1","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-2","tier":"silver","title":"Object pronouns","goal":"Use object pronouns accurately in practical British English.","rule":"Use me, him, her, us and them as objects of verbs and prepositions.","sentence":"Could you help me with this form?","scenario":"A new learner is practising object pronouns in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A1","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-3","tier":"silver","title":"Possessive adjectives","goal":"Use possessive adjectives accurately in practical British English.","rule":"Use my, your, his, her, its, our and their before nouns to show possession.","sentence":"Their children attend the local school.","scenario":"A new learner is practising possessive adjectives in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A1","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-4","tier":"silver","title":"Possessive pronouns","goal":"Use possessive pronouns accurately in practical British English.","rule":"Mine, yours, his, hers, ours and theirs replace a possessed noun.","sentence":"This blue bag is mine.","scenario":"A new learner is practising possessive pronouns in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A1","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-5","tier":"silver","title":"Singular and plural nouns","goal":"Use singular and plural nouns accurately in practical British English.","rule":"Most plurals add -s; some nouns ending in -s, -sh or -ch add -es.","sentence":"There are three buses outside.","scenario":"A new learner is practising singular and plural nouns in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A1","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-6","tier":"silver","title":"This, that, these and those","goal":"Use this, that, these and those accurately in practical British English.","rule":"Use this/these for things near you and that/those for things farther away.","sentence":"These shoes are comfortable.","scenario":"A new learner is practising this, that, these and those in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A1","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-7","tier":"silver","title":"There is and there are","goal":"Use there is and there are accurately in practical British English.","rule":"Use there is with singular nouns and there are with plural nouns.","sentence":"There is a pharmacy near the station.","scenario":"A new learner is practising there is and there are in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A1","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-8","tier":"silver","title":"Countable and uncountable nouns","goal":"Use countable and uncountable nouns accurately in practical British English.","rule":"Advice and information are uncountable. Use some advice rather than an advice.","sentence":"We need some advice before travelling.","scenario":"A new learner is practising countable and uncountable nouns in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A1","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-9","tier":"silver","title":"A, an and the","goal":"Use a, an and the accurately in practical British English.","rule":"Use an before a vowel sound; use the for something specific or already identified.","sentence":"An engineer visited the office.","scenario":"A new learner is practising a, an and the in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A1","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-10","tier":"silver","title":"Some, any and no","goal":"Use some, any and no accurately in practical British English.","rule":"Any is common in questions and negatives; some is common in positive statements.","sentence":"Do you have any questions?","scenario":"A new learner is practising some, any and no in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A1","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-11","tier":"silver","title":"Much, many and a lot of","goal":"Use much, many and a lot of accurately in practical British English.","rule":"Use many with countable plural nouns and much with uncountable nouns.","sentence":"How many tickets do we need?","scenario":"A new learner is practising much, many and a lot of in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A1","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-12","tier":"silver","title":"Few, a few, little and a little","goal":"Use few, a few, little and a little accurately in practical British English.","rule":"A little means some uncountable quantity. A few means some countable items.","sentence":"I have a little time before work.","scenario":"A new learner is practising few, a few, little and a little in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A1","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-13","tier":"silver","title":"Basic adjective placement","goal":"Use basic adjective placement accurately in practical British English.","rule":"Adjectives can go before a noun or after linking verbs such as be, look and seem.","sentence":"The new classroom is quiet.","scenario":"A new learner is practising basic adjective placement in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A1","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-14","tier":"silver","title":"Adverbs of frequency","goal":"Use adverbs of frequency accurately in practical British English.","rule":"Frequency adverbs generally precede main verbs but follow the verb be.","sentence":"I usually study after dinner.","scenario":"A new learner is practising adverbs of frequency in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A1","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-15","tier":"silver","title":"Prepositions for time","goal":"Use prepositions for time accurately in practical British English.","rule":"Use at for clock times, on for days and dates, and in for months and years.","sentence":"My course starts on Monday at nine.","scenario":"A new learner is practising prepositions for time in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A1","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-16","tier":"silver","title":"Prepositions for place","goal":"Use prepositions for place accurately in practical British English.","rule":"Use on for surfaces, in for enclosed spaces, and at for a particular point.","sentence":"The keys are on the kitchen table.","scenario":"A new learner is practising prepositions for place in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A1","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-17","tier":"silver","title":"Present simple negatives","goal":"Use present simple negatives accurately in practical British English.","rule":"Use do not or does not plus the base form of the main verb.","sentence":"She does not work on Sundays.","scenario":"A new learner is practising present simple negatives in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A1","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-18","tier":"silver","title":"Present simple questions","goal":"Use present simple questions accurately in practical British English.","rule":"Use do or does before the subject followed by the base verb.","sentence":"Does your sister live nearby?","scenario":"A new learner is practising present simple questions in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A1","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-19","tier":"silver","title":"Present continuous positives","goal":"Use present continuous positives accurately in practical British English.","rule":"Use am, is or are plus the -ing form to describe activity in progress.","sentence":"They are preparing for the exam.","scenario":"A new learner is practising present continuous positives in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A1","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-20","tier":"silver","title":"Present continuous questions","goal":"Use present continuous questions accurately in practical British English.","rule":"Move am, is or are before the subject to make a present continuous question.","sentence":"Are you waiting for the bus?","scenario":"A new learner is practising present continuous questions in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A1","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-21","tier":"silver","title":"Past simple regular verbs","goal":"Use past simple regular verbs accurately in practical British English.","rule":"Most regular past simple verbs end in -ed; the pronunciation varies.","sentence":"We visited the museum yesterday.","scenario":"A new learner is practising past simple regular verbs in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A1","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-22","tier":"silver","title":"Past simple irregular verbs","goal":"Use past simple irregular verbs accurately in practical British English.","rule":"Irregular past forms must be learnt individually; go becomes went.","sentence":"She went to the library after school.","scenario":"A new learner is practising past simple irregular verbs in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A1","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-23","tier":"silver","title":"Past simple negatives","goal":"Use past simple negatives accurately in practical British English.","rule":"Use did not followed by the base verb, not the past form.","sentence":"He did not understand the question.","scenario":"A new learner is practising past simple negatives in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A2","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-24","tier":"silver","title":"Past simple questions","goal":"Use past simple questions accurately in practical British English.","rule":"Use did plus the subject and the base verb to form past simple questions.","sentence":"Did you see the announcement?","scenario":"A new learner is practising past simple questions in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A2","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-25","tier":"silver","title":"Be going to for plans","goal":"Use be going to for plans accurately in practical British English.","rule":"Use be going to plus the base verb for plans and intentions.","sentence":"We are going to meet on Saturday.","scenario":"A new learner is practising be going to for plans in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A2","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-26","tier":"silver","title":"Will for spontaneous decisions","goal":"Use will for spontaneous decisions accurately in practical British English.","rule":"Use will plus the base verb for decisions made as you speak.","sentence":"I will answer the phone.","scenario":"A new learner is practising will for spontaneous decisions in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A2","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-27","tier":"silver","title":"Can for ability","goal":"Use can for ability accurately in practical British English.","rule":"Use can plus a base verb, with no to between them.","sentence":"My brother can speak Thai.","scenario":"A new learner is practising can for ability in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A2","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-28","tier":"silver","title":"Could for polite requests","goal":"Use could for polite requests accurately in practical British English.","rule":"Could is a courteous way to make a request.","sentence":"Could you open the window, please?","scenario":"A new learner is practising could for polite requests in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A2","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-29","tier":"silver","title":"Should for advice","goal":"Use should for advice accurately in practical British English.","rule":"Should expresses recommendations; it is followed by the base form.","sentence":"You should check the timetable first.","scenario":"A new learner is practising should for advice in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A2","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-30","tier":"silver","title":"Have to for obligation","goal":"Use have to for obligation accurately in practical British English.","rule":"Have to describes an external obligation or necessity.","sentence":"I have to finish this report today.","scenario":"A new learner is practising have to for obligation in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A2","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-31","tier":"silver","title":"Comparative adjectives","goal":"Use comparative adjectives accurately in practical British English.","rule":"Many short adjectives take -er; longer adjectives usually follow more.","sentence":"This route is faster than the other one.","scenario":"A new learner is practising comparative adjectives in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A2","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-32","tier":"silver","title":"Superlative adjectives","goal":"Use superlative adjectives accurately in practical British English.","rule":"Use the plus a superlative to identify an extreme within a group.","sentence":"It is the busiest station in the city.","scenario":"A new learner is practising superlative adjectives in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A2","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-33","tier":"silver","title":"And, but and because","goal":"Use and, but and because accurately in practical British English.","rule":"And adds, but contrasts and because introduces a reason.","sentence":"I stayed home because I felt unwell.","scenario":"A new learner is practising and, but and because in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A2","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-34","tier":"silver","title":"Basic question words","goal":"Use basic question words accurately in practical British English.","rule":"Choose who for people, where for places, when for time and why for reasons.","sentence":"Where does your friend live?","scenario":"A new learner is practising basic question words in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A2","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-35","tier":"silver","title":"Polite classroom language","goal":"Use polite classroom language accurately in practical British English.","rule":"Could you plus a base verb is useful when requesting help or clarification.","sentence":"Could you repeat the last sentence, please?","scenario":"A new learner is practising polite classroom language in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A2","track":"Grammar and Sentence Foundations"},{"id":"silver-foundation-36","tier":"silver","title":"Everyday directions","goal":"Use everyday directions accurately in practical British English.","rule":"Imperatives give directions directly; add landmarks to make them clear.","sentence":"Turn right after the traffic lights.","scenario":"A new learner is practising everyday directions in an everyday conversation. Explain the key pattern, build the example and then use it in your own real-world sentence.","level":"A2","track":"Grammar and Sentence Foundations"}],"gold":[{"id":"change-an-appointment-professionally","tier":"gold","title":"Change an Appointment Professionally","goal":"Reschedule a booking politely and confirm the new arrangement.","rule":"A complete rescheduling message acknowledges the original booking, explains briefly that you cannot attend, proposes one or two alternatives and asks for confirmation. Use Could we move...?, Would Tuesday suit you? and Thank you for understanding. Avoid giving unnecessary personal details.","sentence":"I'm afraid I can't make our appointment on Thursday. Would Friday morning be possible instead?","scenario":"You have a dental appointment on Thursday but your work schedule has changed. You need to reschedule without sounding careless. The receptionist offers a time that you cannot accept.","level":"B1","track":"Confident Conversations"},{"id":"present-perfect-or-past-simple","tier":"gold","title":"Present Perfect or Past Simple?","goal":"Distinguish life experience, continuing situations and finished past events.","rule":"Use present perfect when the exact finished time is not important or the period connects to now: I've visited Scotland twice. Use past simple when you name a finished time: I visited Edinburgh in 2023. With yesterday, last week and in 2020, past simple is usually the correct choice.","sentence":"I've tried Thai food, but I first tried it when I visited Bangkok in 2024.","scenario":"A new colleague asks about countries you have visited and the most interesting trip you took. Start with experience and then move to specific events and dates.","level":"B1","track":"Confident Conversations"},{"id":"tell-better-stories-with-past-perfect","tier":"gold","title":"Tell Better Stories with Past Perfect","goal":"Make the order of two past events clear.","rule":"Past perfect, had plus past participle, can show that one past event occurred before another past event: By the time I arrived, the meeting had started. You do not need past perfect in every sentence. Establish the earlier event once, then continue naturally with past simple.","sentence":"When I reached the platform, the train had already left, so I called my colleague.","scenario":"You arrive at a wedding and discover that the ceremony started early. Explain the chain of events that led to your late arrival and what had happened before you got there.","level":"B1","track":"Confident Conversations"},{"id":"first-and-second-conditionals","tier":"gold","title":"First and Second Conditionals","goal":"Choose between a likely future consequence and an imagined situation.","rule":"The first conditional uses if plus present simple, followed by will or another likely future result: If it rains, we'll stay inside. The second uses if plus past simple, often followed by would, for an imagined or less likely situation: If I had more time, I'd travel. Avoid putting will directly into the ordinary if-clause.","sentence":"If the train is late, I'll call you. If I had a car, I'd drive.","scenario":"You are planning an event on a rainy weekend. Explain what you will do if the weather changes. Then imagine how you would plan it differently with an unlimited budget.","level":"B1","track":"Grammar in Action"},{"id":"modals-for-advice-and-possibility","tier":"gold","title":"Modals for Advice and Possibility","goal":"Explain advice, certainty and uncertainty accurately.","rule":"Use should or ought to for advice, must for a strong obligation or deduction, might or may for possibility, and can't for a deduction that something is impossible. Context determines meaning: You must wear a badge is obligation; She must be tired is deduction. Avoid using mustn't to mean don't need to.","sentence":"You should check the timetable. He might be delayed. She must be exhausted.","scenario":"A new employee is worried about their first week. Give sensible advice, explain what is compulsory and speculate about why a colleague has not arrived.","level":"B1–B2","track":"Grammar in Action"},{"id":"write-clear-and-polite-emails","tier":"gold","title":"Write Clear and Polite Emails","goal":"Organise an email with purpose, action and next steps.","rule":"A useful professional email has a relevant subject, a brief opening, the reason for writing, a clear request and a courteous closing. Short paragraphs help the reader. Use Could you confirm...? for a request, and Please find attached... only if there really is an attachment.","sentence":"Subject: Updated meeting time. Hello Sam, Could we move our meeting to 2 pm? Please let me know if that works. Kind regards, Mina.","scenario":"A supplier has not sent a document you need for tomorrow. You want to follow up professionally, mention the deadline and suggest a quick alternative without sounding hostile.","level":"B1","track":"Workplace English"},{"id":"small-talk-without-awkwardness","tier":"gold","title":"Small Talk Without Awkwardness","goal":"Start, extend and close light workplace conversations.","rule":"Small talk often begins with a shared situation, such as the journey, weekend or event. Use open follow-up questions and brief personal answers. Respect boundaries: do not assume colleagues want to discuss salary, religion or private matters. Close naturally with Lovely chatting—I'd better get back.","sentence":"How was your weekend? That sounds lovely. Have you been there before?","scenario":"You are attending your first team lunch with people you hardly know. One colleague mentions a concert, while another describes a long commute. Keep the chat moving without interrogating either person.","level":"B1","track":"Workplace English"},{"id":"read-for-meaning-and-inference","tier":"gold","title":"Read for Meaning and Inference","goal":"Identify main ideas, implied meanings and evidence rather than guessing.","rule":"A text can state information directly or imply it through tone and context. First locate the writer's main claim. Next find the sentence that supports an inference. A plausible answer without textual support is still a guess. Distinguish fact from opinion and notice contrast markers such as however and despite.","sentence":"The café was full despite the rain. This suggests it was popular enough to attract customers in poor weather.","scenario":"An article says a council is extending library opening hours after more residents requested evening access. Read between the lines: what need is being addressed, and what information is still missing?","level":"B1–B2","track":"Reading and Writing"},{"id":"build-an-effective-paragraph","tier":"gold","title":"Build an Effective Paragraph","goal":"Use a topic sentence, explanation, evidence and a concluding link.","rule":"A focused paragraph usually develops one controlling idea. Begin with a topic sentence, explain why the idea matters, provide a specific example and connect it back to the question. Avoid adding several unrelated examples or repeating the same sentence in different words.","sentence":"Flexible study times help adults learn consistently. For example, a parent may study after putting the children to bed. This flexibility reduces missed lessons.","scenario":"You are writing an article about whether online courses can help busy adults. Your reader expects a clear argument and a concrete example, not a string of unsupported opinions.","level":"B2","track":"Reading and Writing"},{"id":"make-a-complaint-and-negotiate-a-solution","tier":"gold","title":"Make a Complaint and Negotiate a Solution","goal":"Be firm, respectful and specific about a service problem.","rule":"A persuasive complaint separates facts from feelings. Explain the problem, its impact and the solution you request. Use I was disappointed because..., Could you offer...?, and I would appreciate a reply by... Avoid accusations that you cannot prove.","sentence":"The room was not cleaned when we arrived. Could you move us to another room or arrange cleaning immediately?","scenario":"You have booked a hotel for an important trip. The room is noisy and the heating doesn't work. The receptionist suggests a small discount, but you need a usable room.","level":"B1–B2","track":"Real-Life Fluency"},{"id":"pronunciation-stress-and-intonation","tier":"gold","title":"Pronunciation: Stress and Intonation","goal":"Use emphasis and intonation to express meaning rather than reading every word equally.","rule":"English is stress-timed: important content words often receive stronger beats than grammar words. Sentence stress can change implied meaning: I wanted the BLUE one contrasts blue with other colours. Rising and falling intonation also help indicate unfinished thoughts, questions and certainty. Pronunciation practice is not simply speaking faster.","sentence":"I ordered the BLUE jacket, not the black one. I ORDERED it; I didn't just look at it.","scenario":"A shop assistant has brought the wrong size and colour. You need to correct the misunderstanding without sounding angry. Use contrastive stress so they understand exactly which detail is wrong.","level":"B2","track":"Real-Life Fluency"},{"id":"collocations-and-phrasal-verbs-in-context","tier":"gold","title":"Collocations and Phrasal Verbs in Context","goal":"Choose word combinations that sound natural in British English.","rule":"Collocations are words frequently used together, such as make a decision, heavy traffic and meet a deadline. Phrasal verbs may be separable or inseparable: turn the music down or turn down the music, but look after the children. Learn each expression with a complete example and register.","sentence":"We need to make a decision before Friday and follow up with the supplier.","scenario":"Your team is organising an event under pressure. Several colleagues use unnatural combinations. Rewrite their updates so the language sounds fluent and appropriate.","level":"B2","track":"Real-Life Fluency"},{"id":"gold-managing-misunderstandings-politely","tier":"gold","title":"Managing misunderstandings politely","goal":"Clarify misunderstandings without sounding defensive.","rule":"When there has been confusion, acknowledge the issue, describe the facts without blaming, and check the next action. Could we check what was agreed? and I may have misunderstood are useful softeners. State deadlines precisely.","sentence":"I think we may have understood the deadline differently. Could we confirm whether the report is due on Thursday or Friday?","scenario":"A colleague believes you agreed to send a report on Thursday, but your notes say Friday. Resolve the misunderstanding in a calm two-minute conversation.","level":"B1","track":"Workplace English"},{"id":"gold-making-comparisons-with-nuance","tier":"gold","title":"Making comparisons with nuance","goal":"Compare options and justify your preference with accurate structures.","rule":"Use comparative forms such as cheaper than and more convenient than for two options. Use as ... as to signal similar qualities. Add however or although to acknowledge a disadvantage. Avoid double comparatives such as more better.","sentence":"The train is slightly more expensive than the coach, but it is almost twice as fast.","scenario":"You are helping a visitor choose between a train, coach and taxi for a weekend journey. They care about cost and convenience.","level":"B1","track":"Practical Grammar"},{"id":"gold-present-perfect-versus-past-simple","tier":"gold","title":"Present perfect versus past simple","goal":"Connect experiences to the present and finished events to a past time.","rule":"Use the present perfect for experience or recent events relevant now when no finished past time is specified: I have visited York. Use past simple with finished time expressions: I visited York last year. Do not combine present perfect with yesterday or last Friday.","sentence":"I have visited Scotland twice. I went there most recently in 2024.","scenario":"A colleague asks you about places you have worked and a recent job interview. Distinguish experience from a particular finished event.","level":"B1","track":"Practical Grammar"},{"id":"gold-disagreeing-respectfully-in-meetings","tier":"gold","title":"Disagreeing respectfully in meetings","goal":"Challenge an idea while keeping colleagues engaged.","rule":"Lead with a shared aim, state a specific concern, give a reason and suggest an alternative. Try I see your point, but ... or Could we consider ...? Avoid attacking the speaker; address the proposal.","sentence":"I see why that might save time. My concern is the impact on customers. Could we trial it for one week?","scenario":"In a team meeting someone proposes shortening customer support hours. You disagree because customers may need evening support.","level":"B1","track":"Workplace English"},{"id":"gold-conditionals-for-real-decisions","tier":"gold","title":"Conditionals for real decisions","goal":"Use zero, first and second conditionals to discuss facts and possibilities.","rule":"Zero conditional describes usual results: If you heat water, it boils. First conditional describes a possible future: If it rains, we will stay in. Second conditional describes an unreal or less likely situation: If I had more time, I would practise more.","sentence":"If we finish early, we will take the later train. If I had a car, I would drive.","scenario":"You are planning an outdoor team event. Weather and transport may change, and a colleague asks about an unlikely alternative.","level":"B1","track":"Practical Grammar"},{"id":"gold-understanding-implied-meaning","tier":"gold","title":"Understanding implied meaning","goal":"Recognise polite indirect language and what speakers intend.","rule":"Meaning often depends on context rather than the literal words. I am not sure that will work may politely mean disagreement. Ask a checking question if important: Do you mean we should try another option? Distinguish a cautious suggestion from a confirmed decision.","sentence":"That might be difficult to arrange at short notice. Shall we look at next week?","scenario":"A manager says a proposal is interesting but may need more work. Decide whether it is approval, rejection or a request to revise.","level":"B1–B2","track":"Reading & Listening"},{"id":"gold-reporting-speech-accurately","tier":"gold","title":"Reporting speech accurately","goal":"Report another person’s request, suggestion and statement clearly.","rule":"After said, use a reported clause or include to someone: She said that she was busy; She told me that she was busy. For requests use asked someone to do something. Backshifting of tenses is common when reporting past conversations but not always compulsory for still-true statements.","sentence":"He said he was unavailable and asked me to call on Monday.","scenario":"After an important phone call, your colleague asks what the client said, requested and promised.","level":"B1","track":"Practical Grammar"},{"id":"gold-phrasal-verbs-in-everyday-life","tier":"gold","title":"Phrasal verbs in everyday life","goal":"Use common phrasal verbs meaningfully and avoid literal translations.","rule":"Phrasal verbs combine a verb with a particle: look up a word, put off a meeting, run out of time. Some are separable: turn the light off or turn it off, but not turn off it. Context determines the meaning.","sentence":"We ran out of time, so we put off the meeting until Friday.","scenario":"You are organising a community event. Supplies are low, one guest cancels and a schedule changes. Use natural phrasal verbs in updates.","level":"B1","track":"Vocabulary in Context"},{"id":"gold-writing-a-balanced-opinion","tier":"gold","title":"Writing a balanced opinion","goal":"Organise a nuanced opinion with evidence, contrast and a conclusion.","rule":"Introduce the issue and your position, support it with two distinct reasons, acknowledge one counterargument and end with a clear judgement. Linking words guide the reader, but ideas—not a long list of connectors—create coherence.","sentence":"Online lessons are convenient; however, some learners benefit from speaking with other people in real time.","scenario":"You are writing an article for an international student magazine: Should every university course include online learning?","level":"B1–B2","track":"Writing Studio"},{"id":"gold-complaints-and-service-recovery","tier":"gold","title":"Complaints and service recovery","goal":"Explain a service problem politely and request a practical resolution.","rule":"Give factual details first: when, where, what you expected and what occurred. Describe the impact without exaggerating. State an achievable request and offer a timeframe for a response. A calm tone can be firm.","sentence":"I ordered the blue model on 4 May, but received the black one. Could you arrange a replacement?","scenario":"A parcel arrives with the wrong product two days before a family celebration. Contact customer support and ask for the correct item or a refund.","level":"B1","track":"Real-Life Tasks"},{"id":"gold-managing-conversation-turns","tier":"gold","title":"Managing conversation turns","goal":"Participate naturally rather than dominating or giving one-word replies.","rule":"Use short responses to show listening: I see, Really? and That makes sense. Add a follow-up question before changing the topic. To interrupt politely, try Sorry to interrupt, could I just clarify one point? Avoid repeating the same filler constantly.","sentence":"That sounds challenging. How did you deal with it?","scenario":"You join a new study group. Two people are talking about their jobs; contribute one personal example without taking over.","level":"B1–B2","track":"Speaking Studio"},{"id":"gold-customer-service","tier":"gold","title":"Explaining a Product Problem","goal":"Describe a problem politely and ask for a practical solution.","rule":"Name the issue, add one detail and make a clear request.","sentence":"I received the wrong size so could you arrange an exchange?","scenario":"A shop has sent the wrong size of jacket. Ask the support agent for an exchange.","level":"B1","track":"Practical Communication"},{"id":"gold-office-follow-up","tier":"gold","title":"Following Up After a Meeting","goal":"Confirm decisions and responsibilities in a professional message.","rule":"A useful follow-up restates the decision, action and deadline.","sentence":"I will send the revised proposal by Thursday afternoon.","scenario":"After a project meeting, you need to confirm your next action to a colleague.","level":"B2","track":"Professional English"},{"id":"gold-extra-0","tier":"gold","title":"Handling a Rental Enquiry","goal":"Ask precise questions about accommodation.","rule":"Ask precise questions about accommodation. Connect the two main ideas clearly.","sentence":"Could you confirm whether the flat is available in November?","scenario":"Practise this skill in a realistic British English conversation.","level":"B1–B2","track":"Intermediate English"},{"id":"gold-extra-1","tier":"gold","title":"Describing Changing Habits","goal":"Explain an evolving routine.","rule":"Explain an evolving routine. Connect the two main ideas clearly.","sentence":"I have been travelling by train more often recently.","scenario":"Practise this skill in a realistic British English conversation.","level":"B1–B2","track":"Intermediate English"},{"id":"gold-extra-2","tier":"gold","title":"Clarifying an Appointment","goal":"Resolve a scheduling misunderstanding.","rule":"Resolve a scheduling misunderstanding. Connect the two main ideas clearly.","sentence":"I thought our meeting was scheduled for next Wednesday.","scenario":"Practise this skill in a realistic British English conversation.","level":"B1–B2","track":"Intermediate English"},{"id":"gold-extra-3","tier":"gold","title":"Expressing a Preference","goal":"Give a practical preference with a reason.","rule":"Give a practical preference with a reason. Connect the two main ideas clearly.","sentence":"I would rather travel early to avoid heavy traffic.","scenario":"Practise this skill in a realistic British English conversation.","level":"B1–B2","track":"Intermediate English"},{"id":"gold-extra-4","tier":"gold","title":"Summarising a Short Article","goal":"Present an author's main argument fairly.","rule":"Present an author's main argument fairly. Connect the two main ideas clearly.","sentence":"The article argues that exercise improves concentration.","scenario":"Practise this skill in a realistic British English conversation.","level":"B1–B2","track":"Intermediate English"},{"id":"gold-extra-5","tier":"gold","title":"Comparing Travel Options","goal":"Balance advantages and disadvantages.","rule":"Balance advantages and disadvantages. Connect the two main ideas clearly.","sentence":"Although the coach costs less, the train is quicker.","scenario":"Practise this skill in a realistic British English conversation.","level":"B1–B2","track":"Intermediate English"},{"id":"gold-extra-6","tier":"gold","title":"Presenting a Past Achievement","goal":"Describe an achievement with clear results.","rule":"Describe an achievement with clear results. Connect the two main ideas clearly.","sentence":"I managed to complete the project ahead of schedule.","scenario":"Practise this skill in a realistic British English conversation.","level":"B1–B2","track":"Intermediate English"},{"id":"gold-extra-7","tier":"gold","title":"Making a Conditional Suggestion","goal":"Offer a hypothetical alternative politely.","rule":"Offer a hypothetical alternative politely. Connect the two main ideas clearly.","sentence":"If we left earlier, we could avoid the traffic.","scenario":"Practise this skill in a realistic British English conversation.","level":"B1–B2","track":"Intermediate English"},{"id":"gold-extra-8","tier":"gold","title":"Explaining an Unexpected Delay","goal":"Describe a problem and its cause.","rule":"Describe a problem and its cause. Connect the two main ideas clearly.","sentence":"Due to a signal failure, our train arrived thirty minutes late.","scenario":"Practise this skill in a realistic British English conversation.","level":"B1–B2","track":"Intermediate English"},{"id":"gold-extra-9","tier":"gold","title":"Giving Constructive Feedback","goal":"Deliver balanced and helpful feedback.","rule":"Deliver balanced and helpful feedback. Connect the two main ideas clearly.","sentence":"Your introduction is clear, but the conclusion needs more detail.","scenario":"Practise this skill in a realistic British English conversation.","level":"B1–B2","track":"Intermediate English"},{"id":"gold-extra-10","tier":"gold","title":"Arranging a Follow-up Call","goal":"Make a professional next-step request.","rule":"Make a professional next-step request. Connect the two main ideas clearly.","sentence":"Would you be available to discuss the proposal tomorrow?","scenario":"Practise this skill in a realistic British English conversation.","level":"B1–B2","track":"Intermediate English"},{"id":"gold-practice-1-1","tier":"gold","title":"Handling a delivery delay","goal":"Use the language pattern for handling a delivery delay in a credible discussion.","rule":"Use the present perfect passive when an event affects the present.","sentence":"The delivery has been delayed because of heavy traffic.","scenario":"Practise handling a delivery delay at a local workplace. Your team needs clear information before making a decision. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Real-world Intermediate English"},{"id":"gold-practice-1-2","tier":"gold","title":"Handling a delivery delay in Everyday Life","goal":"Use the language pattern for handling a delivery delay in a credible discussion.","rule":"Use the present perfect passive when an event affects the present.","sentence":"The parcel has been held at the depot since yesterday.","scenario":"Practise handling a delivery delay during a community event. A visitor asks you to explain what happened and what will happen next. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Practical Speaking and Writing"},{"id":"gold-practice-2-1","tier":"gold","title":"Requesting clarification","goal":"Use the language pattern for requesting clarification in a credible discussion.","rule":"Use indirect questions to make requests professional and polite.","sentence":"Could you clarify which document you need?","scenario":"Practise requesting clarification at a local workplace. Your team needs clear information before making a decision. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Real-world Intermediate English"},{"id":"gold-practice-2-2","tier":"gold","title":"Requesting clarification in Everyday Life","goal":"Use the language pattern for requesting clarification in a credible discussion.","rule":"Use indirect questions to make requests professional and polite.","sentence":"Would you mind explaining what I should bring to the appointment?","scenario":"Practise requesting clarification during a community event. A visitor asks you to explain what happened and what will happen next. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Practical Speaking and Writing"},{"id":"gold-practice-3-1","tier":"gold","title":"Expressing a concern","goal":"Use the language pattern for expressing a concern in a credible discussion.","rule":"State the issue clearly and provide a specific reason.","sentence":"I am concerned that the schedule is too ambitious.","scenario":"Practise expressing a concern at a local workplace. Your team needs clear information before making a decision. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Real-world Intermediate English"},{"id":"gold-practice-3-2","tier":"gold","title":"Expressing a concern in Everyday Life","goal":"Use the language pattern for expressing a concern in a credible discussion.","rule":"State the issue clearly and provide a specific reason.","sentence":"I am worried that the new arrangements may inconvenience residents.","scenario":"Practise expressing a concern during a community event. A visitor asks you to explain what happened and what will happen next. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Practical Speaking and Writing"},{"id":"gold-practice-4-1","tier":"gold","title":"Managing a disagreement","goal":"Use the language pattern for managing a disagreement in a credible discussion.","rule":"Acknowledge the other view before introducing a contrast.","sentence":"I understand your point, but I see a different solution.","scenario":"Practise managing a disagreement at a local workplace. Your team needs clear information before making a decision. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Real-world Intermediate English"},{"id":"gold-practice-4-2","tier":"gold","title":"Managing a disagreement in Everyday Life","goal":"Use the language pattern for managing a disagreement in a credible discussion.","rule":"Acknowledge the other view before introducing a contrast.","sentence":"I take your point; however, I would prefer to explore another option.","scenario":"Practise managing a disagreement during a community event. A visitor asks you to explain what happened and what will happen next. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Practical Speaking and Writing"},{"id":"gold-practice-5-1","tier":"gold","title":"Explaining a work process","goal":"Use the language pattern for explaining a work process in a credible discussion.","rule":"Sequence process steps with first, then and finally.","sentence":"First, we inspect the equipment, and then we record the results.","scenario":"Practise explaining a work process at a local workplace. Your team needs clear information before making a decision. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Real-world Intermediate English"},{"id":"gold-practice-5-2","tier":"gold","title":"Explaining a work process in Everyday Life","goal":"Use the language pattern for explaining a work process in a credible discussion.","rule":"Sequence process steps with first, then and finally.","sentence":"We collect the forms first, check the details and finally issue a receipt.","scenario":"Practise explaining a work process during a community event. A visitor asks you to explain what happened and what will happen next. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Practical Speaking and Writing"},{"id":"gold-practice-6-1","tier":"gold","title":"Giving constructive feedback","goal":"Use the language pattern for giving constructive feedback in a credible discussion.","rule":"Combine a specific strength with a precise improvement point.","sentence":"Your introduction is clear, although the conclusion needs more detail.","scenario":"Practise giving constructive feedback at a local workplace. Your team needs clear information before making a decision. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Real-world Intermediate English"},{"id":"gold-practice-6-2","tier":"gold","title":"Giving constructive feedback in Everyday Life","goal":"Use the language pattern for giving constructive feedback in a credible discussion.","rule":"Combine a specific strength with a precise improvement point.","sentence":"Your argument is persuasive, but the examples could be more specific.","scenario":"Practise giving constructive feedback during a community event. A visitor asks you to explain what happened and what will happen next. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Practical Speaking and Writing"},{"id":"gold-practice-7-1","tier":"gold","title":"Summarising a meeting","goal":"Use the language pattern for summarising a meeting in a credible discussion.","rule":"Report agreed actions with a clear owner and deadline.","sentence":"We agreed to review the proposal next Friday.","scenario":"Practise summarising a meeting at a local workplace. Your team needs clear information before making a decision. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Real-world Intermediate English"},{"id":"gold-practice-7-2","tier":"gold","title":"Summarising a meeting in Everyday Life","goal":"Use the language pattern for summarising a meeting in a credible discussion.","rule":"Report agreed actions with a clear owner and deadline.","sentence":"Everyone agreed that the community centre should stay open later.","scenario":"Practise summarising a meeting during a community event. A visitor asks you to explain what happened and what will happen next. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Practical Speaking and Writing"},{"id":"gold-practice-8-1","tier":"gold","title":"Making an apology","goal":"Use the language pattern for making an apology in a credible discussion.","rule":"Apologise for the specific issue and offer a practical next step.","sentence":"I am sorry that I missed your earlier message.","scenario":"Practise making an apology at a local workplace. Your team needs clear information before making a decision. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Real-world Intermediate English"},{"id":"gold-practice-8-2","tier":"gold","title":"Making an apology in Everyday Life","goal":"Use the language pattern for making an apology in a credible discussion.","rule":"Apologise for the specific issue and offer a practical next step.","sentence":"Please accept my apologies for arriving after the meeting began.","scenario":"Practise making an apology during a community event. A visitor asks you to explain what happened and what will happen next. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Practical Speaking and Writing"},{"id":"gold-practice-9-1","tier":"gold","title":"Expressing probability","goal":"Use the language pattern for expressing probability in a credible discussion.","rule":"Use probably for a likely outcome, not an absolute certainty.","sentence":"The package will probably arrive tomorrow.","scenario":"Practise expressing probability at a local workplace. Your team needs clear information before making a decision. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Real-world Intermediate English"},{"id":"gold-practice-9-2","tier":"gold","title":"Expressing probability in Everyday Life","goal":"Use the language pattern for expressing probability in a credible discussion.","rule":"Use probably for a likely outcome, not an absolute certainty.","sentence":"There is a good chance that the weather will improve by lunchtime.","scenario":"Practise expressing probability during a community event. A visitor asks you to explain what happened and what will happen next. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Practical Speaking and Writing"},{"id":"gold-practice-10-1","tier":"gold","title":"Reporting a problem","goal":"Use the language pattern for reporting a problem in a credible discussion.","rule":"Describe the observable problem before suggesting a cause.","sentence":"The heating stopped working during the night.","scenario":"Practise reporting a problem at a local workplace. Your team needs clear information before making a decision. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Real-world Intermediate English"},{"id":"gold-practice-10-2","tier":"gold","title":"Reporting a problem in Everyday Life","goal":"Use the language pattern for reporting a problem in a credible discussion.","rule":"Describe the observable problem before suggesting a cause.","sentence":"The water supply stopped unexpectedly this morning.","scenario":"Practise reporting a problem during a community event. A visitor asks you to explain what happened and what will happen next. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Practical Speaking and Writing"},{"id":"gold-practice-11-1","tier":"gold","title":"Suggesting an alternative","goal":"Use the language pattern for suggesting an alternative in a credible discussion.","rule":"Could introduces a possible alternative without pressure.","sentence":"We could arrange the appointment for Wednesday instead.","scenario":"Practise suggesting an alternative at a local workplace. Your team needs clear information before making a decision. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Real-world Intermediate English"},{"id":"gold-practice-11-2","tier":"gold","title":"Suggesting an alternative in Everyday Life","goal":"Use the language pattern for suggesting an alternative in a credible discussion.","rule":"Could introduces a possible alternative without pressure.","sentence":"Perhaps we could take a different route through the park.","scenario":"Practise suggesting an alternative during a community event. A visitor asks you to explain what happened and what will happen next. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Practical Speaking and Writing"},{"id":"gold-practice-12-1","tier":"gold","title":"Describing a trend","goal":"Use the language pattern for describing a trend in a credible discussion.","rule":"Use present perfect for changes over a period continuing to now.","sentence":"Online sales have increased steadily this year.","scenario":"Practise describing a trend at a local workplace. Your team needs clear information before making a decision. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Real-world Intermediate English"},{"id":"gold-practice-12-2","tier":"gold","title":"Describing a trend in Everyday Life","goal":"Use the language pattern for describing a trend in a credible discussion.","rule":"Use present perfect for changes over a period continuing to now.","sentence":"The number of visitors has grown rapidly over the past six months.","scenario":"Practise describing a trend during a community event. A visitor asks you to explain what happened and what will happen next. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Practical Speaking and Writing"},{"id":"gold-practice-13-1","tier":"gold","title":"Comparing two options","goal":"Use the language pattern for comparing two options in a credible discussion.","rule":"Whereas contrasts two different characteristics.","sentence":"The train is cheaper, whereas the taxi is faster.","scenario":"Practise comparing two options at a local workplace. Your team needs clear information before making a decision. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Real-world Intermediate English"},{"id":"gold-practice-13-2","tier":"gold","title":"Comparing two options in Everyday Life","goal":"Use the language pattern for comparing two options in a credible discussion.","rule":"Whereas contrasts two different characteristics.","sentence":"The village is quieter, while the city offers more facilities.","scenario":"Practise comparing two options during a community event. A visitor asks you to explain what happened and what will happen next. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Practical Speaking and Writing"},{"id":"gold-practice-14-1","tier":"gold","title":"Explaining a preference","goal":"Use the language pattern for explaining a preference in a credible discussion.","rule":"Use would rather plus the bare infinitive; compare choices with than.","sentence":"I would rather travel early than arrive late.","scenario":"Practise explaining a preference at a local workplace. Your team needs clear information before making a decision. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Real-world Intermediate English"},{"id":"gold-practice-14-2","tier":"gold","title":"Explaining a preference in Everyday Life","goal":"Use the language pattern for explaining a preference in a credible discussion.","rule":"Use would rather plus the bare infinitive; compare choices with than.","sentence":"I would prefer to eat at home rather than wait for a table.","scenario":"Practise explaining a preference during a community event. A visitor asks you to explain what happened and what will happen next. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Practical Speaking and Writing"},{"id":"gold-practice-15-1","tier":"gold","title":"Specifying a deadline","goal":"Use the language pattern for specifying a deadline in a credible discussion.","rule":"By states the latest acceptable time for completion.","sentence":"Please send the finished report by Thursday.","scenario":"Practise specifying a deadline at a local workplace. Your team needs clear information before making a decision. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Real-world Intermediate English"},{"id":"gold-practice-15-2","tier":"gold","title":"Specifying a deadline in Everyday Life","goal":"Use the language pattern for specifying a deadline in a credible discussion.","rule":"By states the latest acceptable time for completion.","sentence":"The registration form must reach the organiser by Friday afternoon.","scenario":"Practise specifying a deadline during a community event. A visitor asks you to explain what happened and what will happen next. First explain the core grammar, then write an appropriate message with a reason and one next step.","level":"B1","track":"Practical Speaking and Writing"},{"id":"gold-practice-16-1","tier":"gold","title":"Making a rec

rt.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Professional Influence"},{"id":"platinum-extension-20","tier":"platinum","title":"IELTS Data Comparison","goal":"Describe data trends without speculation.","rule":"Describe data trends without speculation. Notice the relationship between each clause and the intended register.","sentence":"The proportion increased gradually before stabilising in June.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Professional Influence"},{"id":"platinum-extension-21","tier":"platinum","title":"IELTS Process Explanation","goal":"Explain steps in a process clearly.","rule":"Explain steps in a process clearly. Notice the relationship between each clause and the intended register.","sentence":"The materials are inspected before being transferred to storage.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Professional Influence"},{"id":"platinum-extension-22","tier":"platinum","title":"IELTS Map Changes","goal":"Describe spatial transformations.","rule":"Describe spatial transformations. Notice the relationship between each clause and the intended register.","sentence":"The former car park has been replaced by a pedestrian square.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Exam and Evidence"},{"id":"platinum-extension-23","tier":"platinum","title":"Academic Listening Signposting","goal":"Identify how spoken arguments are organised.","rule":"Identify how spoken arguments are organised. Notice the relationship between each clause and the intended register.","sentence":"The speaker then introduces a contrasting viewpoint.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Exam and Evidence"},{"id":"platinum-extension-24","tier":"platinum","title":"Academic Discussion Turn-taking","goal":"Enter a formal discussion politely.","rule":"Enter a formal discussion politely. Notice the relationship between each clause and the intended register.","sentence":"May I build on the previous speaker's observation?","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Exam and Evidence"},{"id":"platinum-extension-25","tier":"platinum","title":"Debate Rebuttal Skills","goal":"Challenge claims without becoming personal.","rule":"Challenge claims without becoming personal. Notice the relationship between each clause and the intended register.","sentence":"That conclusion overlooks two important limitations.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Exam and Evidence"},{"id":"platinum-extension-26","tier":"platinum","title":"Diplomatic Performance Feedback","goal":"Give constructive professional feedback.","rule":"Give constructive professional feedback. Notice the relationship between each clause and the intended register.","sentence":"One area worth developing is the clarity of your recommendations.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Exam and Evidence"},{"id":"platinum-extension-27","tier":"platinum","title":"Leadership Meeting Decisions","goal":"Confirm decisions after debate.","rule":"Confirm decisions after debate. Notice the relationship between each clause and the intended register.","sentence":"We have agreed to prioritise the rollout in three phases.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Exam and Evidence"},{"id":"platinum-extension-28","tier":"platinum","title":"Advanced Interview Framing","goal":"Describe achievements with evidence.","rule":"Describe achievements with evidence. Notice the relationship between each clause and the intended register.","sentence":"My strongest contribution was resolving an operational bottleneck.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Exam and Evidence"},{"id":"platinum-extension-29","tier":"platinum","title":"Stakeholder Updates","goal":"Communicate progress accurately.","rule":"Communicate progress accurately. Notice the relationship between each clause and the intended register.","sentence":"The project remains on schedule despite several minor delays.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Exam and Evidence"},{"id":"platinum-extension-30","tier":"platinum","title":"Legal and Policy Caution","goal":"Use careful regulatory language.","rule":"Use careful regulatory language. Notice the relationship between each clause and the intended register.","sentence":"Any decision should remain consistent with the published guidance.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Exam and Evidence"},{"id":"platinum-extension-31","tier":"platinum","title":"Environmental Argumentation","goal":"Connect complex environmental ideas.","rule":"Connect complex environmental ideas. Notice the relationship between each clause and the intended register.","sentence":"Reducing emissions requires coordinated action across several sectors.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Exam and Evidence"},{"id":"platinum-extension-32","tier":"platinum","title":"Healthcare Communication","goal":"Communicate sensitively about wellbeing.","rule":"Communicate sensitively about wellbeing. Notice the relationship between each clause and the intended register.","sentence":"The findings should be discussed with a qualified clinician.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"Exam and Evidence"},{"id":"platinum-extension-33","tier":"platinum","title":"Technology Ethics Debate","goal":"Argue about ethics and privacy.","rule":"Argue about ethics and privacy. Notice the relationship between each clause and the intended register.","sentence":"Convenience alone cannot justify unnecessary collection of data.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"C2 Communication"},{"id":"platinum-extension-34","tier":"platinum","title":"Education Policy Discussion","goal":"Analyse structural factors in education.","rule":"Analyse structural factors in education. Notice the relationship between each clause and the intended register.","sentence":"Equal access depends on resources as well as motivation.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"C2 Communication"},{"id":"platinum-extension-35","tier":"platinum","title":"Economic Trend Reporting","goal":"Interpret economic indicators cautiously.","rule":"Interpret economic indicators cautiously. Notice the relationship between each clause and the intended register.","sentence":"Consumer confidence weakened as household costs increased.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"C2 Communication"},{"id":"platinum-extension-36","tier":"platinum","title":"Scientific Uncertainty","goal":"Explain limitations in research.","rule":"Explain limitations in research. Notice the relationship between each clause and the intended register.","sentence":"Further trials are needed before the findings can be generalised.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"C2 Communication"},{"id":"platinum-extension-37","tier":"platinum","title":"Literary Interpretation","goal":"Make evidence-based literary observations.","rule":"Make evidence-based literary observations. Notice the relationship between each clause and the intended register.","sentence":"The narrator's restraint suggests an unresolved internal conflict.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"C2 Communication"},{"id":"platinum-extension-38","tier":"platinum","title":"Metaphor and Register","goal":"Choose metaphors suitable for professional writing.","rule":"Choose metaphors suitable for professional writing. Notice the relationship between each clause and the intended register.","sentence":"The proposal offers a pathway rather than an immediate solution.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"C2 Communication"},{"id":"platinum-extension-39","tier":"platinum","title":"Advanced British Idiom","goal":"Use idiomatic British expressions appropriately.","rule":"Use idiomatic British expressions appropriately. Notice the relationship between each clause and the intended register.","sentence":"We should avoid jumping to conclusions before the review.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"C2 Communication"},{"id":"platinum-extension-40","tier":"platinum","title":"Precision Editing Workshop","goal":"Edit complex writing for clarity.","rule":"Edit complex writing for clarity. Notice the relationship between each clause and the intended register.","sentence":"The revised sentence removes ambiguity without changing its meaning.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"C2 Communication"},{"id":"platinum-extension-41","tier":"platinum","title":"Capstone: Public Policy Briefing","goal":"Integrate advanced argumentation under realistic constraints.","rule":"Integrate advanced argumentation under realistic constraints. Notice the relationship between each clause and the intended register.","sentence":"Our recommendation balances feasibility, cost and long-term impact.","scenario":"Prepare a concise and precise professional or academic explanation for a real audience.","level":"C1–C2","track":"C2 Communication"}],"stories":[{"id":"adventure-0","title":"The Missed Train","text":"The platform was quiet when Mia arrived. She checked the board and realised the final train had already left.","answer":"Mia missed the last train.","tier":"gold","level":"B1–B2","track":"Reading adventures"},{"id":"adventure-1","title":"A New Neighbour","text":"Daniel noticed boxes outside the flat next door. He introduced himself and offered to carry one upstairs.","answer":"Daniel offered help to his neighbour.","tier":"gold","level":"B1–B2","track":"Reading adventures"},{"id":"adventure-2","title":"The Lost Wallet","text":"Amira found a wallet by the supermarket entrance. She handed it to the customer service desk.","answer":"Amira handed in the wallet.","tier":"gold","level":"B1–B2","track":"Reading adventures"},{"id":"adventure-3","title":"Rain in London","text":"Heavy rain began during the walking tour. The guide took everyone to a museum until it stopped.","answer":"The group waited in the museum.","tier":"gold","level":"B1–B2","track":"Reading adventures"},{"id":"adventure-4","title":"An Unexpected Invitation","text":"Oliver received a message from an old classmate who invited him to dinner after many years.","answer":"An old friend invited Oliver to dinner.","tier":"gold","level":"B1–B2","track":"Reading adventures"},{"id":"adventure-5","title":"The Job Interview","text":"Nina prepared examples of her work. She arrived early and spoke confidently about her experience.","answer":"Nina prepared for her interview.","tier":"gold","level":"B1–B2","track":"Reading adventures"},{"id":"adventure-6","title":"A Busy Cafe","text":"Customers filled every table by noon. The manager asked another employee to help with orders.","answer":"The manager needed extra help.","tier":"gold","level":"B1–B2","track":"Reading adventures"},{"id":"adventure-7","title":"The Birthday Surprise","text":"Liam thought everybody had forgotten his birthday. His family surprised him with a cake.","answer":"Liam had a surprise birthday party.","tier":"gold","level":"B1–B2","track":"Reading adventures"},{"id":"adventure-8","title":"Moving House","text":"Sophie labelled each box before the removal van arrived. This made unpacking much easier.","answer":"Sophie organised the boxes carefully.","tier":"gold","level":"B1–B2","track":"Reading adventures"},{"id":"adventure-9","title":"A Difficult Decision","text":"Two job offers arrived on the same day. Ben compared the salary and location before deciding.","answer":"Ben compared both job offers.","tier":"gold","level":"B1–B2","track":"Reading adventures"},{"id":"adventure-10","title":"The Community Garden","text":"Residents transformed an empty space into a garden. Families now grow vegetables there together.","answer":"Residents made a community garden.","tier":"gold","level":"B1–B2","track":"Reading adventures"},{"id":"adventure-11","title":"A Delayed Flight","text":"The departure board showed a two hour delay. Passengers received refreshments while the plane was inspected.","answer":"The flight was delayed.","tier":"gold","level":"B1–B2","track":"Reading adventures"},{"id":"adventure-12","title":"The Missing Key","text":"Lucy checked her pockets before searching beneath the sofa. Her house key was there.","answer":"Lucy found her key beneath the sofa.","tier":"gold","level":"B1–B2","track":"Reading adventures"},{"id":"adventure-13","title":"A Helpful Stranger","text":"Marcus struggled to read a station map. Another passenger explained which platform he needed.","answer":"A stranger helped Marcus.","tier":"gold","level":"B1–B2","track":"Reading adventures"},{"id":"adventure-14","title":"The Library Project","text":"A school collected donated books throughout the month. Volunteers organised them into a reading room.","answer":"Volunteers made a reading room.","tier":"gold","level":"B1–B2","track":"Reading adventures"},{"id":"adventure-15","title":"First Day Abroad","text":"Priya felt nervous in a new country. She felt more confident after meeting her classmates.","answer":"Meeting classmates helped Priya.","tier":"gold","level":"B1–B2","track":"Reading adventures"},{"id":"adventure-16","title":"The Restaurant Complaint","text":"Eva's meal arrived cold. She explained the problem politely and the waiter replaced it.","answer":"The waiter replaced the cold meal.","tier":"gold","level":"B1–B2","track":"Reading adventures"},{"id":"adventure-17","title":"A Weekend Volunteer","text":"Jack helped at an animal shelter on Saturday. He cleaned rooms and prepared food for the dogs.","answer":"Jack volunteered at an animal shelter.","tier":"gold","level":"B1–B2","track":"Reading adventures"},{"id":"adventure-18","title":"Learning to Drive","text":"Hannah struggled with reversing at first. Several lessons later she felt more confident.","answer":"Practice improved Hannah's driving.","tier":"gold","level":"B1–B2","track":"Reading adventures"},{"id":"adventure-19","title":"The Important Email","text":"A supplier sent the wrong invoice. Thomas replied with his order number and requested a correction.","answer":"Thomas requested a corrected invoice.","tier":"gold","level":"B1–B2","track":"Reading adventures"},{"id":"adventure-20","title":"The Museum Discovery","text":"Visitors gathered around an ancient coin. The guide explained how it was discovered nearby.","answer":"The guide described an ancient coin.","tier":"gold","level":"B1–B2","track":"R function instruction(a){if(a.stage===0)return 'Explore the meaning, then build the language.';if(a.stage===1)return 'Tap the word blocks in the correct order.';return a.section==='ielts'?'Use the timer, then write your own exam-style answer.':'Apply the language: write your own natural response.'}
function explain(a){let x=a.item;if(a.stage===0){if(a.section==='stories')return x.text;if(a.section==='conversations')return x.speaker+'\n'+x.followup;if(a.section==='ielts')return x.prompt+'\n'+x.goal;return x.rule||x.goal||x.title}if(a.stage===1)return x.goal||x.title;return x.scenario||x.text||x.prompt||x.followup||x.goal||x.title}
function paintLesson(){const a=state.active;if(!a)return;const el=document.getElementById('rlLesson'),lesson=a.item;el.innerHTML=`<div class="rl-lesson-top"><button class="rl-btn alt" id="rlBack">← Library</button><strong>${safe(lesson.title)}</strong><div class="rl-progress"><span style="width:${(a.stage+1)/3*100}%"></span></div><span class="rl-tag">${a.stage+1}/3</span></div><div class="rl-workspace"><article class="rl-teach"><div class="rl-eyebrow">RJ ACTIVE LEARNING</div><h2>${safe(lesson.title)}</h2><p>${safe(explain(a)).replace(/\n/g,'<br>')}</p><div class="rl-hint">${safe(instruction(a))}</div>${a.section==='conversations'?`<button class="rl-btn alt rl-cta" id="rlSpeak">▶ Hear conversation line</button>`:''}</article><div class="rl-lab"><div class="rl-eyebrow">INTERACTIVE WORKSPACE</div><div class="rl-steps">${['Understand','Build','Apply'].map((x,i)=>`<span class="rl-step ${a.stage===i?'current':''}">${i+1}. ${x}</span>`).join('')}</div><div id="rlPuzzle"></div><div class="rl-lab-actions"><button class="rl-btn alt" id="rlReset">${a.stage===2?'Clear response':'Reset'}</button><button class="rl-btn" id="rlCheck">${a.stage===0?'Start practice →':'Check my work →'}</button></div><div class="rl-feedback" id="rlFeedback" hidden></div></div></div>`;
el.querySelector('#rlBack').onclick=closeLesson;el.querySelector('#rlReset').onclick=()=>{a.chosen=[];a.typed='';a.check=false;paintPuzzle()};el.querySelector('#rlCheck').onclick=check;
const speak=el.querySelector('#rlSpeak');if(speak)speak.onclick=()=>{if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(lesson.speaker||lesson.sentence||lesson.title);u.lang='en-GB';u.rate=.94;let voice=speechSynthesis.getVoices().find(v=>/en-GB/i.test(v.lang));if(voice)u.voice=voice;speechSynthesis.speak(u)};
paintPuzzle()}
function paintPuzzle(){const a=state.active;if(!a)return;const zone=document.getElementById('rlPuzzle'),f=document.getElementById('rlFeedback');f.hidden=true;const sentence=a.item.sentence||a.item.answer||'';
if(a.stage===0){zone.innerHTML=`<h3>First, explore the example</h3><p class="rl-speech">${safe(sentence||a.item.text||a.item.prompt||a.item.title)}</p><p class="rl-mini">The next step uses real word blocks. Build your own example afterwards.</p>`;return}
if(a.stage===1){let chosen=a.chosen.map(i=>a.bank[i].v).join(' '),options=a.bank.map((x,i)=>({...x,key:i})).filter(x=>!a.chosen.includes(x.key));zone.innerHTML=`<h3>Build the model sentence</h3><div class="rl-zone" id="rlAnswerZone">${chosen?safe(chosen):'<span class="rl-mini">Tap the tiles below to construct the sentence...</span>'}</div><div class="rl-tiles">${options.map(x=>`<button class="rl-tile" data-word="${x.key}">${safe(x.v)}</button>`).join('')}</div><button class="rl-btn alt rl-cta" id="rlUndo">↶ Undo last word</button>`;zone.querySelector('#rlUndo').onclick=()=>{a.chosen.pop();paintPuzzle()};zone.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{a.chosen.push(Number(b.dataset.word));paintPuzzle()});return}
zone.innerHTML=`<h3>${a.section==='ielts'?'Practise your IELTS response':a.section==='stories'?'What did you learn from the story?':a.section==='conversations'?'Reply in your own words':'Use this language in a real situation'}</h3>${a.section==='ielts'?`<p class="rl-mini">60 seconds to plan, then write a response. This is practice, not an official band score.</p><div class="rl-timer" id="rlClock">${Math.floor(a.seconds/60)}:${String(a.seconds%60).padStart(2,'0')}</div><button class="rl-btn alt" id="rlStartTimer">Start 60-second preparation</button>`:''}<textarea id="rlWriting" class="rl-textarea" aria-label="Your own English response" placeholder="Write your own English here (one or more complete sentences)...">${safe(a.typed)}</textarea><p class="rl-mini">Your response receives structural feedback, not automated human-equivalent grading.</p>`;
zone.querySelector('#rlWriting').oninput=e=>a.typed=e.target.value;
const startTimer=zone.querySelector('#rlStartTimer');if(startTimer)startTimer.onclick=()=>{if(a.timer)return;a.timer=setInterval(()=>{a.seconds--;const c=document.getElementById('rlClock');if(c)c.textContent=`${Math.floor(Math.max(0,a.seconds)/60)}:${String(Math.max(0,a.seconds)%60).padStart(2,'0')}`;if(a.seconds<=0){clearInterval(a.timer);a.timer=null;audio.success()}},1000)};
}
function feedback(ok,title,message){const f=document.getElementById('rlFeedback');if(!f)return;f.className='rl-feedback'+(ok?'':' bad');f.innerHTML=`<strong>${safe(title)}</strong><p>${safe(message)}</p>${ok?'<button class="rl-btn" id="rlNext">Next step →</button>':'<button class="rl-btn alt" id="rlRetry">Try again</button>'}`;f.hidden=false;const next=f.querySelector('#rlNext');if(next)next.onclick=()=>{const a=state.active;if(!a)return;if(a.stage<2){a.stage++;a.chosen=[];paintLesson()}else{markCompleted(a);const section=a.section,list=dataFor(section),at=list.findIndex(x=>x.id===a.item.id);closeLesson();if(at+1<list.length&&confirm('Activity complete! Open the next '+section+' activity?'))start(section,list[at+1].id)}};const retry=f.querySelector('#rlRetry');if(retry)retry.onclick=()=>f.hidden=true}
function check(){const a=state.active;if(!a)return;if(a.stage===0){audio.click();feedback(true,'Ready for the challenge','You have studied the example. Now build it using word blocks.');return}
if(a.stage===1){const actual=a.chosen.map(i=>a.bank[i].v),expected=a.tokens;let ok=actual.length===expected.length&&actual.every((x,i)=>x===expected[i]);let answer=document.getElementById('rlAnswerZone');if(answer){answer.style.background=ok?'#10b981':'#ef4444';answer.style.color='#fff';answer.style.borderColor=ok?'#059669':'#dc2626'}if(ok){audio.success();feedback(true,'Excellent construction','You placed every word in the intended order. Next, apply it to a fresh situation.')}else{audio.error();a.mistakes++;feedback(false,'Review your word order',`Start with “${expected.slice(0,Math.min(3,expected.length)).join(' ')}”. Then continue with the remaining words. You can undo or reset.`)}return}
let v=a.typed.trim(),count=terms(v).length,hasVerb=/\b(am|is|are|was|were|have|has|had|do|does|did|can|could|would|should|will|be|been|working|studying|think|believe|suggest|recommend|like|want|need|went|go|went|said|told|help|helped|visit|visited)\b/i.test(v);let ok=count>=9&&hasVerb;if(!ok){audio.error();a.mistakes++;feedback(false,'Develop your own answer',`Your answer has ${count} words. Try writing at least nine words with a complete idea, a clear verb and one relevant detail.`)}else{audio.success();feedback(true,'Your response has been saved','You produced an extended response with a verb. Consider checking pronunciation and grammar with a tutor; this simple browser check cannot confirm accuracy.')}}
function markCompleted(a){let key=a.section+':'+a.item.id;if(!state.wins[key]){state.wins[key]={day:dateKey(),mistakes:a.mistakes};const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);let p=[yesterday.getFullYear(),String(yesterday.getMonth()+1).padStart(2,'0'),String(yesterday.getDate()).padStart(2,'0')].join('-');state.streak=state.day===p?state.streak+1:state.day===dateKey()?Math.max(1,state.streak):1;state.day=dateKey()}state.attempts[key]=(state.attempts[key]||0)+1;save()}
function issueClick(evt){let target=evt.target.closest('button,a');if(target)audio.click()}
document.addEventListener('click',issueClick,{capture:true});root.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.section){state.section=b.dataset.section;state.search='';state.level='all';render()}else if(b.dataset.open){start(b.dataset.open,b.dataset.id)}else if(b.dataset.upgrade)paywall(b.dataset.upgrade);else if(b.id==='rlSound'){state.sound=!state.sound;save();render()}});
root.addEventListener('input',e=>{if(e.target.id==='rlSearch'){state.search=e.target.value;renderCards()}});root.addEventListener('change',e=>{if(e.target.id==='rlLevel'){state.level=e.target.value;renderCards()}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.active)closeLesson();const wall=document.getElementById('rlPaywall');if(wall)wall.hidden=true}});
// Time tracking while a challenge is active and browser tab is in foreground.
let activityAt=Date.now();document.addEventListener('pointerdown',()=>activityAt=Date.now(),{passive:true});document.addEventListener('keydown',()=>activityAt=Date.now());setInterval(()=>{if(!state.active||document.hidden||Date.now()-activityAt>60000)return;let today=dateKey();state.minutes[today]=(state.minutes[today]||0)+.25;save()},15000);
// Preview only. Real entitlements must be returned by your Stripe-verifying server.
const q=new URLSearchParams(location.search);if(q.get('preview')==='1'&&TIERS[q.get('tier')]!==undefined)state.tier=q.get('tier');
render();
})();
</script></body></html>

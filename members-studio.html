aseTitle":"Disagree Diplomatically in Meetings","focus":"Mastery Simulation","level":"C1","track":"Advanced British English","goal":"Challenge ideas while maintaining working relationships.","rule":"Polite disagreement acknowledges the other point before adding evidence or a different perspective. Phrases like I see the reasoning, but... and One concern might be... invite discussion. Avoid false agreement: if the proposal is unsafe or impossible, state the problem explicitly and explain why.","sentence":"I can see the benefit of a faster launch. My concern is that we haven't finished the accessibility checks.","scenario":"A manager suggests launching a product before final testing. You believe this creates avoidable problems, but the team is under pressure. Raise your objection, support it and offer a workable alternative.","sourceContext":"A manager suggests launching a product before final testing. You believe this creates avoidable problems, but the team is under pressure. Raise your objection, support it and offer a workable alternative.","missionPlace":"in the scenario above","role":"someone looking for the correct information","writingPrompt":"Topic: Disagree Diplomatically in Meetings. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to challenge ideas while maintaining working relationships. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Mastery Simulation: Topic: Disagree Diplomatically in Meetings. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to challenge ideas while maintaining working relationships. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":133},{"id":"platinum-134-3","tier":"platinum","title":"Run a Productive Meeting — Mastery Simulation","baseTitle":"Run a Productive Meeting","focus":"Mastery Simulation","level":"C1","track":"Advanced British English","goal":"Open, guide and summarise a meeting with clear actions.","rule":"A good chair states the purpose and desired outcome, keeps contributions relevant, summarises decisions and confirms owners and deadlines. Language such as Let's move on to..., Could we hear from...?, and To summarise, we've agreed... helps. Do not confuse discussion with decisions unless someone commits to an action.","sentence":"To summarise, Sam will send the draft by Tuesday, and we'll review it on Thursday.","scenario":"Your team has 20 minutes to decide the priorities for a customer launch. Two people keep repeating the same points and one quiet colleague has useful technical experience.","sourceContext":"Your team has 20 minutes to decide the priorities for a customer launch. Two people keep repeating the same points and one quiet colleague has useful technical experience.","missionPlace":"in the scenario above","role":"a colleague who has a different opinion","writingPrompt":"Topic: Run a Productive Meeting. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to open, guide and summarise a meeting with clear actions. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Mastery Simulation: Topic: Run a Productive Meeting. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to open, guide and summarise a meeting with clear actions. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":134},{"id":"platinum-135-3","tier":"platinum","title":"Negotiate Terms and Trade-offs — Mastery Simulation","baseTitle":"Negotiate Terms and Trade-offs","focus":"Mastery Simulation","level":"C1","track":"Professional Fluency","goal":"Make proposals, concessions and conditional offers confidently.","rule":"Negotiation involves identifying priorities, exploring alternatives and trading concessions. Useful structures include If you can..., we'd be able to..., In return for..., and Could we find a middle ground? Avoid agreeing before confirming what the other party has promised.","sentence":"If you can deliver by Wednesday, we'd be willing to place a larger order.","scenario":"A supplier offers a good price but a delivery date that is too late. You need earlier delivery while keeping a constructive long-term relationship.","sourceContext":"A supplier offers a good price but a delivery date that is too late. You need earlier delivery while keeping a constructive long-term relationship.","missionPlace":"in the scenario above","role":"a hiring manager asking for an example","writingPrompt":"Topic: Negotiate Terms and Trade-offs. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to make proposals, concessions and conditional offers confidently. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Mastery Simulation: Topic: Negotiate Terms and Trade-offs. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to make proposals, concessions and conditional offers confidently. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":135},{"id":"platinum-136-3","tier":"platinum","title":"Job Interviews with the STAR Method — Mastery Simulation","baseTitle":"Job Interviews with the STAR Method","focus":"Mastery Simulation","level":"B2–C1","track":"Professional Fluency","goal":"Turn experience into specific evidence-rich interview answers.","rule":"STAR stands for Situation, Task, Action and Result. The action should explain what you personally did, while the result should be accurate and specific. Avoid inventing numerical achievements or spending most of the answer on what the team did without you.","sentence":"Our team faced a backlog. I reorganised the handover checklist and checked priorities each morning. We cleared the urgent work by Friday.","scenario":"An interviewer asks about a difficult deadline, a conflict and a mistake you learned from. Prepare responses that sound genuine rather than memorised.","sourceContext":"An interviewer asks about a difficult deadline, a conflict and a mistake you learned from. Prepare responses that sound genuine rather than memorised.","missionPlace":"in the scenario above","role":"a new learner joining a group","writingPrompt":"Topic: Job Interviews with the STAR Method. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to turn experience into specific evidence-rich interview answers. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Mastery Simulation: Topic: Job Interviews with the STAR Method. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to turn experience into specific evidence-rich interview answers. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":136},{"id":"platinum-137-3","tier":"platinum","title":"Give a Persuasive Presentation — Mastery Simulation","baseTitle":"Give a Persuasive Presentation","focus":"Mastery Simulation","level":"C1","track":"Professional Fluency","goal":"Guide listeners with signposting, concrete examples and a clear takeaway.","rule":"An effective presentation begins with the question it will answer, sets out a small number of points, supports each with evidence and finishes with a memorable conclusion. Signposting should help orientation, not fill every sentence with Firstly, Secondly and Finally.","sentence":"Today I'll explain why our response times changed, what the data shows and what we propose next.","scenario":"You are presenting a five-minute improvement proposal to senior colleagues. Some care about cost and others care about customer experience. Both groups need to understand your recommendation.","sourceContext":"You are presenting a five-minute improvement proposal to senior colleagues. Some care about cost and others care about customer experience. Both groups need to understand your recommendation.","missionPlace":"in the scenario above","role":"a visitor who needs clear instructions","writingPrompt":"Topic: Give a Persuasive Presentation. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to guide listeners with signposting, concrete examples and a clear takeaway. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Mastery Simulation: Topic: Give a Persuasive Presentation. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to guide listeners with signposting, concrete examples and a clear takeaway. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":137},{"id":"platinum-138-3","tier":"platinum","title":"Lead a Difficult Customer Conversation — Mastery Simulation","baseTitle":"Lead a Difficult Customer Conversation","focus":"Mastery Simulation","level":"C1","track":"Professional Fluency","goal":"Acknowledge frustration while setting realistic expectations.","rule":"Empathy names the experience without making an impossible promise. First acknowledge what has happened, then clarify what is known, explain the next action and give a realistic update time. Avoid saying I guarantee when the outcome is uncertain.","sentence":"I understand why the delay is frustrating. I'll check the tracking details and update you by 3 pm.","scenario":"A customer's delivery is overdue and they need the goods for an event. The tracking data is incomplete and they are understandably angry. Your job is to help without inventing certainty.","sourceContext":"A customer's delivery is overdue and they need the goods for an event. The tracking data is incomplete and they are understandably angry. Your job is to help without inventing certainty.","missionPlace":"in the scenario above","role":"a friend comparing two routes","writingPrompt":"Topic: Lead a Difficult Customer Conversation. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to acknowledge frustration while setting realistic expectations. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Mastery Simulation: Topic: Lead a Difficult Customer Conversation. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to acknowledge frustration while setting realistic expectations. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":138},{"id":"platinum-139-3","tier":"platinum","title":"IELTS Speaking Part 2: Extended Answer — Mastery Simulation","baseTitle":"IELTS Speaking Part 2: Extended Answer","focus":"Mastery Simulation","level":"B2–C1","track":"IELTS Excellence","goal":"Build a coherent two-minute response without memorising an unnatural script.","rule":"Use the one-minute preparation to choose a simple example, note key events and feelings, and organise beginning, development and reflection. Answer the card rather than forcing memorised idioms into every sentence. Develop details so the examiner can follow your story. This is practice, not an official band assessment.","sentence":"I'd like to talk about a teacher who encouraged me. I first met her when... What stayed with me was...","scenario":"Describe a person who helped you learn something important. Include who they were, what you learned, how the learning happened and why it mattered to you.","sourceContext":"Describe a person who helped you learn something important. Include who they were, what you learned, how the learning happened and why it mattered to you.","missionPlace":"in the scenario above","role":"a teammate making a suggestion","writingPrompt":"Topic: IELTS Speaking Part 2: Extended Answer. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to build a coherent two-minute response without memorising an unnatural script. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Mastery Simulation: Topic: IELTS Speaking Part 2: Extended Answer. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to build a coherent two-minute response without memorising an unnatural script. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":139},{"id":"platinum-140-3","tier":"platinum","title":"IELTS Speaking Part 3: Develop Ideas — Mastery Simulation","baseTitle":"IELTS Speaking Part 3: Develop Ideas","focus":"Mastery Simulation","level":"C1","track":"IELTS Excellence","goal":"Answer abstract follow-up questions with reasoning, examples and balanced views.","rule":"Part 3 requires more than a personal anecdote. Explain a broader point, give a concrete example and consider a limitation or alternative view. It is acceptable to qualify claims with in many cases or it depends on. Avoid pretending statistics you do not know are facts.","sentence":"Schools can build confidence by allowing students to practise public speaking. However, quieter students may need smaller-group activities first.","scenario":"An examiner asks whether technology has changed the way people learn and whether governments should fund adult education. Move from personal experience to broader arguments.","sourceContext":"An examiner asks whether technology has changed the way people learn and whether governments should fund adult education. Move from personal experience to broader arguments.","missionPlace":"in the scenario above","role":"a new conversation partner","writingPrompt":"Topic: IELTS Speaking Part 3: Develop Ideas. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to answer abstract follow-up questions with reasoning, examples and balanced views. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Mastery Simulation: Topic: IELTS Speaking Part 3: Develop Ideas. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to answer abstract follow-up questions with reasoning, examples and balanced views. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":140},{"id":"platinum-141-3","tier":"platinum","title":"IELTS Writing Task 2: Balanced Essay — Mastery Simulation","baseTitle":"IELTS Writing Task 2: Balanced Essay","focus":"Mastery Simulation","level":"C1","track":"IELTS Excellence","goal":"Plan and write a focused argument with coherent paragraphs and justified examples.","rule":"Read the precise instruction first: discuss both views, agree/disagree and advantages/disadvantages demand different structures. Write a thesis that answers the actual question. Use topic sentences, logical development and specific examples; avoid memorised introductions that could fit any question. This practice is not official scoring.","sentence":"Although online learning is flexible, face-to-face teaching may offer immediate interaction. A blended approach can combine both strengths.","scenario":"Some people believe English should be taught entirely online, while others prefer classrooms. Discuss both views and give your own opinion.","sourceContext":"Some people believe English should be taught entirely online, while others prefer classrooms. Discuss both views and give your own opinion.","missionPlace":"in the scenario above","role":"a new learner joining a group","writingPrompt":"Topic: IELTS Writing Task 2: Balanced Essay. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to plan and write a focused argument with coherent paragraphs and justified examples. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Mastery Simulation: Topic: IELTS Writing Task 2: Balanced Essay. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to plan and write a focused argument with coherent paragraphs and justified examples. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":141},{"id":"platinum-142-3","tier":"platinum","title":"IELTS Academic Task 1: Describe Data — Mastery Simulation","baseTitle":"IELTS Academic Task 1: Describe Data","focus":"Mastery Simulation","level":"B2–C1","track":"IELTS Excellence","goal":"Select key trends and comparisons without inventing explanations.","rule":"For Academic Task 1, introduce the graphic, provide a clear overview and support it with selected comparisons. Use approximate language when exact values are unavailable, and avoid explaining why trends happened unless the data actually provides the cause. Distinguish a percentage-point rise from a percent increase.","sentence":"Participation rose from 20% to 30%, an increase of ten percentage points.","scenario":"A chart shows three kinds of language-study activity between 2020 and 2025. Online lessons increase, printed workbook use declines and small-group speaking remains stable. You must describe, not evaluate, the trends.","sourceContext":"A chart shows three kinds of language-study activity between 2020 and 2025. Online lessons increase, printed workbook use declines and small-group speaking remains stable. You must describe, not evaluate, the trends.","missionPlace":"in the scenario above","role":"someone who has misunderstood your message","writingPrompt":"Topic: IELTS Academic Task 1: Describe Data. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to select key trends and comparisons without inventing explanations. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Mastery Simulation: Topic: IELTS Academic Task 1: Describe Data. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to select key trends and comparisons without inventing explanations. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":142},{"id":"platinum-143-3","tier":"platinum","title":"IELTS Listening: Paraphrase and Distractors — Mastery Simulation","baseTitle":"IELTS Listening: Paraphrase and Distractors","focus":"Mastery Simulation","level":"B2–C1","track":"IELTS Excellence","goal":"Identify meaning when speakers change their minds or paraphrase answers.","rule":"Listening tests often replace the exact wording in the question with a synonym. Pay attention to corrections: We originally planned Tuesday, but we've moved it to Thursday. The first date is a distractor. Anticipate the information type without guessing before hearing the full statement.","sentence":"We were going to meet on Tuesday, but we've changed it to Thursday. The answer is Thursday.","scenario":"A student discusses course times with an adviser. The adviser mentions two older schedules, corrects one room number and confirms the final booking at the end. You must identify the confirmed details.","sourceContext":"A student discusses course times with an adviser. The adviser mentions two older schedules, corrects one room number and confirms the final booking at the end. You must identify the confirmed details.","missionPlace":"in the scenario above","role":"a new conversation partner","writingPrompt":"Topic: IELTS Listening: Paraphrase and Distractors. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to identify meaning when speakers change their minds or paraphrase answers. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Mastery Simulation: Topic: IELTS Listening: Paraphrase and Distractors. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to identify meaning when speakers change their minds or paraphrase answers. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":143},{"id":"platinum-144-3","tier":"platinum","title":"TOEIC Workplace Listening Decisions — Mastery Simulation","baseTitle":"TOEIC Workplace Listening Decisions","focus":"Mastery Simulation","level":"B1–B2","track":"TOEIC Excellence","goal":"Use context and implied meaning to understand workplace conversations.","rule":"In workplace listening, the correct response may not repeat the question's words. If someone says The meeting room is already booked, they may be refusing a proposal rather than giving a room description. Identify who is speaking, what problem exists and what action follows. This is an original practice exercise, not an official TOEIC question.","sentence":"Could we meet in Room B? I'm afraid that's booked, but Room D is free. They will probably use Room D.","scenario":"Two colleagues need to move a client meeting. One suggests a room that is unavailable and another recommends a video call. The final decision depends on the client's travel arrangements.","sourceContext":"Two colleagues need to move a client meeting. One suggests a room that is unavailable and another recommends a video call. The final decision depends on the client's travel arrangements.","missionPlace":"in the scenario above","role":"a hiring manager asking for an example","writingPrompt":"Topic: TOEIC Workplace Listening Decisions. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to use context and implied meaning to understand workplace conversations. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Mastery Simulation: Topic: TOEIC Workplace Listening Decisions. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to use context and implied meaning to understand workplace conversations. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":144},{"id":"platinum-145-3","tier":"platinum","title":"TOEIC Business Reading and Email Chains — Mastery Simulation","baseTitle":"TOEIC Business Reading and Email Chains","focus":"Mastery Simulation","level":"B2","track":"TOEIC Excellence","goal":"Track decisions, times and responsibilities across several workplace messages.","rule":"Business reading questions often require you to combine information from an email, notice and revised schedule. Identify the latest message, changes to earlier instructions, who owns each action and any deadlines. Do not assume the first document is still current after an update.","sentence":"Monday's email requests a draft by Wednesday; Tuesday's update changes the deadline to Thursday.","scenario":"You receive a supplier email, then a correction from the project manager and a revised delivery schedule. One document changes the location while another changes the date. Summarise the final arrangements.","sourceContext":"You receive a supplier email, then a correction from the project manager and a revised delivery schedule. One document changes the location while another changes the date. Summarise the final arrangements.","missionPlace":"in the scenario above","role":"a colleague who has a different opinion","writingPrompt":"Topic: TOEIC Business Reading and Email Chains. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to track decisions, times and responsibilities across several workplace messages. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Mastery Simulation: Topic: TOEIC Business Reading and Email Chains. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to track decisions, times and responsibilities across several workplace messages. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":145},{"id":"platinum-146-3","tier":"platinum","title":"Evaluate Claims and Evidence — Mastery Simulation","baseTitle":"Evaluate Claims and Evidence","focus":"Mastery Simulation","level":"C1","track":"Reading Mastery","goal":"Identify bias, missing context, selective numbers and unsupported conclusions.","rule":"Strong critical reading asks who makes a claim, what evidence supports it, what alternatives exist and which uncertainties remain. A dramatic statistic may still be misleading without a sample, timeframe or comparison group. Avoid calling something false merely because you disagree with it.","sentence":"A survey of 75 volunteers suggests interest, but the small self-selected sample limits wider conclusions.","scenario":"A website claims that 95% of users improve their English after seven days but gives no definition of improvement, method or comparison group. Decide which follow-up questions are necessary before believing the claim.","sourceContext":"A website claims that 95% of users improve their English after seven days but gives no definition of improvement, method or comparison group. Decide which follow-up questions are necessary before believing the claim.","missionPlace":"in the scenario above","role":"someone looking for the correct information","writingPrompt":"Topic: Evaluate Claims and Evidence. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to identify bias, missing context, selective numbers and unsupported conclusions. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Mastery Simulation: Topic: Evaluate Claims and Evidence. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to identify bias, missing context, selective numbers and unsupported conclusions. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":146},{"id":"platinum-147-3","tier":"platinum","title":"Summarise without Plagiarising — Mastery Simulation","baseTitle":"Summarise without Plagiarising","focus":"Mastery Simulation","level":"C1","track":"Reading Mastery","goal":"Paraphrase meaning accurately and acknowledge limits.","rule":"Good summarising keeps the main claims and logical relationships while changing the sentence structure and selection of details. Replacing every third word with a synonym is not reliable paraphrasing. In academic contexts, attribution is still necessary even when ideas are expressed in your own words.","sentence":"Original: Flexible hours allow adults to study around work. Summary: A variable timetable may help employed learners fit lessons into daily life.","scenario":"A report describes the benefits and drawbacks of remote learning. You need to provide an accurate short briefing for a colleague who has no time to read the report.","sourceContext":"A report describes the benefits and drawbacks of remote learning. You need to provide an accurate short briefing for a colleague who has no time to read the report.","missionPlace":"in the scenario above","role":"a teammate making a suggestion","writingPrompt":"Topic: Summarise without Plagiarising. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to paraphrase meaning accurately and acknowledge limits. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Mastery Simulation: Topic: Summarise without Plagiarising. Treat the situation as a timed C1/C2 assessment. Explain your decisions and give a constructive alternative. Your aim is to paraphrase meaning accurately and acknowledge limi function paint(){const a=state.active;if(!a)return;const x=a.item,el=document.getElementById('rlLesson');el.innerHTML=`<div class="rl-lesson-top"><button class="rl-btn alt" id="rlBack">← Library<\/button><strong>${safe(x.title)}<\/strong><div class="rl-progress"><span style="width:${((a.stage+1)/6*100).toFixed(1)}%"><\/span><\/div><span class="rl-tag">${a.stage+1}/6<\/span><\/div><div class="rl-workspace"><article class="rl-teach"><div class="rl-eyebrow">RJ ACTIVE LEARNING · ${safe(STEPS[a.stage])}<\/div><h2>${safe(x.baseTitle||x.title)}<\/h2><p>${safe((hint(a)).split(/[.!?]\s+/).slice(0,3).join('. '))}<\/p><div class="rl-hint">${safe(x.goal||'Understand the pattern and use it naturally.')}<\/div>${a.sec==='conversations'?'<button class="rl-btn alt rl-cta" id="rlSpeak">▶ Hear the dialogue<\/button>':''}<\/article><div class="rl-lab"><div class="rl-eyebrow">ACTIVE CANVAS<\/div><div class="rl-steps">${STEPS.map((v,i)=>`<span class="rl-step ${i===a.stage?'current':''}">${i+1}. ${v}<\/span>`).join('')}<\/div><div id="rlPuzzle"><\/div><div class="rl-lab-actions"><button class="rl-btn alt" id="rlReset">Reset step<\/button><button class="rl-btn" id="rlCheck">${a.stage===5?'Save response and finish →':'Check work →'}<\/button><\/div><div class="rl-feedback" id="rlFeedback" hidden><\/div><\/div><\/div>`;el.querySelector('#rlBack').onclick=close;el.querySelector('#rlReset').onclick=()=>{a.selected=-1;a.chosen=[];a.typed='';puzzle()};el.querySelector('#rlCheck').onclick=check;let speak=el.querySelector('#rlSpeak');if(speak)speak.onclick=()=>{if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let t=new SpeechSynthesisUtterance(x.speaker||a.model);t.lang='en-GB';t.rate=.91;const v=speechSynthesis.getVoices().find(q=>q.lang==='en-GB');if(v)t.voice=v;speechSynthesis.speak(t)};puzzle()}
function options(a){const model=a.model;const ts=words(model),unwanted1=join(ts.slice(1)),unwanted2=join(ts.slice(0,-1));return [model,unwanted1||'An incomplete response',unwanted2||'A missing final word']}
function boxOptions(a,rows,instruction){const zone=document.getElementById('rlPuzzle');zone.innerHTML=`<h3>${instruction}<\/h3><div class="rl-helper">Select the strongest response, then check your work.<\/div><div class="rl-options">${rows.map((row,i)=>`<button class="rl-choice ${a.selected===i?'selected':''}" data-choice="${i}">${safe(row)}<\/button>`).join('')}<\/div>`;zone.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{a.selected=Number(b.dataset.choice);zone.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('selected',x===b));document.getElementById('rlFeedback').hidden=true})}
function puzzle(){const a=state.active;if(!a)return;const zone=document.getElementById('rlPuzzle'),f=document.getElementById('rlFeedback');f.hidden=true;
if(a.stage===0){const word=targetWord(a);let candidates=[word,'however','because'].filter((v,i,arr)=>arr.findIndex(x=>x.toLowerCase()===v.toLowerCase())===i);while(candidates.length<3)candidates.push('carefully');let pick=hash(a.item.id)%3;let choices=[...candidates.slice(pick),...candidates.slice(0,pick)];a.correct=choices.indexOf(word);boxOptions(a,choices,`Explore this example: “${a.model}”. Tap the focus word: ${word}.`);return}
if(a.stage===1){let opts=options(a),pick=hash(a.item.id+'pattern')%3;let q=[...opts.slice(pick),...opts.slice(0,pick)];a.correct=q.indexOf(a.model);boxOptions(a,q,'Notice which sentence communicates a complete idea with no missing words.');return}
if(a.stage===2){const text=join(a.chosen.map(i=>a.bank[i].v)),rem=a.bank.map((t,i)=>({...t,key:i})).filter(x=>!a.chosen.includes(x.key));zone.innerHTML=`<h3>Construct the complete sentence<\/h3><div class="rl-zone" id="rlAnswerZone">${text?safe(text):'<span class="rl-mini">Tap the word tiles in natural order...<\/span>'}<\/div><div class="rl-tiles">${rem.map(t=>`<button class="rl-tile" data-word="${t.key}">${safe(t.v)}<\/button>`).join('')}<\/div><button class="rl-btn alt rl-cta" id="rlUndo">Undo last word<\/button>`;zone.querySelector('#rlUndo').onclick=()=>{a.chosen.pop();puzzle()};zone.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{a.chosen.push(Number(b.dataset.word));puzzle()});return}
if(a.stage===3){let parts=words(a.model);let missing=targetWord(a);let idx=parts.findIndex(t=>t.toLowerCase()===missing.toLowerCase());if(idx<0)idx=0;let fragment=join(parts.filter((t,i)=>i!==idx));let candidates=[missing,'[leave empty]','instead'];let turn=hash(a.item.id+'repair')%3;let q=[...candidates.slice(turn),...candidates.slice(0,turn)];a.correct=q.indexOf(missing);boxOptions(a,q,`Repair the missing word in this sentence: “${fragment}”.`);return}
if(a.stage===4){let target=targetWord(a),prompt=a.item.scenario||a.item.text||a.item.prompt||'Use the sentence in a realistic situation.';let choices=[a.model,join(words(a.model).slice(1)),join(words(a.model).slice(0,-1))];let turn=hash(a.item.id+'transform')%3;let q=[...choices.slice(turn),...choices.slice(0,turn)];a.correct=q.indexOf(a.model);boxOptions(a,q,`Apply the pattern ${a.item.missionPlace||'in a real conversation'}. Which complete model would you use?`);return}
zone.innerHTML=`<h3>Produce your own English<\/h3><p class="rl-sense">${safe(a.item.writingPrompt||a.item.scenario||a.item.prompt||a.item.goal||'Give a detailed response.')}<\/p><p class="rl-helper">Write at least 12 words including one complete idea. This browser checks structure only: it cannot judge grammar or IELTS bands.<\/p>${a.sec==='ielts'||/IELTS/i.test(a.item.title)?`<div class="rl-timer" id="rlClock">${Math.floor(a.seconds/60)}:${String(a.seconds%60).padStart(2,'0')}<\/div><button class="rl-btn alt" id="rlStartTimer">Start 60-second preparation<\/button>`:''}<textarea class="rl-textarea" id="rlWriting" aria-label="Your original English response" placeholder="Write a natural response in your own words...">${safe(a.typed)}<\/textarea><p class="rl-resp-note">Your response is locally saved only after completing this stage.<\/p>`;zone.querySelector('#rlWriting').oninput=e=>a.typed=e.target.value;const timer=zone.querySelector('#rlStartTimer');if(timer)timer.onclick=()=>{if(a.timer)return;a.timer=setInterval(()=>{a.seconds--;let c=document.getElementById('rlClock');if(c)c.textContent=`${Math.floor(Math.max(0,a.seconds)/60)}:${String(Math.max(0,a.seconds)%60).padStart(2,'0')}`;if(a.seconds<=0){clearInterval(a.timer);a.timer=null;sound.correct()}},1000)};
}
function feedback(ok,title,message){const a=state.active;const f=document.getElementById('rlFeedback');if(!a||!f)return;f.className='rl-feedback'+(ok?'':' bad');f.innerHTML=`<strong>${safe(title)}<\/strong><p>${safe(message)}<\/p>${ok?`<button class="rl-btn" id="rlNext">${a.stage===5?'Finish activity ✓':'Next step →'}<\/button>`:'<button class="rl-btn alt" id="rlRetry">Try again<\/button>'}`;f.hidden=false;let next=f.querySelector('#rlNext');if(next)next.onclick=()=>{if(a.stage<5){a.stage++;a.selected=-1;a.chosen=[];a.typed='';paint()}else{let key=a.sec+':'+a.item.id;if(!state.completed[key])state.completed[key]={day:today(),mistakes:a.mistakes,response:a.typed.slice(0,1500),selfReview:true};save();let sec=a.sec,at=list(sec).findIndex(x=>x.id===a.item.id);close();if(at+1<list(sec).length){let go=document.querySelector(`[data-id="${CSS.escape(list(sec)[at+1].id)}"]`);if(go)go.focus({preventScroll:true})}}};let retry=f.querySelector('#rlRetry');if(retry)retry.onclick=()=>f.hidden=true}
function check(){const a=state.active;if(!a)return;let ok=false,reason='';if(a.stage===2){let seq=a.chosen.map(i=>a.bank[i].v);ok=seq.length===a.tokens.length&&seq.every((n,i)=>n===a.tokens[i]);let b=document.getElementById('rlAnswerZone');if(b)b.classList.add(ok?'correct':'incorrect');reason=`Start with “${join(a.tokens.slice(0,Math.min(4,a.tokens.length)))}”. Add the remaining words in their original order.`}else if(a.stage===5){let v=a.typed.trim(),length=v.match(/[\p{L}\p{N}]+/gu)?.length||0;ok=length>=12&&/[.!?]$/.test(v);reason=`You have written ${length} words. Write at least 12 words, give a specific reason or detail, and finish with appropriate punctuation.`}else{ok=a.selected===a.correct;const btn=document.querySelector(`#rlPuzzle [data-choice="${a.selected}"]`);if(btn)btn.classList.add(ok?'correct':'incorrect');reason=`The complete model is “${a.model}”. Check for missing words and look at the pattern in the left-hand panel.`}if(ok){sound.correct();feedback(true,a.stage===5?'Response saved for self-review':'Correct — well done!',a.stage===5?'Your answer passes the basic structural check. Grammar, meaning and pronunciation have not been professionally verified.':'Great. Continue to the next active-learning stage.')}else{a.mistakes++;sound.wrong();feedback(false,'Not quite — try again',reason)}}
document.addEventListener('click',e=>{if(e.target.closest('button,a,[role="button"]'))sound.click()},{capture:true});
root.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.section){state.section=b.dataset.section;state.search='';state.filter='all';render()}else if(b.dataset.open)start(b.dataset.open,b.dataset.id);else if(b.dataset.upgrade)paywall(b.dataset.upgrade);else if(b.id==='rlSound'){state.sound=!state.sound;save();render()}});
root.addEventListener('input',e=>{if(e.target.id==='rlSearch'){state.search=e.target.value;drawCards()}});root.addEventListener('change',e=>{if(e.target.id==='rlLevel'){state.filter=e.target.value;drawCards()}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){const w=document.getElementById('rlPaywall');if(w&&!w.hidden)w.hidden=true;else if(state.active)close()}});
let activity=Date.now();document.addEventListener('pointerdown',()=>activity=Date.now(),{passive:true});document.addEventListener('keydown',()=>activity=Date.now());setInterval(()=>{if(!state.active||document.hidden||Date.now()-activity>60000)return;let d=today();state.studyMinutes[d]=(state.studyMinutes[d]||0)+.25;save()},15000);
// Membership selection is DEMONSTRATION ONLY and never server-verified.
const q=new URLSearchParams(location.search);if(q.get('preview')==='1'&&TIERS[q.get('tier')]!==undefined)state.tier=q.get('tier');
render();
})();</script></body></html>

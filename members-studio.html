2},{"id":"gold-073-3","tier":"gold","title":"Change an Appointment Professionally — Reading and Response","baseTitle":"Change an Appointment Professionally","focus":"Reading and Response","level":"B1","track":"Confident Conversations","goal":"Reschedule a booking politely and confirm the new arrangement.","rule":"A complete rescheduling message acknowledges the original booking, explains briefly that you cannot attend, proposes one or two alternatives and asks for confirmation. Use Could we move...?, Would Tuesday suit you? and Thank you for understanding. Avoid giving unnecessary personal details.","sentence":"I'm afraid I can't make our appointment on Thursday. Would Friday morning be possible instead?","scenario":"You have a dental appointment on Thursday but your work schedule has changed. You need to reschedule without sounding careless. The receptionist offers a time that you cannot accept.","sourceContext":"You have a dental appointment on Thursday but your work schedule has changed. You need to reschedule without sounding careless. The receptionist offers a time that you cannot accept.","missionPlace":"in the scenario above","role":"a guest who has a problem with a booking","writingPrompt":"Topic: Change an Appointment Professionally. Summarise the essential information, then explain how you would react to it in your own words. Your aim is to reschedule a booking politely and confirm the new arrangement. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Reading and Response: Topic: Change an Appointment Professionally. Summarise the essential information, then explain how you would react to it in your own words. Your aim is to reschedule a booking politely and confirm the new arrangement. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":73},{"id":"gold-074-3","tier":"gold","title":"Present Perfect or Past Simple? — Reading and Response","baseTitle":"Present Perfect or Past Simple?","focus":"Reading and Response","level":"B1","track":"Confident Conversations","goal":"Distinguish life experience, continuing situations and finished past events.","rule":"Use present perfect when the exact finished time is not important or the period connects to now: I've visited Scotland twice. Use past simple when you name a finished time: I visited Edinburgh in 2023. With yesterday, last week and in 2020, past simple is usually the correct choice.","sentence":"I've tried Thai food, but I first tried it when I visited Bangkok in 2024.","scenario":"A new colleague asks about countries you have visited and the most interesting trip you took. Start with experience and then move to specific events and dates.","sourceContext":"A new colleague asks about countries you have visited and the most interesting trip you took. Start with experience and then move to specific events and dates.","missionPlace":"in the scenario above","role":"a teacher giving constructive feedback","writingPrompt":"Topic: Present Perfect or Past Simple?. Summarise the essential information, then explain how you would react to it in your own words. Your aim is to distinguish life experience, continuing situations and finished past events. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Reading and Response: Topic: Present Perfect or Past Simple?. Summarise the essential information, then explain how you would react to it in your own words. Your aim is to distinguish life experience, continuing situations and finished past events. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":74},{"id":"gold-075-3","tier":"gold","title":"Tell Better Stories with Past Perfect — Reading and Response","baseTitle":"Tell Better Stories with Past Perfect","focus":"Reading and Response","level":"B1","track":"Confident Conversations","goal":"Make the order of two past events clear.","rule":"Past perfect, had plus past participle, can show that one past event occurred before another past event: By the time I arrived, the meeting had started. You do not need past perfect in every sentence. Establish the earlier event once, then continue naturally with past simple.","sentence":"When I reached the platform, the train had already left, so I called my colleague.","scenario":"You arrive at a wedding and discover that the ceremony started early. Explain the chain of events that led to your late arrival and what had happened before you got there.","sourceContext":"You arrive at a wedding and discover that the ceremony started early. Explain the chain of events that led to your late arrival and what had happened before you got there.","missionPlace":"in the scenario above","role":"a teacher explaining a recent change","writingPrompt":"Topic: Tell Better Stories with Past Perfect. Summarise the essential information, then explain how you would react to it in your own words. Your aim is to make the order of two past events clear. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Reading and Response: Topic: Tell Better Stories with Past Perfect. Summarise the essential information, then explain how you would react to it in your own words. Your aim is to make the order of two past events clear. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":75},{"id":"gold-076-3","tier":"gold","title":"First and Second Conditionals — Reading and Response","baseTitle":"First and Second Conditionals","focus":"Reading and Response","level":"B1","track":"Grammar in Action","goal":"Choose between a likely future consequence and an imagined situation.","rule":"The first conditional uses if plus present simple, followed by will or another likely future result: If it rains, we'll stay inside. The second uses if plus past simple, often followed by would, for an imagined or less likely situation: If I had more time, I'd travel. Avoid putting will directly into the ordinary if-clause.","sentence":"If the train is late, I'll call you. If I had a car, I'd drive.","scenario":"You are planning an event on a rainy weekend. Explain what you will do if the weather changes. Then imagine how you would plan it differently with an unlimited budget.","sourceContext":"You are planning an event on a rainy weekend. Explain what you will do if the weather changes. Then imagine how you would plan it differently with an unlimited budget.","missionPlace":"in the scenario above","role":"an audience with a follow-up question","writingPrompt":"Topic: First and Second Conditionals. Summarise the essential information, then explain how you would react to it in your own words. Your aim is to choose between a likely future consequence and an imagined situation. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Reading and Response: Topic: First and Second Conditionals. Summarise the essential information, then explain how you would react to it in your own words. Your aim is to choose between a likely future consequence and an imagined situation. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":76},{"id":"gold-077-3","tier":"gold","title":"Modals for Advice and Possibility — Reading and Response","baseTitle":"Modals for Advice and Possibility","focus":"Reading and Response","level":"B1–B2","track":"Grammar in Action","goal":"Explain advice, certainty and uncertainty accurately.","rule":"Use should or ought to for advice, must for a strong obligation or deduction, might or may for possibility, and can't for a deduction that something is impossible. Context determines meaning: You must wear a badge is obligation; She must be tired is deduction. Avoid using mustn't to mean don't need to.","sentence":"You should check the timetable. He might be delayed. She must be exhausted.","scenario":"A new employee is worried about their first week. Give sensible advice, explain what is compulsory and speculate about why a colleague has not arrived.","sourceContext":"A new employee is worried about their first week. Give sensible advice, explain what is compulsory and speculate about why a colleague has not arrived.","missionPlace":"in the scenario above","role":"a new conversation partner","writingPrompt":"Topic: Modals for Advice and Possibility. Summarise the essential information, then explain how you would react to it in your own words. Your aim is to explain advice, certainty and uncertainty accurately. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Reading and Response: Topic: Modals for Advice and Possibility. Summarise the essential information, then explain how you would react to it in your own words. Your aim is to explain advice, certainty and uncertainty accurately. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":77},{"id":"gold-078-3","tier":"gold","title":"Write Clear and Polite Emails — Reading and Response","baseTitle":"Write Clear and Polite Emails","focus":"Reading and Response","level":"B1","track":"Workplace English","goal":"Organise an email with purpose, action and next steps.","rule":"A useful professional email has a relevant subject, a brief opening, the reason for writing, a clear request and a courteous closing. Short paragraphs help the reader. Use Could you confirm...? for a request, and Please find attached... only if there really is an attachment.","sentence":"Subject: Updated meeting time. Hello Sam, Could we move our meeting to 2 pm? Please let me know if that works. Kind regards, Mina.","scenario":"A supplier has not sent a document you need for tomorrow. You want to follow up professionally, mention the deadline and suggest a quick alternative without sounding hostile.","sourceContext":"A supplier has not sent a document you need for tomorrow. You want to follow up professionally, mention the deadline and suggest a quick alternative without sounding hostile.","missionPlace":"in the scenario above","role":"a teammate making a suggestion","writingPrompt":"Topic: Write Clear and Polite Emails. Summarise the essential information, then explain how you would react to it in your own words. Your aim is to organise an email with purpose, action and next steps. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Reading and Response: Topic: Write Clear and Polite Emails. Summarise the essential information, then explain how you would react to it in your own words. Your aim is to organise an email with purpose, action and next steps. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":78},{"id":"gold-079-3","tier":"gold","title":"Small Talk Without Awkwardness — Reading and Response","baseTitle":"Small Talk Without Awkwardness","focus":"Reading and Response","level":"B1","track":"Workplace English","goal":"Start, extend and close light workplace conversations.","rule":"Small talk often begins with a shared situation, such as the journey, weekend or event. Use open follow-up questions and brief personal answers. Respect boundaries: do not assume colleagues want to discuss salary, religion or private matters. Close naturally with Lovely chatting—I'd better get back.","sentence":"How was your weekend? That sounds lovely. Have you been there before?","scenario":"You are attending your first team lunch with people you hardly know. One colleague mentions a concert, while another describes a long commute. Keep the chat moving without interrogating either person.","sourceContext":"You are attending your first team lunch with people you hardly know. One colleague mentions a concert, while another describes a long commute. Keep the chat moving without interrogating either person.","missionPlace":"in the scenario above","role":"a new learner joining a group","writingPrompt":"Topic: Small Talk Without Awkwardness. Summarise the essential information, then explain how you would react to it in your own words. Your aim is to start, extend and close light workplace conversations. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Reading and Response: Topic: Small Talk Without Awkwardness. Summarise the essential information, then explain how you would react to it in your own words. Your aim is to start, extend and close light workplace conversations. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":79},{"id":"gold-080-3","tier":"gold","title":"Read for Meaning and Inference — Reading and Response","baseTitle":"Read for Meaning and Inference","focus":"Reading and Response","level":"B1–B2","track":"Reading and Writing","goal":"Identify main ideas, implied meanings and evidence rather than guessing.","rule":"A text can state information directly or imply it through tone and context. First locate the writer's main claim. Next find the sentence that supports an inference. A plausible answer without textual support is still a guess. Distinguish fact from opinion and notice contrast markers such as however and despite.","sentence":"The café was full despite the rain. This suggests it was popular enough to attract customers in poor weather.","scenario":"An article says a council is extending library opening hours after more residents requested evening access. Read between the lines: what need is being addressed, and what information is still missing?","sourceContext":"An article says a council is extending library opening hours after more residents requested evening access. Read between the lines: what need is being addressed, and what information is still missing?","missionPlace":"in the scenario above","role":"someone who has misunderstood your message","writingPrompt":"Topic: Read for Meaning and Inference. Summarise the essential information, then explain how you would react to it in your own words. Your aim is to identify main ideas, implied meanings and evidence rather than guessing. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Reading and Response: Topic: Read for Meaning and Inference. Summarise the essential information, then explain how you would react to it in your own words. Your aim is to identify main ideas, implied meanings and evidence rather than guessing. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":80},{"id":"gold-081-3","tier":"gold","title":"Build an Effective Paragraph — Reading and Response","baseTitle":"Build an Effective Paragraph","focus":"Reading and Response","level":"B2","track":"Reading and Writing","goal":"Use a topic sentence, explanation, evidence and a concluding link.","rule":"A focused paragraph usually develops one controlling idea. Begin with a topic sentence, explain why the idea matters, provide a specific example and connect it back to the question. Avoid adding several unrelated examples or repeating the same sentence in different words.","sentence":"Flexible study times help adults learn consistently. For example, a parent may study after putting the children to bed. This flexibility reduces missed lessons.","scenario":"You are writing an article about whether online courses can help busy adults. Your reader expects a clear argument and a concrete example, not a string of unsupported opinions.","sourceContext":"You are writing an article about whether online courses can help busy adults. Your reader expects a clear argument and a concrete example, not a string of unsupported opinions.","missionPlace":"in the scenario above","role":"a guest who has a problem with a booking","writingPrompt":"Topic: Build an Effective Paragraph. Summarise the essential information, then explain how you would react to it in your own words. Your aim is to use a topic sentence, explanation, evidence and a concluding link. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Reading and Response: Topic: Build an Effective Paragraph. Summarise the essential information, then explain how you would react to it in your own words. Your aim is to use a topic sentence, explanation, evidence and a concluding link. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":81},{"id":"gold-082-3","tier":"gold","title":"Make a Complaint and Negotiate a Solution — Reading and Response","baseTitle":"Make a Complaint and Negotiate a Solution","focus":"Reading and Response","level":"B1–B2","track":"Real-Life Fluency","goal":"Be firm, respectful and specific about a service problem.","rule":"A persuasive complaint separates facts from feelings. Explain the problem, its impact and the solution you request. Use I was disappointed because..., Could you offer...?, and I would appreciate a reply by... Avoid accusations that you cannot prove.","sentence":"The room was not cleaned when ":"Reschedule a booking politely and confirm the new arrangement.","rule":"A complete rescheduling message acknowledges the original booking, explains briefly that you cannot attend, proposes one or two alternatives and asks for confirmation. Use Could we move...?, Would Tuesday suit you? and Thank you for understanding. Avoid giving unnecessary personal details.","sentence":"I'm afraid I can't make our appointment on Thursday. Would Friday morning be possible instead?","scenario":"You have a dental appointment on Thursday but your work schedule has changed. You need to reschedule without sounding careless. The receptionist offers a time that you cannot accept.","sourceContext":"You have a dental appointment on Thursday but your work schedule has changed. You need to reschedule without sounding careless. The receptionist offers a time that you cannot accept.","missionPlace":"in the scenario above","role":"a classmate who wants the main idea","writingPrompt":"Topic: Change an Appointment Professionally. Choose the correct register and wording. Explain why that phrasing is appropriate for the situation. Your aim is to reschedule a booking politely and confirm the new arrangement. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":4,"estimatedMinutes":0,"applicationTask":"Precision Practice: Topic: Change an Appointment Professionally. Choose the correct register and wording. Explain why that phrasing is appropriate for the situation. Your aim is to reschedule a booking politely and confirm the new arrangement. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":109},{"id":"gold-110-4","tier":"gold","title":"Present Perfect or Past Simple? — Precision Practice","baseTitle":"Present Perfect or Past Simple?","focus":"Precision Practice","level":"B1","track":"Confident Conversations","goal":"Distinguish life experience, continuing situations and finished past events.","rule":"Use present perfect when the exact finished time is not important or the period connects to now: I've visited Scotland twice. Use past simple when you name a finished time: I visited Edinburgh in 2023. With yesterday, last week and in 2020, past simple is usually the correct choice.","sentence":"I've tried Thai food, but I first tried it when I visited Bangkok in 2024.","scenario":"A new colleague asks about countries you have visited and the most interesting trip you took. Start with experience and then move to specific events and dates.","sourceContext":"A new colleague asks about countries you have visited and the most interesting trip you took. Start with experience and then move to specific events and dates.","missionPlace":"in the scenario above","role":"someone who has misunderstood your message","writingPrompt":"Topic: Present Perfect or Past Simple?. Choose the correct register and wording. Explain why that phrasing is appropriate for the situation. Your aim is to distinguish life experience, continuing situations and finished past events. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":4,"estimatedMinutes":0,"applicationTask":"Precision Practice: Topic: Present Perfect or Past Simple?. Choose the correct register and wording. Explain why that phrasing is appropriate for the situation. Your aim is to distinguish life experience, continuing situations and finished past events. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":110},{"id":"gold-111-4","tier":"gold","title":"Tell Better Stories with Past Perfect — Precision Practice","baseTitle":"Tell Better Stories with Past Perfect","focus":"Precision Practice","level":"B1","track":"Confident Conversations","goal":"Make the order of two past events clear.","rule":"Past perfect, had plus past participle, can llowed by would, for an imagined or less likely situation: If I had more time, I'd travel. Avoid putting will directly into the ordinary if-clause.","sentence":"If the train is late, I'll call you. If I had a car, I'd drive.","scenario":"You are planning an event on a rainy weekend. Explain what you will do if the weather changes. Then imagine how you would plan it differently with an unlimited budget.","sourceContext":"You are planning an event on a rainy weekend. Explain what you will do if the weather changes. Then imagine how you would plan it differently with an unlimited budget.","missionPlace":"in the scenario above","role":"someone looking for the correct information","writingPrompt":"Topic: First and Second Conditionals. Choose the correct register and wording. Explain why that phrasing is appropriate for the situation. Your aim is to choose between a likely future consequence and an imagined situation. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":4,"estimatedMinutes":0,"applicationTask":"Precision Practice: Topic: First and Second Conditionals. Choose the correct register and wording. Explain why that phrasing is appropriate for the situation. Your aim is to choose between a likely future consequence and an imagined situation. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":112},{"id":"gold-113-4","tier":"gold","title":"Modals for Advice and Possibility — Precision Practice","baseTitle":"Modals for Advice and Possibility","focus":"Precision Practice","level":"B1–B2","track":"Grammar in Action","goal":"Explain advice, certainty and uncertainty accurately.","rule":"Use should or ought to for advice, must for a strong obligation or deduction, might or may for possibility, and can't for a deduction that something is impossible. Context determines meaning: You must wear a badge is obligation; She must be  more residents requested evening access. Read between the lines: what need is being addressed, and what information is still missing?","sourceContext":"An article says a council is extending library opening hours after more residents requested evening access. Read between the lines: what need is being addressed, and what information is still missing?","missionPlace":"in the scenario above","role":"a guest who has a problem with a booking","writingPrompt":"Topic: Read for Meaning and Inference. Choose the correct register and wording. Explain why that phrasing is appropriate for the situation. Your aim is to identify main ideas, implied meanings and evidence rather than guessing. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":4,"estimatedMinutes":0,"applicationTask":"Precision Practice: Topic: Read for Meaning and Inference. Choose the correct register and wording. Explain why that phrasing is appropriate for the situation. Your aim is to identify main ideas, implied meanings and evidence rather than guessing. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":116},{"id":"gold-117-4","tier":"gold","title":"Build an Effective Paragraph — Precision Practice","baseTitle":"Build an Effective Paragraph","focus":"Precision Practice","level":"B2","track":"Reading and Writing","goal":"Use a topic sentence, explanation, evidence and a concluding link.","rule":"A focused paragraph usually develops one controlling idea. Begin with a topic sentence, explain why the idea matters, provide a specific example and connect it back to the question. Avoid adding several unrelated examples or repeating the same sentence in different words.","sentence":"Flexible study times help adults learn consistently. For example, a parent may study after putting the children to bed. This flexibility reduces missed lessons.","scenario":"You are writing an article about whether online courses can help busy adults. Your reader expects a clear argument and a concrete example, not a string of unsupported opinions.","sourceContext":"You are writing an article about whether online courses can help busy adults. Your reader expects a clear argument and a concrete example, not a string of unsupported opinions.","missionPlace":"in the scenario above","role":"a classmate who wants the main idea","writingPrompt":"Topic: Build an Effective Paragraph. Choose the correct register and wording. Explain why that phrasing is appropriate for the situation. Your aim is to use a topic sentence, explanation, evidence and a concluding link. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":4,"estimatedMinutes":0,"applicationTask":"Precision Practice: Topic: Build an Effective Paragraph. Choose the correct register and wording. Explain why that phrasing is appropriate for the situation. Your aim is to use a topic sentence, explanation, evidence and a concluding link. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":117},{"id":"gold-118-4","tier":"gold","title":"Make a Complaint and Negotiate a Solution — Precision Practice","baseTitle":"Make a Complaint and Negotiate a Solution","focus":"Precision Practice","level":"B1–B2","track":"Real-Life Fluency","goal":"Be firm, respectful and specific about a service problem.","rule":"A persuasive complaint separates facts from feelings. Explain the problem, its impact and the solution you request. Use I was disappointed because..., Could you offer...?, and I would appreciate a reply by... Avoid accusations that you cannot prove.","sentence":"The room was not cleaned when we arrived. Could you move us to another room or arrange cleaning immediately?","scenario":"You have booked a hotel for an important trip. The room is noisy and the heating doesn't work. The receptionist suggests a small discount, but you need a usable room.","sourceContext":"You have booked a hotel for an important trip. The room is noisy and the heating doesn't work. The receptionist suggests a small discount, but you need a usable room.","missionPlace":"in the scenario above","role":"a classmate who wants the main idea","writingPrompt":"Topic: Make a Complaint and Negotiate a Solution. Choose the correct register and wording. Explain why that phrasing is appropriate for the situation. Your aim is to be firm, respectful and specific about a service problem. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":4,"estimatedMinutes":0,"applicationTask":"Precision Practice: Topic: Make a Complaint and Negotiate a Solution. Choose the correct register and wording. Explain why that phrasing is appropriate for the situation. Your aim is to be firm, respectful and specific about a service problem. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":118},{"id":"gold-119-4","tier":"gold","title":"Pronunciation: Stress and Intonation — Precision Practice","baseTitle":"Pronunciation: Stress and Intonation","focus":"Precision Practice","level":"B2","track":"Real-Life Fluency","goal":"Use emphasis and intonation to express meaning rather than reading every word equally.","rule":"English is stress-timed: important content words often receive stronger beats than grammar words. Sentence stress can change implied meaning: I wanted the BLUE one contrasts blue with other colours. Rising and falling intonation also help indicate unfinished thoughts, questions and certainty. Pronunciation practice is not simply speaking faster.","sentence":"I ordered the BLUE jacket, not the black one. I ORDERED it; I didn't just look at it.","scenario":"A shop assistant has brought the wrong size and colour. You need to correct t nline lessons are convenient; however, some learners benefit from speaking with other people in real time.","scenario":"You are writing an article for an international student magazine: Should every university course include online learning?","sourceContext":"You are writing an article for an international student magazine: Should every university course include online learning?","missionPlace":"in the scenario above","role":"someone looking for the correct information","writingPrompt":"Topic: Writing a balanced opinion. Choose the correct register and wording. Explain why that phrasing is appropriate for the situation. Your aim is to organise a nuanced opinion with evidence, contrast and a conclusion. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":4,"estimatedMinutes":0,"applicationTask":"Precision Practice: Topic: Writing a balanced opinion. Choose the correct register and wording. Explain why that phrasing is appropriate for the situation. Your aim is to organise a nuanced opinion with evidence, contrast and a conclusion. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":129},{"id":"gold-130-4","tier":"gold","title":"Complaints and service recovery — Precision Practice","baseTitle":"Complaints and service recovery","focus":"Precision Practice","level":"B1","track":"Real-Life Tasks","goal":"Explain a service problem politely and request a practical resolution.","rule":"Give factual details first: when, where, what you expected and what occurred. Describe the impact without exaggerating. State an achievable request and offer a timeframe for a response. A calm tone can be firm.","sentence":"I ordered the blue model on 4 May, but received the black one. Could you arrange a replacement?","scenario":"A parcel arrives with the wrong product two days before a family celebration. Contact customer support and ask for the ","title":"Give a Persuasive Presentation — Professional Application","baseTitle":"Give a Persuasive Presentation","focus":"Professional Application","level":"C1","track":"Professional Fluency","goal":"Guide listeners with signposting, concrete examples and a clear takeaway.","rule":"An effective presentation begins with the question it will answer, sets out a small number of points, supports each with evidence and finishes with a memorable conclusion. Signposting should help orientation, not fill every sentence with Firstly, Secondly and Finally.","sentence":"Today I'll explain why our response times changed, what the data shows and what we propose next.","scenario":"You are presenting a five-minute improvement proposal to senior colleagues. Some care about cost and others care about customer experience. Both groups need to understand your recommendation.","sourceContext":"You are presenting a five-minute improvement proposal to senior colleagues. Some care about cost and others care about customer experience. Both groups need to understand your recommendation.","missionPlace":"in the scenario above","role":"an audience with a follow-up question","writingPrompt":"Topic: Give a Persuasive Presentation. Address a realistic professional audience with precise language, appropriate register and a clear recommendation. Your aim is to guide listeners with signposting, concrete examples and a clear takeaway. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":2,"estimatedMinutes":0,"applicationTask":"Professional Application: Topic: Give a Persuasive Presentation. Address a realistic professional audience with precise language, appropriate register and a clear recommendation. Your aim is to guide listeners with signposting, concrete examples and a clear takeaway. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":72},{"id":"platinum-073-2","tier":"platinum","title":"Lead a Difficult Customer Conversation — Professional Application","baseTitle":"Lead a Difficult Customer Conversation","focus":"Professional Application","level":"C1","track":"Professional Fluency","goal":"Acknowledge frustration while setting realistic expectations.","rule":"Empathy names the experience without making an impossible promise. First acknowledge what has happened, then clarify what is known, explain the next action and give a realistic update time. Avoid saying I guarantee when the outcome is uncertain.","sentence":"I understand why the delay is frustrating. I'll check the tracking details and update you by 3 pm.","scenario":"A customer's delivery is overdue and they need the goods for an event. The tracking data is incomplete and they are understandably angry. Your job is to help without inventing certainty.","sourceContext":"A customer's delivery is overdue and they need the goods for an event. The tracking data is incomplete and they are understandably angry. Your job is to help without inventing certainty.","missionPlace":"in the scenario above","role":"a customer or member of staff","writingPrompt":"Topic: Lead a Difficult Customer Conversation. Address a realistic professional audience with precise language, appropriate register and a clear recommendation. Your aim is to acknowledge frustration while setting realistic expectations. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":2,"estimatedMinutes":0,"applicationTask":"Professional Application: Topic: Lead a Difficult Customer Conversation. Address a realistic professional audience with precise language, appropriate register and a clear recommendation. Your aim is to acknowledge frustration while setting realistic expectations. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":73},{"id":"platinum-074-2" rked example.","lessonOrdinal":74},{"id":"platinum-075-2","tier":"platinum","title":"IELTS Speaking Part 3: Develop Ideas — Professional Application","baseTitle":"IELTS Speaking Part 3: Develop Ideas","focus":"Professional Application","level":"C1","track":"IELTS Excellence","goal":"Answer abstract follow-up questions with reasoning, examples and balanced views.","rule":"Part 3 requires more than a personal anecdote. Explain a broader point, give a concrete example and consider a limitation or alternative view. It is acceptable to qualify claims with in many cases or it depends on. Avoid pretending statistics you do not know are facts.","sentence":"Schools can build confidence by allowing students to practise public speaking. However, quieter students may need smaller-group activities first.","scenario":"An examiner asks whether technology has changed the way people learn and whether governments should fund adult education. Move from personal experience to broader arguments.","sourceContext":"An examiner asks whether technology has changed the way people learn and whether governments should fund adult education. Move from personal experience to broader arguments.","missionPlace":"in the scenario above","role":"a classmate who wants the main idea","writingPrompt":"Topic: IELTS Speaking Part 3: Develop Ideas. Address a realistic professional audience with precise language, appropriate register and a clear recommendation. Your aim is to answer abstract follow-up questions with reasoning, examples and balanced views. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":2,"estimatedMinutes":0,"applicationTask":"Professional Application: Topic: IELTS Speaking Part 3: Develop Ideas. Address a realistic professional audience with precise language, appropriate register and a clear recommendation. Your aim is to answer abstract follow-up questions with reasoning, examples and balanced views. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":75},{"id":"platinum-076-2","tier":"platinum","title":"IELTS Writing Task 2: Balanced Essay — Professional Application","baseTitle":"IELTS Writing Task 2: Balanced Essay","focus":"Professional Application","level":"C1","track":"IELTS Excellence","goal":"Plan and write a focused argument with coherent paragraphs and justified examples.","rule":"Read the precise instruction first: discuss both views, agree/disagree and advantages/disadvantages demand different structures. Write a thesis that answers the actual question. Use topic sentences, logical development and specific examples; avoid memorised introductions that could fit any question. This practice is not official scoring.","sentence":"Although online learning is flexible, face-to-face teaching may offer immediate interaction. A blended approach can combine both strengths.","scenario":"Some people believe English should be taught entirely online, while others prefer classrooms. Discuss both views and give your own opinion.","sourceContext":"Some people believe English should be taught entirely online, while others prefer classrooms. Discuss both views and give your own opinion.","missionPlace":"in the scenario above","role":"a hiring manager asking for an example","writingPrompt":"Topic: IELTS Writing Task 2: Balanced Essay. Address a realistic professional audience with precise language, appropriate register and a clear recommendation. Your aim is to plan and write a focused argument with coherent paragraphs and justified examples. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":2,"estimatedMinutes":0,"applicationTask":"Professional Application: Topic: IELTS Writing Task 2: Balanced Essay. Address a realistic professional audience with precise language, appropriate register and a clear recommendation. Your aim is to plan and ic professional audience with precise language, appropriate register and a clear recommendation. Your aim is to select key trends and comparisons without inventing explanations. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":77},{"id":"platinum-078-2","tier":"platinum","title":"IELTS Listening: Paraphrase and Distractors — Professional Application","baseTitle":"IELTS Listening: Paraphrase and Distractors","focus":"Professional Application","level":"B2–C1","track":"IELTS Excellence","goal":"Identify meaning when speakers change their minds or paraphrase answers.","rule":"Listening tests often replace the exact wording in the question with a synonym. Pay attention to corrections: We originally planned Tuesday, but we've moved it to Thursday. The first date is a distractor. Anticipate the information type without guessing before hearing the full statement.","sentence":"We were going to meet on Tuesday, but we've changed it to Thursday. The answer is Thursday.","scenario":"A student discusses course times with an adviser. The adviser mentions two older schedules, corrects one room number and confirms the final booking at the end. You must identify the confirmed details.","sourceContext":"A student discusses course times with an adviser. The adviser mentions two older schedules, corrects one room number and confirms the final booking at the end. You must identify the confirmed details.","missionPlace":"in the scenario above","role":"a classmate who wants the main idea","writingPrompt":"Topic: IELTS Listening: Paraphrase and Distractors. Address a realistic professional audience with precise language, appropriate register and a clear recommendation. Your aim is to identify meaning when speakers change their minds or paraphrase answers. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":2,"estimatedMinutes":0,"applicationTask":"Professional Application: Topic: IELTS Listening: Paraphrase and Distractors. Address a realistic professional audience with precise language, appropriate register and a clear recommendation. Your aim is to identify meaning when speakers change their minds or paraphrase answers. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":78},{"id":"platinum-079-2","tier":"platinum","title":"TOEIC Workplace Listening Decisions — Professional Application","baseTitle":"TOEIC Workplace Listening Decisions","focus":"Professional Application","level":"B1–B2","track":"TOEIC Excellence","goal":"Use context and implied meaning to understand workplace conversations.","rule":"In workplace listening, the correct response may not repeat the question's words. If someone says The meeting room is already booked, they may be refusing a proposal rather than giving a room description. Identify who is speaking, what problem exists and what action follows. This is an original practice exercise, not an official TOEIC question.","sentence":"Could we meet in Room B? I'm afraid that's booked, but Room D is free. They will probably use Room D.","scenario":"Two colleagues need to move a client meeting. One suggests a room that is unavailable and another recommends a video call. The final decision depends on the client's travel arrangements.","sourceContext":"Two colleagues need to move a client meeting. One suggests a room that is unavailable and another recommends a video call. The final decision depends on the client's travel arrangements.","missionPlace":"in the scenario above","role":"a new learner joining a group","writingPrompt":"Topic: TOEIC Workplace Listening Decisions. Address a realistic professional audience with precise language, appropriate register and a clear recommendation. Your aim is to use context and implied meaning to understand workplace conversations. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":2,"estimatedMinutes":0,"applicationTask":"Professional Application: Topic: TOEIC Workplace Listening Decisions. Address a realistic professional audience with precise language, appropriate register and a clear recommendation. Your aim is to use context and implied meaning to understand workplace conversations. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":79},{"id":"platinum-080-2","tier":"platinum","title":"TOEIC Business Reading and Email Chains — Professional Application","baseTitle":"TOEIC Business Reading and Email Chains","focus":"Professional Application","level":"B2","track":"TOEIC Excellence","goal":"Track decisions, times and responsibilities across several workplace messages.","rule":"Business reading questions often require you to combine information from an email, notice and revised schedule. Identify the latest message, changes to earlier instructions, who owns each action and any deadlines. Do not assume the first document is still current after an update.","sentence":"Monday's email requests a draft by Wednesday; Tuesday's update changes the deadline to Thursday.","scenario":"You receive a supplier email, then a correction from the project manager and a revised delivery schedule. One document changes the location while another changes the date. Summarise the final arrangements.","sourceContext":"You receive a supplier email, then a correction from the project manager and a revised delivery schedule. One document changes the location while another changes the date. Summarise the final arrangements.","missionPlace":"in the scenario above","role":"someone looking for the correct information","writingPrompt":"Topic: TOEIC Business Reading and Email Chains. Address a realistic professional audience with precise language, appropriate register and a clear recommendation. Your aim is to track decisions, times and responsibilities across several workplace messages. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":2,"estimatedMinutes":0,"applicationTask":"Professional Application: Topic: TOEIC Business Reading and Email Chains. Address a realistic professional audience with precise language, appropriate register and a clear recommendation. Your aim is to track decisions, times and responsibilities across several workplace messages. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":80},{"id":"platinum-081-2","tier":"platinum","title":"Evaluate Claims and Evidence — Professional Application","baseTitle":"Evaluate Claims and Evidence","focus":"Professional Application","level":"C1","track":"Reading Mastery","goal":"Identify bias, missing context, selective numbers and unsupported conclusions.","rule":"Strong critical reading asks who makes a claim, what evidence supports it, what alternatives exist and which uncertainties remain. A dramatic statistic may still be misleading without a sample, timeframe or comparison group. Avoid calling something false merely because you disagree with it.","sentence":"A survey of 75 volunteers suggests interest, but the small self-selected sample limits wider conclusions.","scenario":"A website claims that 95% of users improve their English after seven days but gives no definition of improvement, method or comparison group. Decide which follow-up questions are necessary before believing the claim.","sourceContext":"A website claims that 95% of users improve their English after seven days but gives no definition of improvement, method or comparison group. Decide which follow-up questions are necessary before believing the claim.","missionPlace":"in the scenario above","role":"a colleague who has a different opinion","writingPrompt":"Topic: Evaluate Claims and Evidence. Address a realistic professional audience with precise language, appropriate register and a clear recommendation. Your aim is to identify bias, missing context, selective numbers and unsupported conclusions. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":2,"estimatedMinutes":0,"applicationTask":"Professional Application: Topic: Evaluate Claims and Evidence. Address a realistic professional audience with precise language, appropriate register and a clear recommendation. Your aim is to identify bias, missing context, selective numbers and unsupported conclusions. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":81},{"id":"platinum-082-2","tier":"platinum","title":"Summarise without Plagiarising — Professional Application","baseTitle":"Summarise without Plagiarising","focus":"Professional Application","level":"C1","track":"Reading Mastery","goal":"Paraphrase meaning accurately and acknowledge limits.","rule":"Good summarising keeps the main claims and logical relationships while changing the sentence structure and selection of details. Replacing every third word with a synonym is not reliable paraphrasing. In academic contexts, attribution is still necessary even when ideas are expressed in your own words.","sentence":"Original: Flexible hours allow adults to study around work. Summary: A variable timetable may help employed learners fit lessons into daily life.","scenario":"A report describes the benefits and drawbacks of remote learning. You need to provide an accurate short briefing for a colleague who has no time to read the report.","sourceContext":"A report describes the benefits and drawbacks of remote learning. You need to provide an accurate short briefing for a colleague who has no time to read the report.","missionPlace":"in the scenario above","role":"a guest who has a problem with a booking","writingPrompt":"Topic: Summarise without Plagiarising. Address a realistic professional audience with precise language, appropriate register and a clear recommendation. Your aim is to paraphrase meaning accurately and acknowledge limits. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":2,"estimatedMinutes":0,"applicationTask":"Professional Application: Topic: Summarise without Plagiarising. Address a realistic professional audience with precise language, appropriate register and a clear recommendation. Your aim is to paraphrase meaning accurately and acknowledge limits. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":82},{"id":"platinum-083-2","tier":"platinum","title":"Write a Persuasive Proposal — Professional Application","baseTitle":"Write a Persuasive Proposal","focus":"Professional Application","level":"C1","track":"Writing Mastery","goal":"Combine a clear recommendation, benefits, evidence, risks and implementation steps.","rule":"A proposal should tell the reader exactly what decision is requested. Show likely benefits, honest costs and risks, and a sequence for implementation. Distinguish evidence from projections and avoid promising outcomes that have not been validated.","sentence":"I recommend a four-week pilot, measured by attendance, learner progress and cost per active student.","scenario":"An education business is considering a new speaking course. Management needs a proposal explaining who it serves, how it works, how success will be measured and what could go wrong.","sourceContext":"An education business is considering a new speaking course. Management needs a proposal explaining who it serves, how it works, how success will be measured and what could go wrong.","missionPlace":"in the scenario above","role":"a guest who has a problem with a booking","writingPrompt":"Topic: Write a Persuasive Proposal. Address a realistic professional audience with precise language, appropriate register and a clear recommendation. Your aim is to combine a clear recommendation, benefits, evidence, risks and implementation steps. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":2,"estimatedMinutes":0,"applicationTask":"Professional Application: Topic: Write a Persuasive Proposal. Address a realistic professional audience with precise language, appropriate register and a clear recommendation. Your aim is to combine a clear recommendation, benefits, evidence, risks and implementation steps. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":83},{"id":"platinum-084-2","tier":"platinum","title":"Edit for Clarity and Concision — Professional Application","baseTitle":"Edit for Clarity and Concision","focus":"Professional Application","level":"C1","track":"Writing Mastery","goal":"Improve organisation and meaning without removing necessary detail.","rule":"Editing starts with purpose: what must the reader understand or do? Cut duplication, replace vague nouns with specific ones and break overloaded sentences. Preserve essential qualifications. Concision does not mean deleting context or removing politeness from a sensitive message.","sentence":"Due to a scheduling conflict, we need to move Thursday's review to Friday at 10 am.","scenario":"A long customer-support message repeats itself, hides the requested action and contains several ambiguous dates. Edit it into a concise, accurate response that customers can follow.","sourceContext":"A long customer-support message repeats itself, hides the requested action and contains several ambiguous dates. Edit it into a concise, accurate response that customers can follow.","missionPlace":"in the scenario above","role":"a receptionist who needs important details","writingPrompt":"Topic: Edit for Clarity and Concision. Address a realistic professional audience with precise language, appropriate register and a clear recommendation. Your aim is to improve organisation and meaning without removing necessary detail. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":2,"estimatedMinutes":0,"applicationTask":"Professional Application: Topic: Edit for Clarity and Concision. Address a realistic professional audience with precise language, appropriate register and a clear recommendation. Your aim is to improve organisation and meaning without removing necessary detail. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":84},{"id":"platinum-085-2","tier":"platinum","title":"Integrated Airport and Hotel Mission — Professional Application","baseTitle":"Integrated Airport and Hotel Mission","focus":"Professional Application","level":"B2–C1","track":"Mastery Challenges","goal":"Combine planning, listening, problem-solving and professional language.","rule":"Real-life fluency means adapting when the first plan fails. Clarify information, explain a problem, propose alternatives and confirm the result. Use suitable register with airport staff, hotel reception and a colleague. Your final account should clearly distinguish known information from assumptions.","sentence":"Our flight has been delayed. Could you confirm whether the transfer booking can be moved to 9 pm?","scenario":"You arrive in a new city two hours late. Your airport transfer has left, the hotel says your booking may be cancelled and you have a meeting in the morning. You must prioritise the issues and resolve them in order.","sourceContext":"You arrive in a new city two hours late. Your airport transfer has left, the hotel says your booking may be cancelled and you have a meeting in the morning. You must prioritise the issues and resolve them in order.","missionPlace":"in the scenari

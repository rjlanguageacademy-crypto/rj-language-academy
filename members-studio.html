h","goal":"Talk about predictions, decisions and plans naturally.","rule":"Use going to for intentions already decided and predictions based on visible evidence. Use will for a decision made at the moment of speaking or a general prediction. Use the present continuous with future time for arrangements already organised: I'm meeting Lara at six.","sentence":"I've booked the tickets. We're flying to Manchester on Friday. I think it'll be busy.","scenario":"Your friend asks you to help organise a weekend trip. Some things are already booked, some are intentions and one decision must be made immediately. Explain the differences accurately.","sourceContext":"Your friend asks you to help organise a weekend trip. Some things are already booked, some are intentions and one decision must be made immediately. Explain the differences accurately.","missionPlace":"in the scenario above","role":"a friend comparing two routes","writingPrompt":"Topic: Will, Going To and Arrangements. First write a clear, accurate version using straightforward language, then add a suitable follow-up question. Your aim is to talk about predictions, decisions and plans naturally. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":1,"estimatedMinutes":0,"applicationTask":"Clear Foundations: Topic: Will, Going To and Arrangements. First write a clear, accurate version using straightforward language, then add a suitable follow-up question. Your aim is to talk about predictions, decisions and plans naturally. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":5},{"id":"silver-006-1","tier":"silver","title":"For and Since with Present Perfect — Clear Foundations","baseTitle":"For and Since with Present Perfect","focus":"Clear Foundations","level":"A2","track":"Everyday British English","goal":"Describe how long something has continued until now.","rule":"Use ation, leave space for the other person to reply. Ask a question instead of delivering a long speech.","sentence":"Hi, I'm Mina. I'm from Bangkok, but I live in Bedford now. What about you?","scenario":"A new colleague has joined your team in the UK. You meet at the coffee machine before work. They smile and ask whether you are new. Keep your answer friendly and brief, then help them join the conversation.","sourceContext":"A new colleague has joined your team in the UK. You meet at the coffee machine before work. They smile and ask whether you are new. Keep your answer friendly and brief, then help them join the conversation.","missionPlace":"in the scenario above","role":"someone looking for the correct information","writingPrompt":"Topic: Introduce Yourself Naturally. Respond as you would in a real conversation, with one helpful detail and a polite question or request. Your aim is to introduce yourself, give useful details and ask a follow-up question. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":2,"estimatedMinutes":0,"applicationTask":"Guided Everyday Practice: Topic: Introduce Yourself Naturally. Respond as you would in a real conversation, with one helpful detail and a polite question or request. Your aim is to introduce yourself, give useful details and ask a follow-up question. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":25},{"id":"silver-026-2","tier":"silver","title":"Present Simple and Present Continuous — Guided Everyday Practice","baseTitle":"Present Simple and Present Continuous","focus":"Guided Everyday Practice","level":"A1","track":"Everyday British English","goal":"Choose accurately between routines and actions happening now.","rule":"Use the present simple for routines, habits and general facts: I work on Mondays. Use the present continuous for a temporary action happening now or around and brief, then help them join the conversation.","sourceContext":"A new colleague has joined your team in the UK. You meet at the coffee machine before work. They smile and ask whether you are new. Keep your answer friendly and brief, then help them join the conversation.","missionPlace":"in the scenario above","role":"a guest who has a problem with a booking","writingPrompt":"Topic: Introduce Yourself Naturally. Write independently without copying the example. Add an explanation and a realistic follow-up. Your aim is to introduce yourself, give useful details and ask a follow-up question. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Independent Sentence Challenge: Topic: Introduce Yourself Naturally. Write independently without copying the example. Add an explanation and a realistic follow-up. Your aim is to introduce yourself, give useful details and ask a follow-up question. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":49},{"id":"silver-050-3","tier":"silver","title":"Present Simple and Present Continuous — Independent Sentence Challenge","baseTitle":"Present Simple and Present Continuous","focus":"Independent Sentence Challenge","level":"A1","track":"Everyday British English","goal":"Choose accurately between routines and actions happening now.","rule":"Use the present simple for routines, habits and general facts: I work on Mondays. Use the present continuous for a temporary action happening now or around now: I'm working on a difficult project this week. Some state verbs, such as know, usually do not take the continuous form.","sentence":"I usually take the bus, but I'm walking to work today.","scenario":"A friend calls while you are preparing dinner. Tell them what you are doing now, what you usually do after work and why tonight is different. Contrast the two time frames clearly.","sourceContext":"A friend calls while you are preparing dinner. Tell them what you are doing now, what you usually do after work and why tonight is different. Contrast the two time frames clearly.","missionPlace":"in the scenario above","role":"a new learner joining a group","writingPrompt":"Topic: Present Simple and Present Continuous. Write independently without copying the example. Add an explanation and a realistic follow-up. Your aim is to choose accurately between routines and actions happening now. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Independent Sentence Challenge: Topic: Present Simple and Present Continuous. Write independently without copying the example. Add an explanation and a realistic follow-up. Your aim is to choose accurately between routines and actions happening now. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":50},{"id":"silver-051-3","tier":"silver","title":"In, On and At for Time — Independent Sentence Challenge","baseTitle":"In, On and At for Time","focus":"Independent Sentence Challenge","level":"A1–A2","track":"Everyday British English","goal":"Explain and use the main time prepositions correctly.","rule":"Use at for exact clock times, on for named days and dates, and in for months, years and broad parts of the day. Say at 8:30, on Friday, in October and in the morning. Some expressions are exceptions: at night, on Monday morning, at the weekend in common British usage.","sentence":"My interview is at half past ten on Tuesday in November.","scenario":"You are arranging a group lesson with students in three countries. You need to give a date, a day and an exact start time. Write an unambiguous confirmation that everyone can check later.","sourceContext":"You are arranging a group lesson with students in three countries. You need to give a date, a day and an exact start time. Write an unambiguous confirmation that everyone can check later.","missionPlace":"in the scenario above","role":"a guest who has a problem with a booking","writingPrompt":"Topic: In, On and At for Time. Write independently without copying the example. Add an explanation and a realistic follow-up. Your aim is to explain and use the main time prepositions correctly. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Independent Sentence Challenge: Topic: In, On and At for Time. Write independently without copying the example. Add an explanation and a realistic follow-up. Your aim is to explain and use the main time prepositions correctly. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":51},{"id":"silver-052-3","tier":"silver","title":"Tell a Story in the Past — Independent Sentence Challenge","baseTitle":"Tell a Story in the Past","focus":"Independent Sentence Challenge","level":"A2","track":"Everyday British English","goal":"Tell an understandable story using past simple and useful sequencing.","rule":"Use the past simple to report completed actions and events: arrived, missed, called, found. Time markers such as first, then, after that and finally help listeners follow the sequence. Keep the order clear and add a result or reaction at the end.","sentence":"Yesterday I missed the bus, so I walked to the station. Fortunately, I caught the next train.","scenario":"You arrived late for a meeting after your train was cancelled. Explain what happened without blaming everyone else. Give the sequence, what you tried and the eventual result.","sourceContext":"You arrived late for a meeting after your train was cancelled. Explain what happened without blaming everyone else. Give the sequence, what you tried and the eventual result.","missionPlace":"in the scenario above","role":"a friend comparing two routes","writingPrompt":"Topic: Tell a Story in the Past. Write independently without copying the example. Add an explanation and a realistic follow-up. Your aim is to tell an understandable story using past simple and useful sequencing. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Independent Sentence Challenge: Topic: Tell a Story in the Past. Write independently without copying the example. Add an explanation and a realistic follow-up. Your aim is to tell an understandable story using past simple and useful sequencing. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":52},{"id":"silver-053-3","tier":"silver","title":"Will, Going To and Arrangements — Independent Sentence Challenge","baseTitle":"Will, Going To and Arrangements","focus":"Independent Sentence Challenge","level":"A2","track":"Everyday British English","goal":"Talk about predictions, decisions and plans naturally.","rule":"Use going to for intentions already decided and predictions based on visible evidence. Use will for a decision made at the moment of speaking or a general prediction. Use the present continuous with future time for arrangements already organised: I'm meeting Lara at six.","sentence":"I've booked the tickets. We're flying to Manchester on Friday. I think it'll be busy.","scenario":"Your friend asks you to help organise a weekend trip. Some things are already booked, some are intentions and one decision must be made immediately. Explain the differences accurately.","sourceContext":"Your friend asks you to help organise a weekend trip. Some things are already booked, some are intentions and one decision must be made immediately. Explain the differences accurately.","missionPlace":"in the scenario above","role":"someone who has misunderstood your message","writingPrompt":"Topic: Will, Going To and Arrangements. Write independently without copying the example. Add an explanation and a realistic follow-up. Your aim is to talk about predictions, decisions and plans naturally. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Independent Sentence Challenge: Topic: Will, Going To and Arrangements. Write independently without copying the example. Add an explanation and a realistic follow-up. Your aim is to talk about predictions, decisions and plans naturally. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":53},{"id":"silver-054-3","tier":"silver","title":"For and Since with Present Perfect — Independent Sentence Challenge","baseTitle":"For and Since with Present Perfect","focus":"Independent Sentence Challenge","level":"A2","track":"Everyday British English","goal":"Describe how long something has continued until now.","rule":"Use for with a duration, such as for three months or for a long time. Use since with a starting point, such as since 2022 or since Monday. Present perfect links a past beginning to the present: I've lived here for two years. Present perfect continuous can emphasise an ongoing activity: I've been studying since breakfast.","sentence":"She's worked here since May, and she's been learning English for six months.","scenario":"You meet someone at an English-language meetup. They ask about your job, where you live and how long you have been learning English. Give three accurate answers with different time expressions.","sourceContext":"You meet someone at an English-language meetup. They ask about your job, where you live and how long you have been learning English. Give three accurate answers with different time expressions.","missionPlace":"in the scenario above","role":"a friend comparing two routes","writingPrompt":"Topic: For and Since with Present Perfect. Write independently without copying the example. Add an explanation and a realistic follow-up. Your aim is to describe how long something has continued until now. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Independent Sentence Challenge: Topic: For and Since with Present Perfect. Write independently without copying the example. Add an explanation and a realistic follow-up. Your aim is to describe how long something has continued until now. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":54},{"id":"silver-055-3","tier":"silver","title":"To and For: Purpose and Benefit — Independent Sentence Challenge","baseTitle":"To and For: Purpose and Benefit","focus":"Independent Sentence Challenge","level":"A2","track":"Practical Grammar","goal":"Explain why something happens or who receives a benefit.","rule":"Use to plus the base verb when you mean purpose: I went online to book a ticket. Use for plus a noun or -ing form to describe function or benefit: This app is for learning vocabulary; the gift is for Sam. Do not put a plain verb directly after for when you mean purpose.","sentence":"I went to the library to study. This quiet room is for students.","scenario":"You are recommending a language course to a friend. Explain what the course is for, why you personally joined it and what activities it helps you do.","sourceContext":"You are recommending a language course to a friend. Explain what the course is for, why you personally joined it and what activities it helps you do.","missionPlace":"in the scenario above","role":"a friend comparing two routes","writingPrompt":"Topic: To and For: Purpose and Benefit. Write independently without copying the example. Add an explanation and a realistic follow-up. Your aim is to explain why something happens or who receives a benefit. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Independent Sentence Challenge: Topic: To and For: Purpose and Benefit. Write independently without copying the example. Add an explanation and a realistic follow-up. Your aim is to explain why something happens or who receives a benefit. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":55},{"id":"silver-056-3","tier":"silver","title":"But, Although and However — Independent Sentence Challenge","baseTitle":"But, Although and However","focus":"Independent Sentence Challenge","level":"A2","track":"Practical Grammar","goal":"Connect contrasting ideas in complete sentences.","rule":"But joins contrasting clauses inside a sentence. Although introduces a dependent clause and can appear at the beginning or in the middle. However links two independent ideas and normally takes punctuation: The test was difficult. However, I finished it. Avoid starting a sentence with Although and forgetting the main clause.","sentence":"Although the train was delayed, we arrived on time. The journey was long, but comfortable.","scenario":"A hotel looks excellent in photographs, but its location is inconvenient and its rooms are expensive. Write a balanced review using three different ways to express contrast.","sourceContext":"A hotel looks excellent in photographs, but its location is inconvenient and its rooms are expensive. Write a balanced review using three different ways to express contrast.","missionPlace":"in the scenario above","role":"an audience with a follow-up question","writingPrompt":"Topic: But, Although and However. Write independently without copying the example. Add an explanation and a realistic follow-up. Your aim is to connect contrasting ideas in complete sentences. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Independent Sentence Challenge: Topic: But, Although and However. Write independently without copying the example. Add an explanation and a realistic follow-up. Your aim is to connect contrasting ideas in complete sentences. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":56},{"id":"silver-057-3","tier":"silver","title":"Articles: A, An and The — Independent Sentence Challenge","baseTitle":"Articles: A, An and The","focus":"Independent Sentence Challenge","level":"A2","track":"Practical Grammar","goal":"Make sentences more natural by choosing or omitting articles.","rule":"Use a or an when introducing one non-specific countable thing, and the when both speaker and listener know which thing is meant. Choose a or an by sound rather than spelling: an hour, a university. Many plural and uncountable general statements take no article: Books are useful; Water is essential.","sentence":"I saw a café near the station. The café had an outdoor table.","scenario":"A friend is visiting your town for the first time. Recommend a restaurant and a park. Introduce the places, then refer back to them naturally without repeating names.","sourceContext":"A friend is visiting your town for the first time. Recommend a restaurant and a park. Introduce the places, then refer back to them naturally without repeating names.","missionPlace":"in the scenario above","role":"someone looking for the correct information","writingPrompt":"Topic: Articles: A, An and The. Write independently without copying the example. Add an explanation and a realistic follow-up. Your aim is to make sentences more natural by choosing or omitting articles. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Independent Sentence Challenge: Topic: Articles: A, An and The. Write independently without copying the example. Add an explanation and a realistic follow-up. Your aim is to make sentences more natural by choosing or omitting articles. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":57},{"id":"silver-058-3","tier":"silver","title":"Ask for Directions and Clarify — Independent Sentence Challenge","baseTitle":"Ask for Directions and Clarify","focus":"Independent Sentence Challenge","level":"A2","track":"Real-Life Tasks","goal":"Understand and give directions without getting lost.","rule":"Start with a clear landmark. Use go straight on, turn left, cross the road, opposite and next to. If a direction is unclear, ask for a repeat: Sorry, did you say the second left? Check the destination before walking away.","sentence":"Go past the bank, take the second right and the library is opposite the station.","scenario":"A visitor is trying to reach the library from the railway station. There are two turns and one confusing junction. Give precise directions and offer a clarification if they look uncertain.","sourceContext":"A visitor is trying to reach the library from the railway station. There are two turns and one confusing junction. Give precise directions and offer a clarification if they look uncertain.","missionPlace":"in the scenario above","role":"a customer or member of staff","writingPrompt":"Topic: Ask for Directions and Clarify. Write independently without copying the example. Add an explanation and a realistic follow-up. Your aim is to understand and give directions without getting lost. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Independent Sentence Challenge: Topic: Ask for Directions and Clarify. Write independently without copying the example. Add an explanation and a realistic follow-up. Your aim is to understand and give directions without getting lost. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":58},{"id":"silver-059-3","tier":"silver","title":"Polite Requests in British English — Independent Sentence Challenge","baseTitle":"Polite Requests in British English","focus":"Independent Sentence Challenge","level":"A2","track":"Real-Life Tasks","goal":"Make requests that sound friendly and appropriately formal.","rule":"Could you...? and Would you mind...? often sound less direct than an imperative. Add please where natural, but do not rely on please alone to make a command polite. With Would you mind, use an -ing verb: Would you mind opening the window? For a response, try Of course, No problem or I'm afraid I can't today.","sentence":"Could you send me the details when you have a moment, please?","scenario":"You need a colleague to swap a short shift and a receptionist to correct a booking. The situations require slightly different levels of formality. Choose wording carefully.","sourceContext":"You need a colleague to swap a short shift and a receptionist to correct a booking. The situations require slightly different levels of formality. Choose wording carefully.","missionPlace":"in the scenario above","role":"a hiring manager asking for an example","writingPrompt":"Topic: Polite Requests in British English. Write independently without copying the example. Add an explanation and a realistic follow-up. Your aim is to make requests that sound friendly and appropriately formal. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Independent Sentence Challenge: Topic: Polite Requests in British English. Write independently without copying the example. Add an explanation and a realistic follow-up. Your aim is to make requests that sound friendly and appropriately formal. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":59},{"id":"silver-060-3","tier":"silver","title":"Shopping, Returns and Refunds — Independent Sentence Challenge","baseTitle":"Shopping, Returns and Refunds","focus":"Independent Sentence Challenge","level":"A2","track":"Real-Life Tasks","goal":"Explain a shopping problem and ask for a reasonable solution.","rule":"State what you bought, when you bought it and what went wrong. Use clear factual language and an appropriate request: Could I exchange it? I would like a refund, please. Distinguish a refund, a replacement and an exchange.","sentence":"I bought these headphones last Saturday, but the left side doesn't work. Could I have a replacement?","scenario":"You bought a kettle that stopped working after two days. A shop assistant asks what happened and whether you have a receipt. Explain the situation and ask for your preferred outcome.","sourceContext":"You bought a kettle that stopped working after two days. A shop assistant asks what happened and whether you have a receipt. Explain the situation and ask for your preferred outcome.","missionPlace":"in the scenario above","role":"an audience with a follow-up question","writingPrompt":"Topic: Shopping, Returns and Refunds. Write independently without copying the example. Add an explanation and a realistic follow-up. Your aim is to explain a shopping problem and ask for a reasonable solution. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":3,"estimatedMinutes":0,"applicationTask":"Independent Sentence Challenge: Topic: Shopping, Returns and Refunds. Write independently without copying the example. Add an explanation and a realistic follow-up. Your aim is to explain a shopping problem and ask for a reasonable solution. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":60}],"gold":[{"id":"gold-001-1","tier":"gold","title":"Change an Appointment Professionally — Core Language Lab","baseTitle":"Change an Appointment Professionally","focus":"Core Language Lab","level":"B1","track":"Confident Conversations","goal":"Reschedule a booking politely and confirm the new arrangement.","rule":"A complete rescheduling message acknowledges the original booking, explains briefly that you cannot attend, proposes one or two alternatives and asks for confirmation. Use Could we move...?, Would Tuesday suit you? and Thank you for understanding. Avoid giving unnecessary personal details.","sentence":"I'm afraid I can't make our appointment on Thursday. Would Friday morning be possible instead?","scenario":"You have a dental appointment on Thursday but your work schedule has changed. You need to reschedule without sounding careless. The receptionist offers a time that you cannot accept.","sourceContext":"You have a dental appointment on Thursday but your work schedule has changed. You need to reschedule without sounding careless. The receptionist offers a time that you cannot accept.","missionPlace":"in the scenario above","role":"a teacher giving constructive feedback","writingPrompt":"Topic: Change an Appointment Professionally. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to reschedule a booking politely and confirm the new arrangement. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":1,"estimatedMinutes":0,"applicationTask":"Core Language Lab: Topic: Change an Appointment Professionally. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to reschedule a booking politely and confirm the new arrangement. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":1},{"id":"gold-002-1","tier":"gold","title":"Present Perfect or Past Simple? — Core Language Lab","baseTitle":"Present Perfect or Past Simple?","focus":"Core Language Lab","level":"B1","track":"Confident Conversations","goal":"Distinguish life experience, continuing situations and finished past events.","rule":"Use present perfect when the exact finished time is not important or the period connects to now: I've visited Scotland twice. Use past simple when you name a finished time: I visited Edinburgh in 2023. With yesterday, last week and in 2020, past simple is usually the correct choice.","sentence":"I've tried Thai food, but I first tried it when I visited Bangkok in 2024.","scenario":"A new colleague asks about countries you have visited and the most interesting trip you took. Start with experience and then move to specific events and dates.","sourceContext":"A new colleague asks about countries you have visited and the most interesting trip you took. Start with experience and then move to specific events and dates.","missionPlace":"in the scenario above","role":"a new learner joining a group","writingPrompt":"Topic: Present Perfect or Past Simple?. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to distinguish life experience, continuing situations and finished past events. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":1,"estimatedMinutes":0,"applicationTask":"Core Language Lab: Topic: Present Perfect or Past Simple?. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to distinguish life experience, continuing situations and finished past events. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":2},{"id":"gold-003-1","tier":"gold","title":"Tell Better Stories with Past Perfect — Core Language Lab","baseTitle":"Tell Better Stories with Past Perfect","focus":"Core Language Lab","level":"B1","track":"Confident Conversations","goal":"Make the order of two past events clear.","rule":"Past perfect, had plus past participle, can show that one past event occurred before another past event: By the time I arrived, the meeting had started. You do not need past perfect in every sentence. Establish the earlier event once, then continue naturally with past simple.","sentence":"When I reached the platform, the train had already left, so I called my colleague.","scenario":"You arrive at a wedding and discover that the ceremony started early. Explain the chain of events that led to your late arrival and what had happened before you got there.","sourceContext":"You arrive at a wedding and discover that the ceremony started early. Explain the chain of events that led to your late arrival and what had happened before you got there.","missionPlace":"in the scenario above","role":"a friend comparing two routes","writingPrompt":"Topic: Tell Better Stories with Past Perfect. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to make the order of two past events clear. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":1,"estimatedMinutes":0,"applicationTask":"Core Language Lab: Topic: Tell Better Stories with Past Perfect. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to make the order of two past events clear. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":3},{"id":"gold-004-1","tier":"gold","title":"First and Second Conditionals — Core Language Lab","baseTitle":"First and Second Conditionals","focus":"Core Language Lab","level":"B1","track":"Grammar in Action","goal":"Choose between a likely future consequence and an imagined situation.","rule":"The first conditional uses if plus present simple, followed by will or another likely future result: If it rains, we'll stay inside. The second uses if plus past simple, often followed by would, for an imagined or less likely situation: If I had more time, I'd travel. Avoid putting will directly into the ordinary if-clause.","sentence":"If the train is late, I'll call you. If I had a car, I'd drive.","scenario":"You are planning an event on a rainy weekend. Explain what you will do if the weather changes. Then imagine how you would plan it differently with an unlimited budget.","sourceContext":"You are planning an event on a rainy weekend. Explain what you will do if the weather changes. Then imagine how you would plan it differently with an unlimited budget.","missionPlace":"in the scenario above","role":"a guest who has a problem with a booking","writingPrompt":"Topic: First and Second Conditionals. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to choose between a likely future consequence and an imagined situation. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":1,"estimatedMinutes":0,"applicationTask":"Core Language Lab: Topic: First and Second Conditionals. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to choose between a likely future consequence and an imagined situation. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":4},{"id":"gold-005-1","tier":"gold","title":"Modals for Advice and Possibility — Core Language Lab","baseTitle":"Modals for Advice and Possibility","focus":"Core Language Lab","level":"B1–B2","track":"Grammar in Action","goal":"Explain advice, certainty and uncertainty accurately.","rule":"Use should or ought to for advice, must for a strong obligation or deduction, might or may for possibility, and can't for a deduction that something is impossible. Context determines meaning: You must wear a badge is obligation; She must be tired is deduction. Avoid using mustn't to mean don't need to.","sentence":"You should check the timetable. He might be delayed. She must be exhausted.","scenario":"A new employee is worried about their first week. Give sensible advice, explain what is compulsory and speculate about why a colleague has not arrived.","sourceContext":"A new employee is worried about their first week. Give sensible advice, explain what is compulsory and speculate about why a colleague has not arrived.","missionPlace":"in the scenario above","role":"a teacher explaining a recent change","writingPrompt":"Topic: Modals for Advice and Possibility. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to explain advice, certainty and uncertainty accurately. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":1,"estimatedMinutes":0,"applicationTask":"Core Language Lab: Topic: Modals for Advice and Possibility. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to explain advice, certainty and uncertainty accurately. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":5},{"id":"gold-006-1","tier":"gold","title":"Write Clear and Polite Emails — Core Language Lab","baseTitle":"Write Clear and Polite Emails","focus":"Core Language Lab","level":"B1","track":"Workplace English","goal":"Organise an email with purpose, action and next steps.","rule":"A useful professional email has a relevant subject, a brief opening, the reason for writing, a clear request and a courteous closing. Short paragraphs help the reader. Use Could you confirm...? for a request, and Please find attached... only if there really is an attachment.","sentence":"Subject: Updated meeting time. Hello Sam, Could we move our meeting to 2 pm? Please let me know if that works. Kind regards, Mina.","scenario":"A supplier has not sent a document you need for tomorrow. You want to follow up professionally, mention the deadline and suggest a quick alternative without sounding hostile.","sourceContext":"A supplier has not sent a document you need for tomorrow. You want to follow up professionally, mention the deadline and suggest a quick alternative without sounding hostile.","missionPlace":"in the scenario above","role":"a receptionist who needs important details","writingPrompt":"Topic: Write Clear and Polite Emails. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to organise an email with purpose, action and next steps. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":1,"estimatedMinutes":0,"applicationTask":"Core Language Lab: Topic: Write Clear and Polite Emails. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to organise an email with purpose, action and next steps. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":6},{"id":"gold-007-1","tier":"gold","title":"Small Talk Without Awkwardness — Core Language Lab","baseTitle":"Small Talk Without Awkwardness","focus":"Core Language Lab","level":"B1","track":"Workplace English","goal":"Start, extend and close light workplace conversations.","rule":"Small talk often begins with a shared situation, such as the journey, weekend or event. Use open follow-up questions and brief personal answers. Respect boundaries: do not assume colleagues want to discuss salary, religion or private matters. Close naturally with Lovely chatting—I'd better get back.","sentence":"How was your weekend? That sounds lovely. Have you been there before?","scenario":"You are attending your first team lunch with people you hardly know. One colleague mentions a concert, while another describes a long commute. Keep the chat moving without interrogating either person.","sourceContext":"You are attending your first team lunch with people you hardly know. One colleague mentions a concert, while another describes a long commute. Keep the chat moving without interrogating either person.","missionPlace":"in the scenario above","role":"a visitor who needs clear instructions","writingPrompt":"Topic: Small Talk Without Awkwardness. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to start, extend and close light workplace conversations. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":1,"estimatedMinutes":0,"applicationTask":"Core Language Lab: Topic: Small Talk Without Awkwardness. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to start, extend and close light workplace conversations. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":7},{"id":"gold-008-1","tier":"gold","title":"Read for Meaning and Inference — Core Language Lab","baseTitle":"Read for Meaning and Inference","focus":"Core Language Lab","level":"B1–B2","track":"Reading and Writing","goal":"Identify main ideas, implied meanings and evidence rather than guessing.","rule":"A text can state information directly or imply it through tone and context. First locate the writer's main claim. Next find the sentence that supports an inference. A plausible answer without textual support is still a guess. Distinguish fact from opinion and notice contrast markers such as however and despite.","sentence":"The café was full despite the rain. This suggests it was popular enough to attract customers in poor weather.","scenario":"An article says a council is extending library opening hours after more residents requested evening access. Read between the lines: what need is being addressed, and what information is still missing?","sourceContext":"An article says a council is extending library opening hours after more residents requested evening access. Read between the lines: what need is being addressed, and what information is still missing?","missionPlace":"in the scenario above","role":"a customer or member of staff","writingPrompt":"Topic: Read for Meaning and Inference. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to identify main ideas, implied meanings and evidence rather than guessing. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":1,"estimatedMinutes":0,"applicationTask":"Core Language Lab: Topic: Read for Meaning and Inference. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to identify main ideas, implied meanings and evidence rather than guessing. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":8},{"id":"gold-009-1","tier":"gold","title":"Build an Effective Paragraph — Core Language Lab","baseTitle":"Build an Effective Paragraph","focus":"Core Language Lab","level":"B2","track":"Reading and Writing","goal":"Use a topic sentence, explanation, evidence and a concluding link.","rule":"A focused paragraph usually develops one controlling idea. Begin with a topic sentence, explain why the idea matters, provide a specific example and connect it back to the question. Avoid adding several unrelated examples or repeating the same sentence in different words.","sentence":"Flexible study times help adults learn consistently. For example, a parent may study after putting the children to bed. This flexibility reduces missed lessons.","scenario":"You are writing an article about whether online courses can help busy adults. Your reader expects a clear argument and a concrete example, not a string of unsupported opinions.","sourceContext":"You are writing an article about whether online courses can help busy adults. Your reader expects a clear argument and a concrete example, not a string of unsupported opinions.","missionPlace":"in the scenario above","role":"a teacher giving constructive feedback","writingPrompt":"Topic: Build an Effective Paragraph. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to use a topic sentence, explanation, evidence and a concluding link. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":1,"estimatedMinutes":0,"applicationTask":"Core Language Lab: Topic: Build an Effective Paragraph. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to use a topic sentence, explanation, evidence and a concluding link. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":9},{"id":"gold-010-1","tier":"gold","title":"Make a Complaint and Negotiate a Solution — Core Language Lab","baseTitle":"Make a Complaint and Negotiate a Solution","focus":"Core Language Lab","level":"B1–B2","track":"Real-Life Fluency","goal":"Be firm, respectful and specific about a service problem.","rule":"A persuasive complaint separates facts from feelings. Explain the problem, its impact and the solution you request. Use I was disappointed because..., Could you offer...?, and I would appreciate a reply by... Avoid accusations that you cannot prove.","sentence":"The room was not cleaned when we arrived. Could you move us to another room or arrange cleaning immediately?","scenario":"You have booked a hotel for an important trip. The room is noisy and the heating doesn't work. The receptionist suggests a small discount, but you need a usable room.","sourceContext":"You have booked a hotel for an important trip. The room is noisy and the heating doesn't work. The receptionist suggests a small discount, but you need a usable room.","missionPlace":"in the scenario above","role":"a teacher giving constructive feedback","writingPrompt":"Topic: Make a Complaint and Negotiate a Solution. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to be firm, respectful and specific about a service problem. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":1,"estimatedMinutes":0,"applicationTask":"Core Language Lab: Topic: Make a Complaint and Negotiate a Solution. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to be firm, respectful and specific about a service problem. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":10},{"id":"gold-011-1","tier":"gold","title":"Pronunciation: Stress and Intonation — Core Language Lab","baseTitle":"Pronunciation: Stress and Intonation","focus":"Core Language Lab","level":"B2","track":"Real-Life Fluency","goal":"Use emphasis and intonation to express meaning rather than reading every word equally.","rule":"English is stress-timed: important content words often receive stronger beats than grammar words. Sentence stress can change implied meaning: I wanted the BLUE one contrasts blue with other colours. Rising and falling intonation also help indicate unfinished thoughts, questions and certainty. Pronunciation practice is not simply speaking faster.","sentence":"I ordered the BLUE jacket, not the black one. I ORDERED it; I didn't just look at it.","scenario":"A shop assistant has brought the wrong size and colour. You need to correct the misunderstanding without sounding angry. Use contrastive stress so they understand exactly which detail is wrong.","sourceContext":"A shop assistant has brought the wrong size and colour. You need to correct the misunderstanding without sounding angry. Use contrastive stress so they understand exactly which detail is wrong.","missionPlace":"in the scenario above","role":"a new learner joining a group","writingPrompt":"Topic: Pronunciation: Stress and Intonation. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to use emphasis and intonation to express meaning rather than reading every word equally. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":1,"estimatedMinutes":0,"applicationTask":"Core Language Lab: Topic: Pronunciation: Stress and Intonation. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to use emphasis and intonation to express meaning rather than reading every word equally. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":11},{"id":"gold-012-1","tier":"gold","title":"Collocations and Phrasal Verbs in Context — Core Language Lab","baseTitle":"Collocations and Phrasal Verbs in Context","focus":"Core Language Lab","level":"B2","track":"Real-Life Fluency","goal":"Choose word combinations that sound natural in British English.","rule":"Collocations are words frequently used together, such as make a decision, heavy traffic and meet a deadline. Phrasal verbs may be separable or inseparable: turn the music down or turn down the music, but look after the children. Learn each expression with a complete example and register.","sentence":"We need to make a decision before Friday and follow up with the supplier.","scenario":"Your team is organising an event under pressure. Several colleagues use unnatural combinations. Rewrite their updates so the language sounds fluent and appropriate.","sourceContext":"Your team is organising an event under pressure. Several colleagues use unnatural combinations. Rewrite their updates so the language sounds fluent and appropriate.","missionPlace":"in the scenario above","role":"a hiring manager asking for an example","writingPrompt":"Topic: Collocations and Phrasal Verbs in Context. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to choose word combinations that sound natural in British English. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":1,"estimatedMinutes":0,"applicationTask":"Core Language Lab: Topic: Collocations and Phrasal Verbs in Context. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to choose word combinations that sound natural in British English. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":12},{"id":"gold-013-1","tier":"gold","title":"Managing misunderstandings politely — Core Language Lab","baseTitle":"Managing misunderstandings politely","focus":"Core Language Lab","level":"B1","track":"Workplace English","goal":"Clarify misunderstandings without sounding defensive.","rule":"When there has been confusion, acknowledge the issue, describe the facts without blaming, and check the next action. Could we check what was agreed? and I may have misunderstood are useful softeners. State deadlines precisely.","sentence":"I think we may have understood the deadline differently. Could we confirm whether the report is due on Thursday or Friday?","scenario":"A colleague believes you agreed to send a report on Thursday, but your notes say Friday. Resolve the misunderstanding in a calm two-minute conversation.","sourceContext":"A colleague believes you agreed to send a report on Thursday, but your notes say Friday. Resolve the misunderstanding in a calm two-minute conversation.","missionPlace":"in the scenario above","role":"a classmate who wants the main idea","writingPrompt":"Topic: Managing misunderstandings politely. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to clarify misunderstandings without sounding defensive. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":1,"estimatedMinutes":0,"applicationTask":"Core Language Lab: Topic: Managing misunderstandings politely. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to clarify misunderstandings without sounding defensive. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":13},{"id":"gold-014-1","tier":"gold","title":"Making comparisons with nuance — Core Language Lab","baseTitle":"Making comparisons with nuance","focus":"Core Language Lab","level":"B1","track":"Practical Grammar","goal":"Compare options and justify your preference with accurate structures.","rule":"Use comparative forms such as cheaper than and more convenient than for two options. Use as ... as to signal similar qualities. Add however or although to acknowledge a disadvantage. Avoid double comparatives such as more better.","sentence":"The train is slightly more expensive than the coach, but it is almost twice as fast.","scenario":"You are helping a visitor choose between a train, coach and taxi for a weekend journey. They care about cost and convenience.","sourceContext":"You are helping a visitor choose between a train, coach and taxi for a weekend journey. They care about cost and convenience.","missionPlace":"in the scenario above","role":"someone who has misunderstood your message","writingPrompt":"Topic: Making comparisons with nuance. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to compare options and justify your preference with accurate structures. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":1,"estimatedMinutes":0,"applicationTask":"Core Language Lab: Topic: Making comparisons with nuance. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to compare options and justify your preference with accurate structures. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":14},{"id":"gold-015-1","tier":"gold","title":"Present perfect versus past simple — Core Language Lab","baseTitle":"Present perfect versus past simple","focus":"Core Language Lab","level":"B1","track":"Practical Grammar","goal":"Connect experiences to the present and finished events to a past time.","rule":"Use the present perfect for experience or recent events relevant now when no finished past time is specified: I have visited York. Use past simple with finished time expressions: I visited York last year. Do not combine present perfect with yesterday or last Friday.","sentence":"I have visited Scotland twice. I went there most recently in 2024.","scenario":"A colleague asks you about places you have worked and a recent job interview. Distinguish experience from a particular finished event.","sourceContext":"A colleague asks you about places you have worked and a recent job interview. Distinguish experience from a particular finished event.","missionPlace":"in the scenario above","role":"a receptionist who needs important details","writingPrompt":"Topic: Present perfect versus past simple. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to connect experiences to the present and finished events to a past time. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":1,"estimatedMinutes":0,"applicationTask":"Core Language Lab: Topic: Present perfect versus past simple. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to connect experiences to the present and finished events to a past time. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":15},{"id":"gold-016-1","tier":"gold","title":"Disagreeing respectfully in meetings — Core Language Lab","baseTitle":"Disagreeing respectfully in meetings","focus":"Core Language Lab","level":"B1","track":"Workplace English","goal":"Challenge an idea while keeping colleagues engaged.","rule":"Lead with a shared aim, state a specific concern, give a reason and suggest an alternative. Try I see your point, but ... or Could we consider ...? Avoid attacking the speaker; address the proposal.","sentence":"I see why that might save time. My concern is the impact on customers. Could we trial it for one week?","scenario":"In a team meeting someone proposes shortening customer support hours. You disagree because customers may need evening support.","sourceContext":"In a team meeting someone proposes shortening customer support hours. You disagree because customers may need evening support.","missionPlace":"in the scenario above","role":"a colleague who has a different opinion","writingPrompt":"Topic: Disagreeing respectfully in meetings. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to challenge an idea while keeping colleagues engaged. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":1,"estimatedMinutes":0,"applicationTask":"Core Language Lab: Topic: Disagreeing respectfully in meetings. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to challenge an idea while keeping colleagues engaged. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":16},{"id":"gold-017-1","tier":"gold","title":"Conditionals for real decisions — Core Language Lab","baseTitle":"Conditionals for real decisions","focus":"Core Language Lab","level":"B1","track":"Practical Grammar","goal":"Use zero, first and second conditionals to discuss facts and possibilities.","rule":"Zero conditional describes usual results: If you heat water, it boils. First conditional describes a possible future: If it rains, we will stay in. Second conditional describes an unreal or less likely situation: If I had more time, I would practise more.","sentence":"If we finish early, we will take the later train. If I had a car, I would drive.","scenario":"You are planning an outdoor team event. Weather and transport may change, and a colleague asks about an unlikely alternative.","sourceContext":"You are planning an outdoor team event. Weather and transport may change, and a colleague asks about an unlikely alternative.","missionPlace":"in the scenario above","role":"a new conversation partner","writingPrompt":"Topic: Conditionals for real decisions. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to use zero, first and second conditionals to discuss facts and possibilities. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":1,"estimatedMinutes":0,"applicationTask":"Core Language Lab: Topic: Conditionals for real decisions. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to use zero, first and second conditionals to discuss facts and possibilities. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":17},{"id":"gold-018-1","tier":"gold","title":"Understanding implied meaning — Core Language Lab","baseTitle":"Understanding implied meaning","focus":"Core Language Lab","level":"B1–B2","track":"Reading & Listening","goal":"Recognise polite indirect language and what speakers intend.","rule":"Meaning often depends on context rather than the literal words. I am not sure that will work may politely mean disagreement. Ask a checking question if important: Do you mean we should try another option? Distinguish a cautious suggestion from a confirmed decision.","sentence":"That might be difficult to arrange at short notice. Shall we look at next week?","scenario":"A manager says a proposal is interesting but may need more work. Decide whether it is approval, rejection or a request to revise.","sourceContext":"A manager says a proposal is interesting but may need more work. Decide whether it is approval, rejection or a request to revise.","missionPlace":"in the scenario above","role":"a visitor who needs clear instructions","writingPrompt":"Topic: Understanding implied meaning. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to recognise polite indirect language and what speakers intend. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":1,"estimatedMinutes":0,"applicationTask":"Core Language Lab: Topic: Understanding implied meaning. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to recognise polite indirect language and what speakers intend. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":18},{"id":"gold-019-1","tier":"gold","title":"Reporting speech accurately — Core Language Lab","baseTitle":"Reporting speech accurately","focus":"Core Language Lab","level":"B1","track":"Practical Grammar","goal":"Report another person’s request, suggestion and statement clearly.","rule":"After said, use a reported clause or include to someone: She said that she was busy; She told me that she was busy. For requests use asked someone to do something. Backshifting of tenses is common when reporting past conversations but not always compulsory for still-true statements.","sentence":"He said he was unavailable and asked me to call on Monday.","scenario":"After an important phone call, your colleague asks what the client said, requested and promised.","sourceContext":"After an important phone call, your colleague asks what the client said, requested and promised.","missionPlace":"in the scenario above","role":"a colleague who has a different opinion","writingPrompt":"Topic: Reporting speech accurately. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to report another person’s request, suggestion and statement clearly. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":1,"estimatedMinutes":0,"applicationTask":"Core Language Lab: Topic: Reporting speech accurately. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to report another person’s request, suggestion and statement clearly. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":19},{"id":"gold-020-1","tier":"gold","title":"Phrasal verbs in everyday life — rt it with two distinct reasons, acknowledge one counterargument and end with a clear judgement. Linking words guide the reader, but ideas—not a long list of connectors—create coherence.","sentence":"Online lessons are convenient; however, some learners benefit from speaking with other people in real time.","scenario":"You are writing an article for an international student magazine: Should every university course include online learning?","sourceContext":"You are writing an article for an international student magazine: Should every university course include online learning?","missionPlace":"in the scenario above","role":"a guest who has a problem with a booking","writingPrompt":"Topic: Writing a balanced opinion. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to organise a nuanced opinion with evidence, contrast and a conclusion. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":1,"estimatedMinutes":0,"applicationTask":"Core Language Lab: Topic: Writing a balanced opinion. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to organise a nuanced opinion with evidence, contrast and a conclusion. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":21},{"id":"gold-022-1","tier":"gold","title":"Complaints and service recovery — Core Language Lab","baseTitle":"Complaints and service recovery","focus":"Core Language Lab","level":"B1","track":"Real-Life Tasks","goal":"Explain a service problem politely and request a practical resolution.","rule":"Give factual details first: when, where, what you expected and what occurred. Describe the impact without exaggerating. State an achievable request and offer a timeframe for a response. A calm tone can be firm.","sentence":"I ordered the blue model on 4 May, but l feedback. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":35},{"id":"gold-036-1","tier":"gold","title":"Arranging a Follow-up Call — Core Language Lab","baseTitle":"Arranging a Follow-up Call","focus":"Core Language Lab","level":"B1–B2","track":"Intermediate English","goal":"Make a professional next-step request.","rule":"Make a professional next-step request. Connect the two main ideas clearly.","sentence":"Would you be available to discuss the proposal tomorrow?","scenario":"You are asked to use this language skill in a workplace or everyday British English discussion. Your partner asks a follow-up question and needs a clear, concrete reply. The specific topic is arranging a follow-up call. Show that you can make a professional next-step request while responding to the needs of your audience.","sourceContext":"Practise this skill in a realistic British English conversation.","missionPlace":"in the scenario above","role":"a customer or member of staff","writingPrompt":"Topic: Arranging a Follow-up Call. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to make a professional next-step request. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":1,"estimatedMinutes":0,"applicationTask":"Core Language Lab: Topic: Arranging a Follow-up Call. Identify the language pattern, then use it accurately in a useful everyday or workplace response. Your aim is to make a professional next-step request. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":36},{"id":"gold-037-2","tier":"gold","title":"Change an Appointment Professionally — Real-World Dialogue Lab","baseTitle":"Change an Appointment Professionally","focus":"Real-World Dialogue Lab","level":"B1","track":"Confident Conversations","goal":"Reschedule a booking politely and confirm the new arrangement.","rule":"A complete rescheduling message acknowledges the original booking, explains briefly that you cannot attend, proposes one or two alternatives and asks for confirmation. Use Could we move...?, Would Tuesday suit you? and Thank you for understanding. Avoid giving unnecessary personal details.","sentence":"I'm afraid I can't make our appointment on Thursday. Would Friday morning be possible instead?","scenario":"You have a dental appointment on Thursday but your work schedule has changed. You need to reschedule without sounding careless. The receptionist offers a time that you cannot accept.","sourceContext":"You have a dental appointment on Thursday but your work schedule has changed. You need to reschedule without sounding careless. The receptionist offers a time that you cannot accept.","missionPlace":"in the scenario above","role":"someone who has misunderstood your message","writingPrompt":"Topic: Change an Appointment Professionally. Write both your opening line and the next reply, showing how you would keep the exchange natural. Your aim is to reschedule a booking politely and confirm the new arrangement. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":2,"estimatedMinutes":0,"applicationTask":"Real-World Dialogue Lab: Topic: Change an Appointment Professionally. Write both your opening line and the next reply, showing how you would keep the exchange natural. Your aim is to reschedule a booking politely and confirm the new arrangement. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":37},{"id":"gold-038-2","tier":"gold","title":"Present Perfect or Past Simple? — Real-World Dialogue Lab","baseTitle":"Present Perfect or Past Simple?","focus":"Real-World Dialogue Lab","level":"B1","track":"Confident Conversations","goal":"Distinguish life experience, continuing situations and finished past events.","rule":"Use present perfect when the exact finished time is not important or the period connects to now: I've visited Scotland twice. Use past simple when you name a finished time: I visited Edinburgh in 2023. With yesterday, last week and in 2020, past simple is usually the correct choice.","sentence":"I've tried Thai food, but I first tried it when I visited Bangkok in 2024.","scenario":"A new colleague asks about countries you have visited and the most interesting trip you took. Start with experience and then move to specific events and dates.","sourceContext":"A new colleague asks about countries you have visited and the most interesting trip you took. Start with experience and then move to specific events and dates.","missionPlace":"in the scenario above","role":"a customer or member of staff","writingPrompt":"Topic: Present Perfect or Past Simple?. Write both your opening line and the next reply, showing how you would keep the exchange natural. Your aim is to distinguish life experience, continuing situations and finished past events. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":2,"estimatedMinutes":0,"applicationTask":"Real-World Dialogue Lab: Topic: Present Perfect or Past Simple?. Write both your opening line and the next reply, showing how you would keep the exchange natural. Your aim is to distinguish life experience, continuing situations and finished past events. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":38},{"id":"gold-039-2","tier":"gold","title":"Tell Better Stories with Past Perfect — Real-World Dialogue Lab","baseTitle":"Tell Better Stories with Past Perfect","focus":"Real-World Dialogue Lab","level":"B1","track":"Confident Conversations","goal":"Make the order of two past events clear.","rule":"Past perfect, had plus past participle, can show that one past event occurred before another past event: By the time I arrived, the meeting had started. You do not need past perfect in every sentence. Establish the earlier event once, then continue naturally with past simple.","sentence":"When I reached the platform, the train had already left, so I called my colleague.","scenario":"You arrive at a wedding and discover that the ceremony started early. Explain the chain of events that led to your late arrival and what had happened before you got there.","sourceContext":"You arrive at a wedding and discover that the ceremony started early. Explain the chain of events that led to your late arrival and what had happened before you got there.","missionPlace":"in the scenario above","role":"a receptionist who needs important details","writingPrompt":"Topic: Tell Better Stories with Past Perfect. Write both your opening line and the next reply, showing how you would keep the exchange natural. Your aim is to make the order of two past events clear. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":2,"estimatedMinutes":0,"applicationTask":"Real-World Dialogue Lab: Topic: Tell Better Stories with Past Perfect. Write both your opening line and the next reply, showing how you would keep the exchange natural. Your aim is to make the order of two past events clear. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":39},{"id":"gold-040-2","tier":"gold","title":"First and Second Conditionals — Real-World Dialogue Lab","baseTitle":"First and Second Conditionals","focus":"Real-World Dialogue Lab","level":"B1","track":"Grammar in Action","goal":"Choose between a likely future consequence and an imagined situation.","rule":"The first conditional uses if plus present simple, followed by will or another likely future result: If it rains, we'll stay inside. The second uses if plus past simple, often followed by would, for an imagined or less likely situation: If I had more time, I'd travel. Avoid putting will directly into the ordinary if-clause.","sentence":"If the train is late, I'll call you. If I had a car, I'd drive.","scenario":"You are planning an event on a rainy weekend. Explain what you will do if the weather changes. Then imagine how you would plan it differently with an unlimited budget.","sourceContext":"You are planning an event on a rainy weekend. Explain what you will do if the weather changes. Then imagine how you would plan it differently with an unlimited budget.","missionPlace":"in the scenario above","role":"a classmate who wants the main idea","writingPrompt":"Topic: First and Second Conditionals. Write both your opening line and the next reply, showing how you would keep the exchange natural. Your aim is to choose between a likely future consequence and an imagined situation. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":2,"estimatedMinutes":0,"applicationTask":"Real-World Dialogue Lab: Topic: First and Second Conditionals. Write both your opening line and the next reply, showing how you would keep the exchange natural. Your aim is to choose between a likely future consequence and an imagined situation. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":40},{"id":"gold-041-2","tier":"gold","title":"Modals for Advice and Possibility — Real-World Dialogue Lab","baseTitle":"Modals for Advice and Possibility","focus":"Real-World Dialogue Lab","level":"B1–B2","track":"Grammar in Action","goal":"Explain advice, certainty and uncertainty accurately.","rule":"Use should or ought to for advice, must for a strong obligation or deduction, might or may for possibility, and can't for a deduction that something is impossible. Context determines meaning: You must wear a badge is obligation; She must be tired is deduction. Avoid using mustn't to mean don't need to.","sentence":"You should check the timetable. He might be delayed. She must be exhausted.","scenario":"A new employee is worried about their first week. Give sensible advice, explain what is compulsory and speculate about why a colleague has not arrived.","sourceContext":"A new employee is worried about their first week. Give sensible advice, explain what is compulsory and speculate about why a colleague has not arrived.","missionPlace":"in the scenario above","role":"a teammate making a suggestion","writingPrompt":"Topic: Modals for Advice and Possibility. Write both your opening line and the next reply, showing how you would keep the exchange natural. Your aim is to explain advice, certainty and uncertainty accurately. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":2,"estimatedMinutes":0,"applicationTask":"Real-World Dialogue Lab: Topic: Modals for Advice and Possibility. Write both your opening line and the next reply, showing how you would keep the exchange natural. Your aim is to explain advice, certainty and uncertainty accurately. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":41},{"id":"gold-042-2","tier":"gold","title":"Write Clear and Polite Emails — Real-World Dialogue Lab","baseTitle":"Write Clear and Polite Emails","focus":"Real-World Dialogue Lab","level":"B1","track":"Workplace English","goal":"Organise an email with purpose, action and next steps.","rule":"A useful professional email has a relevant subject, a brief opening, the reason for writing, a clear request and a courteous closing. Short paragraphs help the reader. Use Could you confirm...? for a request, and Please find attached... only if there really is an attachment.","sentence":"Subject: Updated meeting time. Hello Sam, Could we move our meeting to 2 pm? Please let me know if that works. Kind regards, Mina.","scenario":"A supplier has not sent a document you need for tomorrow. You want to follow up professionally, mention the deadline and suggest a quick alternative without sounding hostile.","sourceContext":"A supplier has not sent a document you need for tomorrow. You want to follow up professionally, mention the deadline and suggest a quick alternative without sounding hostile.","missionPlace":"in the scenario above","role":"a teacher explaining a recent change","writingPrompt":"Topic: Write Clear and Polite Emails. Write both your opening line and the next reply, showing how you would keep the exchange natural. Your aim is to organise an email with purpose, action and next steps. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":2,"estimatedMinutes":0,"applicationTask":"Real-World Dialogue Lab: Topic: Write Clear and Polite Emails. Write both your opening line and the next reply, showing how you would keep the exchange natural. Your aim is to organise an email with purpose, action and next steps. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":42},{"id":"gold-043-2","tier":"gold","title":"Small Talk Without Awkwardness — Real-World Dialogue Lab","baseTitle":"Small Talk Without Awkwardness","focus":"Real-World Dialogue Lab","level":"B1","track":"Workplace English","goal":"Start, extend and close light workplace conversations.","rule":"Small talk often begins with a shared situation, such as the journey, weekend or event. Use open follow-up questions and brief personal answers. Respect boundaries: do not assume colleagues want to discuss salary, religion or private matters. Close naturally with Lovely chatting—I'd better get back.","sentence":"How was your weekend? That sounds lovely. Have you been there before?","scenario":"You are attending your first team lunch with people you hardly know. One colleague mentions a concert, while another describes a long commute. Keep the chat moving without interrogating either person.","sourceContext":"You are attending your first team lunch with people you hardly know. One colleague mentions a concert, while another describes a long commute. Keep the chat moving without interrogating either person.","missionPlace":"in the scenario above","role":"a colleague who has a different opinion","writingPrompt":"Topic: Small Talk Without Awkwardness. Write both your opening line and the next reply, showing how you would keep the exchange natural. Your aim is to start, extend and close light workplace conversations. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","variation":2,"estimatedMinutes":0,"applicationTask":"Real-World Dialogue Lab: Topic: Small Talk Without Awkwardness. Write both your opening line and the next reply, showing how you would keep the exchange natural. Your aim is to start, extend and close light workplace conversations. Use the lesson situation to provide at least three connected sentences; do not simply copy the worked example.","lessonOrdinal":43},{"id":"gold-044-2","tier":"gold","title":"Read for Meaning and Inference — Real-World Dialogue Lab","baseTitle":"Read for Meaning and Inference","focus":"Real-World Dialogue Lab","level":"B1–B2","track":"Reading and Writing","goal":"Identify main ideas, implied meanings and evidence rather than guessing.","rule":"A text can state information directly or imply it through tone and context. First locate the writer's main claim. Next find the sentence that supports an inference. A plausible answer without textual support is still a guess. Distinguish fact from opinion and notice contrast markers such as however and despite.","sentence":"The café was full despite the rain. This suggests it was popular enough to attract customers in poor weather.","scenario":

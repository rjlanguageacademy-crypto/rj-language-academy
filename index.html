<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RJ Language Academy</title><style>body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.msg{padding:24px;text-align:center}</style></head><body><div class="msg">Loading RJ Language Academy…</div><script>(async()=>{try{const files=Array.from({length:14},(_,i)=>'/v43/part-'+String(i+1).padStart(2,'0')+'.txt');const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));document.open();document.write(parts.join('\n'));document.close();}catch(e){document.body.innerHTML='<div class="msg"><h1>RJ Language Academy</h1><p>Preview failed to load.</p><pre>'+String(e)+'</pre></div>'}})();</script></body></html>

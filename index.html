<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RJ Language Academy V16 — Roy AI Voice</title><style>:root{
  --ink:#101820;
  --navy:#102236;
  --navy-2:#1a3147;
  --orange:#f58220;
  --orange-deep:#d96500;
  --orange-soft:#fff4e9;
  --paper:#ffffff;
  --wash:#f7f7f5;
  --muted:#64707a;
  --line:#e5e7e8;
  --green:#18784f;
  --red:#b64242;
  --shadow:0 16px 44px rgba(16,34,54,.08);
  --radius:12px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.62;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer}
.wrap{width:min(1180px,calc(100% - 48px));margin:0 auto}

/* Header */
.site-header{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.985);border-top:4px solid var(--orange);border-bottom:1px solid var(--line);box-shadow:0 5px 22px rgba(16,24,32,.035)}
.nav{min-height:86px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:28px}
.brand-wordmark{text-decoration:none;display:flex;flex-direction:column;justify-content:center;line-height:1}
.brand-wordmark strong{font-family:Georgia,"Times New Roman",serif;font-size:1.15rem;letter-spacing:.015em;color:var(--navy)}
.brand-wordmark small{margin-top:7px;font-size:.64rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:800}
.nav-links{display:flex;align-items:center;justify-content:center;gap:24px}
.nav-item{position:relative}
.nav-link{appearance:none;border:0;background:transparent;padding:31px 0 26px;text-decoration:none;font-size:.77rem;line-height:1;text-transform:uppercase;letter-spacing:.11em;font-weight:900;color:#26333d;position:relative;white-space:nowrap}
.nav-link:after{content:"";position:absolute;left:0;right:0;bottom:20px;height:2px;background:var(--orange);transform:scaleX(0);transform-origin:left;transition:.18s ease}
.nav-link:hover,.nav-link.active{color:var(--navy)}
.nav-link:hover:after,.nav-link.active:after{transform:scaleX(1)}
.dropdown{display:none;position:absolute;top:calc(100% - 10px);left:-18px;min-width:230px;padding:8px;background:#fff;border:1px solid var(--line);border-top:3px solid var(--orange);border-radius:4px;box-shadow:var(--shadow)}
.nav-item:hover .dropdown{display:grid}
.dropdown a{padding:11px 12px;text-decoration:none;font-weight:750;font-size:.88rem;color:#34414a;border-bottom:1px solid #f0f1f2}
.dropdown a:last-child{border-bottom:0}
.dropdown a:hover{color:var(--orange-deep);background:#fffaf5}
.nav-actions{display:flex;align-items:center;gap:12px}
.header-logo img{width:58px;height:58px;object-fit:cover;border-radius:10px;border:1px solid #d8dde0}
.nav-book{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:var(--orange);color:#151515;padding:12px 15px;border-radius:5px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:950;transition:.18s ease}
.nav-book:hover{background:#ff952f;transform:translateY(-1px)}
.mobile-menu{display:none;border:1px solid #cad0d4;background:#fff;border-radius:5px;padding:10px 13px;font-weight:900;text-transform:uppercase;font-size:.72rem;letter-spacing:.08em}

/* Buttons */
.btn{border:0;border-radius:5px;padding:12px 18px;font-weight:900;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.18s ease;font-size:.86rem;letter-spacing:.025em}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--orange);color:#17120d;box-shadow:none}
.btn-primary:hover{background:#ff942f}
.btn-dark{background:var(--navy);color:white}
.btn-light{background:white;border:1px solid #cfd4d8;color:var(--ink)}
.btn-light:hover{border-color:var(--orange);color:var(--orange-deep)}
.btn-soft{background:var(--orange-soft);color:#994600}

/* Type */
.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:.72rem;font-weight:950;color:var(--orange-deep);margin-bottom:13px}
h1,h2,h3{margin:0;color:var(--navy);line-height:1.08}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:700}
h1{font-size:clamp(3rem,6.7vw,6.25rem);letter-spacing:-.045em}
h2{font-size:clamp(2.05rem,4vw,3.45rem);letter-spacing:-.035em}
h3{font-size:1.2rem;letter-spacing:-.01em}
.orange{color:var(--orange)}
.lead{font-size:clamp(1.05rem,1.7vw,1.22rem);color:#4e5b65;max-width:720px;margin:20px 0}

/* Homepage */
.hero{padding:76px 0 68px;background:#fff;border-bottom:1px solid var(--line)}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:62px;align-items:center}
.hero h1:after,.page-hero h1:after{content:"";display:block;width:92px;height:5px;background:var(--orange);margin-top:22px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.proof-row{display:flex;gap:22px;flex-wrap:wrap;margin-top:26px;font-weight:760;font-size:.86rem;color:#56636d}
.proof-row span:before{content:'✓';color:var(--orange);font-weight:950;margin-right:7px}
.hero-card{background:#fff;color:var(--ink);border:1px solid #dfe3e5;border-top:7px solid var(--orange);border-radius:8px;padding:34px;box-shadow:var(--shadow);min-height:420px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.hero-card:after{content:'RJ';position:absolute;right:-6px;top:8px;font-family:Georgia,"Times New Roman",serif;font-size:9rem;font-weight:700;color:#f1f2f2;z-index:0}
.hero-card h3{color:var(--navy);font-family:Georgia,"Times New Roman",serif;font-size:1.85rem;max-width:430px;position:relative;z-index:1}
.hero-card p{color:#5c6871;position:relative;z-index:1}
.mini-feature{background:var(--wash);border-left:4px solid var(--orange);border-radius:4px;padding:17px 18px;position:relative;z-index:1}
.mini-feature strong{display:block;color:var(--navy);margin-bottom:5px}

/* Sections + cards */
.section{padding:76px 0}
.section.alt{background:var(--wash);border-top:1px solid #f0f1f1;border-bottom:1px solid #f0f1f1}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;margin-bottom:32px}
.section-copy{color:var(--muted);max-width:700px;margin:11px 0 0}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:white;border:1px solid #dde1e3;border-radius:var(--radius);padding:25px;box-shadow:none;position:relative}
.card:before{content:"";position:absolute;left:0;top:0;width:0;height:3px;background:var(--orange);transition:.2s ease}
.card.clean{box-shadow:none}
.card.interactive{transition:.18s ease;text-decoration:none}
.card.interactive:hover{transform:translateY(-3px);border-color:#efaa72;box-shadow:0 14px 30px rgba(16,24,32,.07)}
.card.interactive:hover:before{width:100%}
.icon{min-width:50px;width:max-content;height:34px;padding:0 10px;border-radius:4px;background:var(--orange);color:#17120d;display:grid;place-items:center;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:950;margin-bottom:18px}
.card p{color:var(--muted);margin:11px 0}
.mini-link{font-weight:900;color:var(--orange-deep);font-size:.88rem;text-decoration:none}
.price{font-size:2.2rem;font-weight:950;color:var(--navy);letter-spacing:-.04em;margin:14px 0}.price small{font-size:.82rem;color:var(--muted);font-weight:750}
.list{list-style:none;margin:16px 0;padding:0}.list li{padding:5px 0;color:#4f5b63}.list li:before{content:'✓';color:var(--orange);font-weight:950;margin-right:8px}

.about-preview{display:grid;grid-template-columns:.72fr 1.28fr;gap:42px;align-items:center}
.photo-placeholder{aspect-ratio:4/5;border-radius:8px;border:1px solid #cfd5d8;background:linear-gradient(145deg,#f5f5f3,#e9ebeb);display:grid;place-items:center;text-align:center;color:#65727c;font-weight:850;padding:20px;position:relative}
.photo-placeholder:after{content:"";position:absolute;left:18px;right:18px;bottom:18px;height:5px;background:var(--orange)}
.qual-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px}.qual{border:1px solid var(--line);border-radius:6px;padding:14px 15px;background:white}.qual span{color:var(--muted);font-size:.9rem}
.cta{background:var(--navy);border-radius:8px;color:white;padding:38px;display:flex;align-items:center;justify-content:space-between;gap:28px;border-bottom:6px solid var(--orange)}.cta h2{color:white}.cta p{color:#d5dfe6;max-width:650px}

/* Inner pages */
.page-hero{padding:62px 0 46px;background:#fff;border-bottom:1px solid var(--line)}
.page-hero h1{font-size:clamp(2.7rem,5vw,4.9rem)}
.breadcrumbs{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:#7a858d;margin-bottom:15px;font-weight:780}
.content-grid{display:grid;grid-template-columns:.78fr 1.22fr;gap:28px;align-items:start}
.sidebar-card{position:sticky;top:112px}
.topic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.topic-card{border:1px solid var(--line);border-radius:8px;padding:20px;background:white}.topic-card span{font-size:.75rem;font-weight:950;color:var(--orange-deep);text-transform:uppercase;letter-spacing:.1em}.topic-card p{color:var(--muted);margin:8px 0 0}
.pill-row{display:flex;flex-wrap:wrap;gap:8px}.pill{background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px 11px;font-weight:800;font-size:.84rem}
.notice{border-left:4px solid var(--orange);background:#fff7ef;padding:14px 16px;border-radius:4px;color:#65401f}
.level-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.level-badge{display:grid;place-items:center;width:58px;height:44px;border-radius:4px;background:var(--navy);color:white;font-weight:950;font-size:1rem;margin-bottom:16px}.level-card:nth-child(even) .level-badge{background:var(--orange);color:#251509}

/* Shop */
.shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.product-card{padding:0;overflow:hidden}.product-cover{height:188px;background:linear-gradient(145deg,var(--navy),#18344d);color:white;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;position:relative}.product-cover:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--orange)}.product-cover small{color:#ffbd82;font-weight:900}.product-body{padding:22px}.product-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}.product-price{font-size:1.4rem;font-weight:950}

/* Quiz */
.quiz-layout{display:grid;grid-template-columns:280px 1fr;gap:22px}.quiz-side{border:1px solid var(--line);border-radius:8px;padding:20px;background:white;height:max-content;position:sticky;top:112px}.quiz-side select{color:var(--ink)!important;background:#fff!important}.quiz-main{border:1px solid var(--line);border-radius:8px;padding:30px;background:white;min-height:430px}.progress{height:7px;border-radius:0;background:#eef1f3;overflow:hidden}.progress>div{height:100%;width:0;background:var(--orange);transition:.2s}.answers{display:grid;gap:10px;margin-top:22px}.answer{border:1px solid #d6dbde;background:#fff;color:var(--ink)!important;border-radius:5px;padding:15px 16px;text-align:left;font-weight:800;line-height:1.4;box-shadow:none}.answer:hover{border-color:var(--orange);background:#fff8f1;color:var(--ink)!important}.answer:disabled{opacity:1;color:var(--ink)!important}.answer.correct{background:#eaf8f1;border-color:#64bb92;color:#135f40!important}.answer.wrong{background:#fff0f0;border-color:#d98282;color:#8c2f2f!important}.feedback{display:none;margin-top:17px;border-radius:4px;background:#f5f7f8;color:var(--ink);padding:14px 16px;border-left:4px solid var(--orange)}.feedback.show{display:block}

/* Cue cards */
.cue-layout{display:grid;grid-template-columns:1fr .7fr;gap:24px}.cue-paper{background:#fffdfa;border:1px solid #ded8cf;border-radius:6px;padding:30px;min-height:330px;box-shadow:0 10px 24px rgba(58,47,33,.04);position:relative}.cue-paper:before{content:"";position:absolute;left:22px;right:22px;top:0;height:4px;background:var(--orange)}.cue-paper h3{margin-top:8px}.cue-paper li{margin:10px 0}.timer-card{background:var(--navy);color:white;border-radius:7px;padding:27px;border-bottom:5px solid var(--orange)}.timer-display{font-size:4rem;font-weight:950;letter-spacing:-.05em}.timer-card p{color:#ced8de}.timer-actions{display:flex;gap:8px;flex-wrap:wrap}

/* AI teacher */
.ai-layout{display:grid;grid-template-columns:.78fr 1.22fr;gap:24px}.avatar-stage{background:linear-gradient(145deg,#17374f,var(--navy));border-radius:8px;min-height:530px;padding:28px;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;border-bottom:6px solid var(--orange)}.avatar{width:210px;height:275px;display:flex;flex-direction:column;align-items:center}.head{width:140px;height:158px;background:#f1c59d;border-radius:48% 48% 44% 44%;position:relative}.hair{position:absolute;left:11px;right:11px;top:3px;height:58px;border-radius:55% 55% 28% 30%;background:#bdc2c6}.eye{position:absolute;top:82px;width:10px;height:7px;background:#2d2b29;border-radius:50%;animation:blink 5s infinite}.eye.left{left:37px}.eye.right{right:37px}.mouth{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);width:37px;height:9px;background:#9d5d50;border-radius:0 0 22px 22px}.avatar.speaking .mouth{animation:talk .28s infinite alternate}.neck{width:50px;height:32px;background:#e8b88e;margin-top:-5px}.body{width:205px;height:140px;background:#fff;border-radius:52px 52px 18px 18px;position:relative}.body:before{content:'RJ';position:absolute;left:50%;top:34px;transform:translateX(-50%);font-family:Georgia,serif;font-size:36px;color:var(--navy);font-weight:850}.tie{position:absolute;left:50%;top:0;transform:translateX(-50%);width:17px;height:65px;background:var(--orange);clip-path:polygon(50% 0,100% 20%,72% 100%,28% 100%,0 20%)}
@keyframes blink{0%,45%,48%,100%{transform:scaleY(1)}46%,47%{transform:scaleY(.12)}}@keyframes talk{from{height:8px;width:34px}to{height:18px;width:28px}}
.chat-panel{border:1px solid var(--line);border-radius:8px;background:white;padding:20px;min-height:530px;display:flex;flex-direction:column}.chat-log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:6px 3px 15px}.bubble{max-width:82%;padding:12px 14px;border-radius:6px}.bubble.bot{background:#f1f4f6;align-self:flex-start}.bubble.user{background:var(--orange-soft);align-self:flex-end}.chat-tools{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.chat-tools button{border:1px solid var(--line);background:white;color:var(--ink);border-radius:4px;padding:8px 10px;font-weight:850;font-size:.81rem}.chat-tools button.active{background:var(--navy);color:white}.chat-compose{display:grid;grid-template-columns:auto 1fr auto;gap:8px}.chat-compose input{border:1px solid var(--line);border-radius:5px;padding:12px;color:var(--ink)}.round-btn{width:44px;height:44px;border-radius:5px;border:0;background:var(--orange-soft);color:var(--ink)}.round-btn.send{background:var(--orange)}

.flashcard{min-height:240px;border:1px solid var(--line);border-radius:8px;background:white;padding:30px;display:grid;place-items:center;text-align:center;cursor:pointer;box-shadow:none}.flashcard .back{display:none;color:var(--muted)}.flashcard.flipped .front{display:none}.flashcard.flipped .back{display:block}
.pronounce-row{display:flex;gap:10px;flex-wrap:wrap}.sound-chip{border:1px solid var(--line);background:white;color:var(--ink);border-radius:5px;padding:12px 14px;font-weight:850}.sound-chip:hover{background:var(--orange-soft);border-color:var(--orange)}
.booking-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.booking-card{position:relative}.booking-card.featured{border:2px solid var(--orange)}
.member-panel{max-width:760px;margin:0 auto;text-align:center;border:1px solid var(--line);border-radius:8px;padding:48px;background:white;box-shadow:var(--shadow);border-top:6px solid var(--orange)}

/* Reading and writing assessment */
.rw-layout{display:grid;grid-template-columns:285px 1fr;gap:24px;align-items:start}
.rw-side{position:sticky;top:112px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:22px}
.rw-side h3{font-size:1.3rem}
.rw-meter{height:9px;background:#e9edef;border-radius:99px;overflow:hidden;margin:16px 0 10px}.rw-meter>div{height:100%;width:0;background:linear-gradient(90deg,var(--orange),#ffad61);transition:.25s ease}
.rw-step-list{display:grid;gap:8px;margin-top:20px}.rw-step-item{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.88rem;font-weight:760}.rw-step-item span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid #d7dcdf;background:#fff;color:var(--navy);font-size:.76rem}.rw-step-item.active{color:var(--navy)}.rw-step-item.active span{background:var(--navy);border-color:var(--navy);color:#fff}.rw-step-item.done span{background:#e8f7ef;border-color:#78bf9b;color:#14603f}
.rw-main{border:1px solid var(--line);border-radius:10px;background:#fff;padding:32px;min-height:520px;box-shadow:0 14px 34px rgba(16,34,54,.055)}
.rw-passage{background:#f6f8f9;border-left:4px solid var(--orange);padding:20px 22px;border-radius:5px;margin:20px 0;font-size:1.04rem;line-height:1.75;color:#34434e}
.rw-options{display:grid;gap:10px;margin-top:22px}.rw-option{border:1px solid #d5dade;border-radius:6px;background:#fff;text-align:left;padding:14px 16px;font-weight:800}.rw-option:hover{border-color:var(--orange);background:#fff9f3}.rw-option.correct{background:#eaf8f1;border-color:#68b98f;color:#135f40}.rw-option.wrong{background:#fff0f0;border-color:#d98282;color:#8c2f2f}
.rw-writing{width:100%;min-height:210px;border:1px solid #cfd5d9;border-radius:7px;padding:16px;resize:vertical;line-height:1.65;background:#fff}.rw-writing:focus{outline:3px solid rgba(245,130,32,.15);border-color:var(--orange)}
.rw-writing-meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.84rem;margin-top:7px}.rw-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:24px}
.rw-result{border:1px solid var(--line);border-top:6px solid var(--orange);background:#fff;color:var(--ink);border-radius:10px;padding:30px;box-shadow:var(--shadow)}.rw-result h2{color:var(--navy)}.rw-score{font-size:3.6rem;font-weight:950;letter-spacing:-.06em;color:var(--orange-deep);margin:12px 0}.rw-result p{color:var(--muted)}.rw-advice{display:grid;gap:9px;margin:20px 0}.rw-advice div{background:var(--wash);border-left:3px solid var(--orange);border-radius:4px;padding:12px 14px;color:var(--ink)}
.rw-saved{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:.86rem;color:var(--muted)}
@media(max-width:900px){.rw-layout{grid-template-columns:1fr}.rw-side{position:static}.rw-step-list{grid-template-columns:repeat(5,1fr)}.rw-step-item{justify-content:center}.rw-step-item strong{display:none}}
@media(max-width:640px){.hero{background:#fff}.rw-main{padding:22px}.rw-step-list{gap:4px}.rw-writing-meta{flex-direction:column}.rw-actions .btn{width:100%}}

/* Footer */
.footer{background:#0d1d2a;color:#d2dde4;padding:46px 0 25px;border-top:6px solid var(--orange)}.footer a{color:#d2dde4;text-decoration:none}.footer a:hover{color:#fff}.footer-grid{display:grid;grid-template-columns:1.3fr repeat(3,1fr);gap:30px}.footer-title{color:white;font-family:Georgia,"Times New Roman",serif;font-weight:700;margin-bottom:10px;font-size:1.04rem}.footer-bottom{margin-top:28px;padding-top:17px;border-top:1px solid rgba(255,255,255,.12);color:#95a5b1;font-size:.82rem}

@media(max-width:1050px){
  .nav{grid-template-columns:auto auto 1fr}.brand-wordmark{grid-column:1}.mobile-menu{display:block;grid-column:2}.nav-links{display:none;position:absolute;left:0;right:0;top:86px;background:#fff;border-bottom:1px solid var(--line);padding:12px 24px 20px;flex-direction:column;align-items:stretch;gap:0}.nav-links.open{display:flex}.nav-link{display:block;padding:14px 0}.nav-link:after{bottom:8px}.nav-item:hover .dropdown{display:none}.nav-item.open .dropdown{display:grid;position:static;box-shadow:none;margin-top:0}.nav-actions{grid-column:3;justify-self:end}.nav-book{display:none}.hero-grid,.about-preview,.content-grid,.ai-layout,.cue-layout{grid-template-columns:1fr}.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3,.topic-grid,.shop-grid,.booking-grid,.level-grid{grid-template-columns:repeat(2,1fr)}.quiz-layout{grid-template-columns:1fr}.quiz-side,.sidebar-card{position:static}.footer-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:640px){

}

    m.innerHTML=`<div class="modal-card" style="max-width:720px"><div class="modal-head"><div><div class="eyebrow">Secure checkout</div><h3>Complete your purchase</h3></div><button class="modal-close" type="button">×</button></div><div class="modal-body"><div class="payment-summary"><div class="payment-row"><span>Item</span><strong id="payProduct"></strong></div><div class="payment-row"><span>Price</span><strong id="payPrice"></strong></div></div><div class="form-grid"><label class="form-field">Name<input id="payName" placeholder="Your name"></label><label class="form-field">Email<input id="payEmail" type="email" placeholder="you@example.com"></label></div><button class="btn btn-primary" id="payContinue" style="width:100%;margin-top:16px">Prepare secure checkout</button><div id="payMessage" class="feedback"></div><div id="stripeLaunchArea"></div><p class="secure-note">Stripe handles the card page. RJ Language Academy does not store card numbers.</p></div></div>`;
    document.body.appendChild(m);
    m.querySelector('.modal-close').onclick=()=>m.classList.remove('open');
    m.onclick=e=>{if(e.target===m)m.classList.remove('open')};
  }
  m.querySelector('#payProduct').textContent=product;
  m.querySelector('#payPrice').textContent=`£${Number(price).toFixed(2)}${cycle==='monthly'?' / month':''}`;
  m.dataset.product=product;m.dataset.price=price;m.dataset.cycle=cycle;m.dataset.stripeKey=stripeKey||'';
  m.querySelector('#stripeLaunchArea').innerHTML='';
  m.querySelector('#payMessage').className='feedback';m.querySelector('#payMessage').textContent='';
  m.classList.add('open');
  m.querySelector('#payContinue').onclick=()=>{
    const n=m.querySelector('#payName').value.trim(),em=m.querySelector('#payEmail').value.trim(),msg=m.querySelector('#payMessage');
    if(!n||!em){msg.textContent='Add your name and email first.';msg.className='feedback show error';return}
    localStorage.setItem('rjCheckoutCustomer',JSON.stringify({name:n,email:em,product,price,cycle,stripeKey}));
    if(liveUrl){
      msg.textContent='Your Stripe test checkout is ready. Open it below.';msg.className='feedback show success';
      m.querySelector('#stripeLaunchArea').innerHTML=`<a class="btn btn-dark stripe-launch" href="${liveUrl}" target="_blank" rel="noopener noreferrer">Open secure Stripe checkout ↗</a>`;
      return;
    }
    msg.textContent='This product still needs its live Stripe checkout link.';msg.className='feedback show error';
  };
}
function bindPaymentButtons(root=document){
  root.querySelectorAll('.rj-payment').forEach(b=>{
    if(b.dataset.bound)return;b.dataset.bound='1';
    b.addEventListener('click',e=>{e.preventDefault();openPayment(b.dataset.product||'RJ purchase',b.dataset.price||'0',b.dataset.cycle||'one-off',b.dataset.stripeKey||'')});
  });
}
const RJ_PRONUNCIATION_AUDIO_TEXT={comfortable:'KUMF-tuh-buhl',vegetable:'VEJ-tuh-buhl',probably:'PROB-uh-blee',interesting:'IN-truh-sting',different:'DIF-runt'};
function speakBritishModel(text,voiceName,avatar){const key=String(text).toLowerCase().trim();speakBritish(RJ_PRONUNCIATION_AUDIO_TEXT[key]||text,voiceName,avatar)}

function bindRJControls(root=document){
  bindPaymentButtons(root);
  root.querySelectorAll('[data-upgrade]').forEach(b=>{
    if(b.dataset.upgradeBound)return;b.dataset.upgradeBound='1';
    b.addEventListener('click',e=>{e.preventDefault();openUpgrade();});
  });
  initCertificateModal();
  loadBritishVoices();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>bindRJControls()); else bindRJControls();
document.addEventListener('click',e=>{
  const up=e.target.closest('[data-upgrade]');
  if(up && !up.dataset.upgradeBound){e.preventDefault();openUpgrade();}
  const pay=e.target.closest('.rj-payment');
  if(pay && !pay.dataset.bound){e.preventDefault();openPayment(pay.dataset.product||'RJ purchase',pay.dataset.price||'0',pay.dataset.cycle||'one-off',pay.dataset.stripeKey||'');}
});

\">0</strong><a href=\"cue-cards.html\">Cue cards \u2192</a></div><div class=\"dashboard-card\"><span>Last lesson</span><strong id=\"memberLesson\">None yet</strong><a href=\"lessons.html\">Choose a level \u2192</a></div><div class=\"dashboard-card\"><span>Membership</span><strong>Free</strong><a data-upgrade=\"\" href=\"#plans\">Upgrade \u2192</a></div></div></div></section>", "about.html": "\n<section class=\"page-hero\"><div class=\"wrap\"><div class=\"breadcrumbs\">Home / About Roy</div><div class=\"eyebrow\">About your tutor</div><h1>Practical English with <span class=\"orange\">Roy.</span></h1><p class=\"lead\">British English teaching built around real conversation, clearer pronunciation, stronger grammar, useful vocabulary and focused exam preparation.</p></div></section>\n<section class=\"section\"><div class=\"wrap about-preview\"><div><img alt=\"Roy, British English tutor at RJ Language Academy\" class=\"tutor-photo\" src=\"RJasset-02474e953f.webp\"/></div><div><div class=\"eyebrow\">Your tutor</div><h2>British English teaching without the fuss.</h2><p class=\"lead\" style=\"font-size:1.08rem\">I\u2019m Roy, a British English tutor from Bedford, England. I really enjoy helping learners become more confident with the English they use in real life \u2014 not just English they recognise in a textbook. My aim is to make lessons clear, relaxed and useful, so you leave each session feeling that you can actually use what you have learned.</p><p>Whether you want to speak more naturally, improve your British pronunciation, strengthen your grammar, build better vocabulary or prepare for IELTS or TOEIC, I\u2019ll work with you step by step around your own goals. What matters to me is progress you can notice: longer answers, clearer speech, fewer repeated mistakes and more confidence using English outside the lesson.</p><div class=\"about-capabilities\">\n<div class=\"capability-tile\"><strong>English Conversation</strong><span>Fluency, confidence, natural answers and real-life speaking.</span></div>\n<div class=\"capability-tile\"><strong>Grammar</strong><span>Clear explanations, sentence building and practical accuracy.</span></div>\n<div class=\"capability-tile\"><strong>British Pronunciation</strong><span>Sounds, stress, rhythm, intonation and connected speech.</span></div>\n<div class=\"capability-tile\"><strong>Vocabulary</strong><span>Everyday language, collocations, phrasal verbs and advanced word choice.</span></div>\n<div class=\"capability-tile\"><strong>IELTS Speaking</strong><span>Parts 1\u20133, cue cards, answer development and speaking feedback.</span></div>\n<div class=\"capability-tile\"><strong>IELTS Writing</strong><span>Assessment-criteria knowledge, structure, language and task support.</span></div>\n<div class=\"capability-tile\"><strong>TOEIC Preparation</strong><span>Exam strategies, useful language and focused practice.</span></div>\n<div class=\"capability-tile\"><strong>A1\u2013C2 English</strong><span>Lessons adjusted to level, goals, confidence and pace.</span></div>\n</div><div class=\"hero-actions\"><a class=\"btn btn-primary\" href=\"book.html\">Book a lesson</a><a class=\"btn btn-light\" href=\"group-lessons.html\">Group lessons</a></div></div></div></section>\n<section class=\"section alt\"><div class=\"wrap\"><div class=\"section-head\"><div><div class=\"eyebrow\">What I can help with</div><h2>More than exam preparation.</h2><p class=\"section-copy\">RJ Language Academy covers the full range of practical English skills, with lessons shaped around what each learner actually needs.</p></div></div><div class=\"teaching-scope\">\n<article class=\"scope-card\"><h3>Speaking &amp; real-life English</h3><ul class=\"scope-list\"><li>General English conversation</li><li>Fluency and confidence</li><li>Answer development</li><li>Everyday British English</li><li>Real-life role-plays</li><li>Travel English</li><li>Workplace English</li><li>Speaking problem-solving</li><li>Idioms and natural expressions</li const RJ_PREVIEW_SCRIPTS={"index.html":"","ai-teacher.html":"\nconst MODEL_ID = 'Qwen2.5-0.5B-Instruct-q4f16_1-MLC';\nconst FREE_LIMIT = 5;\n\nlet engine = null;\nlet modelReady = false;\nlet previewMode = true;\nlet modelLoading = false;\nlet mode = 'conversation';\nlet isListening = false;\nlet conversation = [];\n\nconst log = document.getElementById('chatLog');\nconst input = document.getElementById('chatInput');\nconst avatar = document.getElementById('avatar');\nconst statusEl = document.getElementById('aiStatus');\nconst badge = document.getElementById('avatarBadge');\nconst turnEl = document.getElementById('aiTurns');\nconst micBtn = document.getElementById('micBtn');\nconst micStatus = document.getElementById('micStatus');\nconst sendBtn = document.getElementById('sendBtn');\nconst loadBtn = document.getElementById('loadAiBtn');\nconst progressWrap = document.getElementById('aiProgressWrap');\nconst progressBar = document.getElementById('aiProgressBar');\nconst progressText = document.getElementById('aiProgressText');\n\nfunction getUsedTurns(){\n  const n = Number(localStorage.getItem('rjAiFreeTurnsUsed') || '0');\n  return Number.isFinite(n) ? Math.max(0, Math.min(FREE_LIMIT, n)) : 0;\n}\nfunction setUsedTurns(n){\n  localStorage.setItem('rjAiFreeTurnsUsed', String(Math.max(0, Math.min(FREE_LIMIT, n))));\n  updateTurns();\n}\nfunction turnsLeft(){ return Math.max(0, FREE_LIMIT - getUsedTurns()); }\nfunction updateTurns(){\n  const left = turnsLeft();\n  turnEl.textContent = `${left} turn${left===1?'':'s'} left`;\n}\nupdateTurns();\n\nfunction setState(state, text){\n  avatar.classList.remove('listening','thinking','speaking','ready','loading');\n  avatar.classList.add(state);\n  statusEl.textContent = text;\n  badge.textContent = ({\n    loading:'Loading local AI',\n    listening:'Listening',\n    thinking:'Thinking',\n    speaking:'Speaking',\n    ready:'AI ready'\n  })[state] || 'Local AI Teacher';\n}\nfunction addBubble(text, who='bot'){\n  const d = document.createElement('div');\n  d.className = `bubble ${who}`;\n  d.textContent = text;\n  log.appendChild(d);\n  log.scrollTop = log.scrollHeight;\n  return d;\n}\nfunction addSystemBubble(text){\n  const d = document.createElement('div');\n  d.className = 'bubble system';\n  d.textContent = text;\n  log.appendChild(d);\n  log.scrollTop = log.scrollHeight;\n}\nfunction enableChat(on){\n  input.disabled = !on;\n  sendBtn.disabled = !on;\n  micBtn.disabled = !on;\n  input.placeholder = 'Type your English question…';\n}\nfunction modeInstruction(){\n  const common = `You are the RJ AI English Teacher for RJ Language Academy. You are a friendly, concise British English tutor. Use British spelling and natural British English. The learner may be A1-C2. Adapt the difficulty to their message. Be encouraging but do not overpraise. Correct important mistakes clearly. Keep most replies under 130 words unless the learner asks for detail. Never claim to be human.`;\n  const specific = {\n    conversation: `Focus on natural conversation. Reply naturally, then if useful correct one or two important mistakes and ask one short follow-up question.`,\n    grammar: `Focus on grammar. Explain the rule simply, show a correct example, then give the learner one short practice task.`,\n    vocabulary: `Focus on useful vocabulary, collocations, synonyms and natural usage. Include meaning and one clear example, then ask the learner to use the word.`,\n    ielts: `Act as an IELTS speaking coach. Use IELTS-style questions, help the learner extend answers, improve vocabulary and grammar, but do not invent official scores. When giving feedback, refer to fluency/coherence, lexical resource, grammar and pronunciation in plain language.`,\n    pronunciation: `Focus on British English pronunciation. Use IPA only when helpful. Explain stress, syllables and mouth/sound contrasts in simple language. If browser speech is used, remind the learner it is a voice model rather than a phonetics recording when relevant.`\n  };\n  return common + ' ' + specific[mode];\n}\nfunction resetConversationForMode(){\n  conversation = [{role:'system', content: modeInstruction()}];\n}\nresetConversationForMode();\n\ndocument.querySelectorAll('.chat-tools button').forEach(b=>{\n  b.addEventListener('click',()=>{\n    document.querySelectorAll('.chat-tools button').forEach(x=>x.classList.remove('active'));\n    b.classList.add('active');\n    mode = b.dataset.mode;\n    resetConversationForMode();\n    addSystemBubble(`${b.textContent} mode selected.`);\n  });\n});\n\nasync function loadAI(){\n  if(modelReady || modelLoading) return;\n\n  if(!('gpu' in navigator)){\n    setState('ready','This browser does not support WebGPU');\n    addBubble('This browser cannot run the full local AI model, but preview chat and typing still work. Try the latest Chrome or Edge on a modern device for the full local AI.');\n    enableChat(true);\n    return;\n  }\n\n  modelLoading = true;\n  loadBtn.disabled = true;\n  loadBtn.textContent = 'Loading AI…';\n  progressWrap.hidden = false;\n  setState('loading','Preparing the AI model…');\n  addSystemBubble('First-time setup started. The browser is downloading the AI model automatically.');\n\n  try{\n    const webllm = await import('https://esm.run/@mlc-ai/web-llm');\n\n    engine = await webllm.CreateMLCEngine(\n      MODEL_ID,\n      {\n        initProgressCallback: report => {\n          const p = typeof report.progress === 'number' ? report.progress : 0;\n          progressBar.style.width = `${Math.max(3, Math.round(p*100))}%`;\n          progressText.textContent = report.text || `Loading AI… ${Math.round(p*100)}%`;\n        },\n        logLevel: 'WARN'\n      },\n      { context_window_size: 2048 }\n    );\n\n    modelReady = true;\n    modelLoading = false;\n    progressBar.style.width = '100%';\n    progressText.textContent = 'AI Teacher ready';\n    loadBtn.textContent = 'AI Teacher Loaded';\n    enableChat(true);\n    setState('ready','Ready to practise');\n    micStatus.textContent = 'Tap the microphone and speak, or type your question.';\n    addBubble('I’m ready. What would you like to practise today?');\n    input.focus();\n  }catch(err){\n    modelLoading = false;\n    loadBtn.disabled = false;\n    loadBtn.textContent = 'Try loading again';\n    setState('ready','AI could not load on this device');\n    progressText.textContent = 'Could not load the local AI model.';\n    addBubble('The local AI could not start on this device. This can happen if WebGPU is unavailable, graphics memory is too low, or the page is not running in a compatible browser.');\n    console.error(err);\n  }\n}\nloadBtn.addEventListener('click', loadAI);\n\nfunction previewReply(q){\n  const clean=q.trim();\n  const lower=clean.toLowerCase();\n  const replies={\n    conversation:`Good — let’s practise naturally. You wrote: “${clean}” What would you like to say next? I’ll help you make it sound more natural in British English.`,\n    grammar:`Let’s look at the grammar in: “${clean}” In preview mode I can guide you, and the full local AI gives a more detailed correction once loaded. Try writing the sentence again with the tense you want to practise.`,\n    vocabulary:`Let’s build vocabulary from your message. Choose one important word from “${clean}” and try giving me a synonym or a sentence using it.`,\n    ielts:`IELTS practice: give me a longer answer to that idea — aim for 3–5 sentences with a reason and an example. The full local AI can then give more detailed speaking-style feedback.`,\n    pronunciation:`Pronunciation practice: type one word or a short phrase you want to practise. I’ll focus on British English stress and clarity. Use the voice button where available to hear modelled speech.`\n  };\n  return replies[mode]||replies.conversation;\n}\nasync function send(){\n  const q = input.value.trim();\n  if(!q) return;\n\n  if(turnsLeft() <= 0){\n    openUpgrade(\n      'Your 5 free AI turns are finished',\n      'Premium membership will unlock a larger AI practice allowance.'\n    );\n    return;\n  }\n\n  addBubble(q,'user');\n  input.value = '';\n  setUsedTurns(getUsedTurns()+1);\n\n  conversation.push({role:'user',content:q});\n  if(conversation.length > 11){\n    conversation = [conversation[0], ...conversation.slice(-10)];\n  }\n\n  setState('thinking','Thinking…');\n  input.disabled = true;\n  sendBtn.disabled = true;\n  micBtn.disabled = true;\n\n  try{\n    if(!modelReady){\n      const answer=previewReply(q);\n      conversation.push({role:'assistant',content:answer});\n      addBubble(answer,'bot');\n      setState('speaking','Speaking…');\n      speakBritish(answer, document.getElementById('aiVoiceSelect').value, avatar);\n      return;\n    }\n    const res = await engine.chat.completions.create({\n      messages: conversation,\n      temperature: 0.65,\n      max_tokens: 220\n    });\n\n    const answer = (res?.choices?.[0]?.message?.content || '').trim() ||\n      'I could not produce an answer that time. Please try asking again.';\n\n    conversation.push({role:'assistant',content:answer});\n    addBubble(answer,'bot');\n\n    setState('speaking','Speaking…');\n    speakBritish(answer, document.getElementById('aiVoiceSelect').value, avatar);\n\n    setTimeout(()=>{\n      if(!avatar.classList.contains('speaking')) setState('ready','Ready to practise');\n    }, 350);\n\n    if(turnsLeft() <= 0){\n      setTimeout(()=>openUpgrade(\n        'Free AI taster complete',\n        'You have used the five free AI practice turns. Premium membership will unlock a larger allowance.'\n      ), 700);\n    }\n  }catch(err){\n    addBubble('Something went wrong while the local AI was answering. Please try again.');\n    setState('ready','Ready to try again');\n    console.error(err);\n  }finally{\n    if(turnsLeft() > 0){\n      input.disabled = false;\n      sendBtn.disabled = false;\n      micBtn.disabled = false;\n      input.focus();\n    }\n  }\n}\nsendBtn.addEventListener('click', send);\ninput.addEventListener('keydown', e=>{\n  if(e.key==='Enter' && !e.shiftKey){\n    e.preventDefault();\n    send();\n  }\n});\n\n/* Microphone speech-to-text */\nconst SR = window.SpeechRecognition || window.webkitSpeechRecognition;\nlet recognition = null;\n\nfunction setMicMessage(text,type=''){\n  micStatus.textContent = text;\n  micStatus.className = 'mic-status' + (type ? ' '+type : '');\n}\nfunction setListening(on){\n  isListening = on;\n  micBtn.classList.toggle('listening',on);\n  micBtn.textContent = on ? '■' : '🎤';\n  micBtn.setAttribute('aria-label',on?'Stop microphone':'Start microphone');\n  micBtn.title = on ? 'Stop listening' : 'Start microphone';\n  if(on) setState('listening','Listening…');\n  else if(modelReady) setState('ready','Ready to practise');\n}\n\nif(SR){\n  recognition = new SR();\n  recognition.lang = 'en-GB';\n  recognition.interimResults = true;\n  recognition.continuous = false;\n  recognition.maxAlternatives = 1;\n\n  recognition.onstart = ()=>{\n    setListening(true);\n    setMicMessage('Listening… speak now.','ok');\n  };\n  recognition.onresult = e=>{\n    let finalText='', liveText='';\n    for(let i=e.resultIndex;i<e.results.length;i++){\n      const t=e.results[i][0].transcript;\n      if(e.results[i].isFinal) finalText += t;\n      else liveText += t;\n    }\n    input.value = (finalText || liveText).trim();\n    if(finalText.trim()){\n      setMicMessage('I heard you. Sending your question…','ok');\n      setTimeout(send,250);\n    }\n  };\n  recognition.onerror = e=>{\n    setListening(false);\n    const messages={\n      'not-allowed':'Microphone permission was blocked. Allow microphone access and try again.',\n      'service-not-allowed':'Speech recognition is blocked by this browser or page.',\n      'no-speech':'I did not hear anything. Tap the microphone and try again.',\n      'audio-capture':'No working microphone was found.',\n      'network':'Speech recognition could not connect.'\n    };\n    setMicMessage(messages[e.error] || `Microphone error: ${e.error}.`,'error');\n  };\n  recognition.onend = ()=>{\n    setListening(false);\n    if(!input.value.trim()) setMicMessage('Tap the microphone and speak, or type your question.');\n  };\n}\n\nasync function startMic(){\n  if(!SR){\n    setMicMessage('This browser does not support built-in speech-to-text. Typing still works. Chrome or Edge usually works best.','error');\n    return;\n  }\n  if(isListening){\n    try{recognition.stop()}catch(e){}\n    return;\n  }\n  try{\n    if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.isSecureContext){\n      const stream = await navigator.mediaDevices.getUserMedia({audio:true});\n      stream.getTracks().forEach(t=>t.stop());\n    }\n    recognition.start();\n  }catch(e){\n    setListening(false);\n    setMicMessage('Microphone permission was not granted. Allow it in the browser and try again.','error');\n  }\n}\nmicBtn.addEventListener('click', startMic);\n\n/* Improve avatar state after browser speech ends. */\nif('speechSynthesis' in window){\n  setInterval(()=>{\n    if(modelReady && !modelLoading && !isListening && !avatar.classList.contains('speaking') && statusEl.textContent==='Speaking…'){\n      setState('ready','Ready to practise');\n    }\n  },500);\n}\n","ielts-toeic.html":"","grammar.html":"\nconst grammarData={\nA1:[['Present simple','Use the present simple for routines, facts and regular actions.',['I work in Bedford.','She speaks English every day.'],'She ___ coffee every morning.',['drink','drinks','drinking'],1,'Use -s with he, she and it.'],['Be: am / is / are','Use be to describe identity, state and location.',[], '',[],0,'']],\nA2:[['Past simple','Use the past simple for finished past actions.',['I visited London yesterday.','She worked last Saturday.'],'We ___ there last year.',['go','went','have gone'],1,'Went is the past form of go.'],['Comparatives','Compare two people or things.',[], '',[],0,'']],\nB1:[['Present perfect: for & since','Use the present perfect for a situation that started in the past and continues now.',['I have lived here for three years.','I have worked here since 2024.'],'I ___ here since 2024.',['lived','have lived','am living since'],1,'Use present perfect with since.'],['First conditional','Use if + present, will + verb for a real future possibility.',[], '',[],0,'']],\nB2:[['Second conditional','Use if + past, would + verb for hypothetical situations.',['If I had more time, I would travel.','If she knew, she would tell us.'],'If I were you, I ___ the offer.',['accept','would accept','will accept'],1,'Use would + base verb.'],['Reported speech','Report what someone said.',[], '',[],0,'']],\nC1:[['Inversion','Use inversion for formal emphasis after negative or limiting expressions.',['Never have I seen such a result.','Had I known, I would have acted differently.'],'Choose the formal version.',['I never have seen it.','Never have I seen it.','Never I have seen it.'],1,'After never at the front, invert auxiliary and subject.'],['Nuanced modals','Use modal perfect forms for deduction and criticism.',[], '',[],0,'']],\nC2:[['Register & style','Choose structures that match formal, neutral or conversational context.',['It is imperative that…','I would rather give it a miss.'],'Which is most formal?',['I reckon we should go.','It is imperative that action be taken.','Let’s sort it out.'],1,'The subjunctive-style formal structure suits formal register.'],['Subtle emphasis','Use clefting and fronting to control focus.',[], '',[],0,'']]};\nlet gLevel='B1',gTopic=0;const levels=['A1','A2','B1','B2','C1','C2'],levelBox=document.getElementById('grammarLevels');levels.forEach(l=>{const b=document.createElement('button');b.textContent=l;b.className='level-btn'+(l===gLevel?' active':'');b.onclick=()=>{gLevel=l;gTopic=0;renderGrammar()};levelBox.appendChild(b)});\nfunction renderGrammar(){[...levelBox.children].forEach(b=>b.classList.toggle('active',b.textContent===gLevel));const menu=document.getElementById('grammarTopics');menu.innerHTML='';grammarData[gLevel].forEach((x,i)=>{const b=document.createElement('button');b.className='lesson-menu-btn'+(i===gTopic?' active':'');b.innerHTML=i===0?x[0]:`🔒 ${x[0]} — Member`;b.onclick=()=>{if(i>0){openUpgrade('Unlock the full Grammar Hub','Members get the complete grammar topic library at every level.');return}gTopic=i;renderGrammar()};menu.appendChild(b)});const d=grammarData[gLevel][0];document.getElementById('grammarLevelTag').textContent=gLevel+' free grammar taster';document.getElementById('grammarTitle').textContent=d[0];document.getElementById('grammarExplain').textContent=d[1];document.getElementById('grammarExamples').innerHTML=d[2].map(e=>`<div class=\"example-line\">${e}</div>`).join('');document.getElementById('grammarQuestion').textContent=d[3];const opts=document.getElementById('grammarOptions');opts.innerHTML='';d[4].forEach((o,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=o;b.onclick=()=>{[...opts.children].forEach((z,j)=>{z.disabled=true;if(j===d[5])z.classList.add('correct')});if(i!==d[5])b.classList.add('wrong');const f=document.getElementById('grammarFeedback');f.textContent=d[6];f.className='feedback show'};opts.appendChild(b)});document.getElementById('grammarFeedback').className='feedback'}renderGrammar();\n","vocabulary.html":"\nconst freeDeck=[['reliable','able to be trusted or depended on','She is one of the most reliable people on the team.','B1'],['awkward','uncomfortable or difficult in a social situation','There was an awkward silence after the question.','B2'],['significant','important or large enough to be noticeable','There was a significant increase in sales.','B2'],['queue','a line of people waiting','We had to queue for twenty minutes.','A2'],['exacerbate','make a problem worse','Poor communication can exacerbate the problem.','C1']];\nconst collections=['Free Starter','Work & Business — Member','Travel & Real Life — Member','IELTS & ('pronSet');function drawPron(){grid.innerHTML='';if(set.value!=='Free difficult words'){premiumSets[set.value.replace(' — Member','')].forEach(w=>{const b=document.createElement('button');b.className='pron-card locked';b.innerHTML=`<strong>${w}</strong><span>Member practice</span>`;b.onclick=()=>openUpgrade('Unlock the full pronunciation library','Members get the complete pronunciation practice sets, including TH sounds, endings and minimal pairs.');grid.appendChild(b)});return}freeWords.forEach(([w,ipa])=>{const b=document.createElement('button');b.className='pron-card';b.innerHTML=`<strong>${w}</strong><span>Hear British model</span><span class=\"pron-ipa\">${ipa}</span>`;b.onclick=()=>speakBritishModel(w,document.getElementById('voiceSelect').value);grid.appendChild(b)})}set.onchange=drawPron;document.getElementById('speakCustom').onclick=()=>{const t=document.getElementById('customPron').value.trim();if(t)speakBritishModel(t,document.getElementById('voiceSelect').value)};drawPron();\n","quizzes.html":"\nconst bank=[\n{l:'A1',c:'Grammar',q:'Choose the correct sentence.',a:['She are happy.','She is happy.','She happy is.'],x:1,e:'Use “is” with she/he/it.'},\n{l:'A2',c:'Vocabulary',q:'Which word means “very tired”?',a:['Exhausted','Excited','Expensive'],x:0,e:'“Exhausted” means extremely tired.'},\n{l:'B1',c:'Grammar',q:'I ___ here since 2024.',a:['live','lived','have lived'],x:2,e:'Use the present perfect with “since” for something continuing until now.'},\n{l:'B1',c:'British English',q:'In British English, what is a “queue”?',a:['A line of people waiting','A type of train','A small shop'],x:0,e:'A queue is a line of people waiting.'},\n{l:'B2',c:'Vocabulary',q:'“I’m not particularly keen on it” most nearly means…',a:['I absolutely love it.','I don’t really like it.','I have never tried it.'],x:1,e:'It is a natural, polite way to say you do not really like something.'},\n{l:'B2',c:'Grammar',q:'If I had more time, I ___ another language.',a:['learn','would learn','will learn'],x:1,e:'Second conditional: if + past simple, would + base verb.'},\n{l:'C1',c:'Vocabulary',q:'Which verb means “make a problem worse”?',a:['Exacerbate','Acquiesce','Mitigate'],x:0,e:'“Exacerbate” means to make something bad even worse.'},\n{l:'C1',c:'Grammar',q:'Choose the most natural formal sentence.',a:['Had I known, I would have acted differently.','If I knew, I acted differently.','If I would know, I had acted.'],x:0,e:'This is an advanced inverted third conditional.'},\n{l:'B2',c:'IELTS',q:'For IELTS Speaking Part 2, how long is the main speaking time?',a:['30 seconds','1 minute','Up to 2 minutes'],x:2,e:'You normally have one minute to prepare and then speak for up to two minutes.'},\n{l:'B1',c:'TOEIC',q:'Please ___ the attached document.',a:['review','queue','borrow'],x:0,e:'Review means check or examine something carefully.'}\n];\nlet quiz=[],i=0,points=0,locked=false,attempts=[];const level=document.getElementById('level'),category=document.getElementById('category'),score=document.getElementById('score'),qMeta=document.getElementById('qMeta'),qTag=document.getElementById('qTag'),question=document.getElementById('question'),answers=document.getElementById('answers'),feedback=document.getElementById('feedback'),progressBar=document.getElementById('progressBar'),nextBtn=document.getElementById('nextBtn');\nfunction build(){let l=level.value,c=category.value;let filtered=bank.filter(q=>(l==='Mixed'||q.l===l)&&(c==='Mixed'||q.c===c));if(filtered.length<3)filtered=bank.filter(q=>(l==='Mixed'||q.l===l)||(c==='Mixed'||q.c===c));quiz=[...filtered,...bank].filter((q,pos,a)=>a.indexOf(q)===pos).slice(0,10);i=0;points=0;attempts=[];score.textContent='Score: 0';render()}\nfunction render(){locked=false;nextBtn.style.display='none';feedback.className='feedback';const q=quiz[i];qMeta.textContent=`Question ${i+1} of ${quiz.length}`;qTag.textContent=`${q.l} • ${q.c}`;question.textContent=q.q;answers.innerHTML='';q.a.forEach((t,n)=>{let b=document.createElement('button');b.className='answer';b.textContent=t;b.onclick=()=>choose(n,b);answers.appendChild(b)});progressBar.style.width=`${(i/quiz.length)*100}%`}\nfunction choose(n,b){if(locked)return;locked=true;const q=quiz[i];attempts.push({q:q.q,tag:`${q.l} • ${q.c}`,chosen:q.a[n],correct:q.a[q.x],ok:n===q.x,explain:q.e});[...answers.children].forEach((x,k)=>{if(k===q.x)x.classList.add('correct')});if(n===q.x){points++;score.textContent=`Score: ${points}`}else b.classList.add('wrong');feedback.textContent=q.e;feedback.classList.add('show');progressBar.style.width=`${((i+1)/quiz.length)*100}%`;nextBtn.style.display='inline-flex';nextBtn.textContent=i===quiz.length-1?'See the results':'Next question'}\nfunction showResults(){const pct=Math.round((points/quiz.length)*100);const message=pct>=90?'Excellent work — a very strong result.':pct>=70?'Good work — you have a solid grasp of this set.':pct>=50?'A useful result — review the answers below and try again.':'Keep practising — the review below shows exactly what to work on.';qMeta.textContent='Quiz complete';score.textContent=`Score: ${points} / ${quiz.length}`;qTag.textContent='Your free quiz results';question.textContent=`${pct}% — ${message}`;progressBar.style.width='100%';nextBtn.style.display='none';feedback.className='feedback show';feedback.innerHTML='<strong>Your results will stay on this screen.</strong> Review every answer below, then choose what you want to do next.';answers.innerHTML='<div style=\"display:grid;gap:12px;width:100%\">'+attempts.map((a,n)=>`<div class=\"card\" style=\"padding:16px;border-left:5px solid ${a.ok?'#64bb92':'#d98282'}\"><div class=\"eyebrow\">Question ${n+1} • ${a.tag}</div><strong style=\"display:block;margin:5px 0 8px\">${a.q}</strong><div style=\"margin:4px 0\"><b>Your answer:</b> ${a.chosen} ${a.ok?'✓':'✗'}</div>${a.ok?'':`<div style=\"margin:4px 0\"><b>Correct answer:</b> ${a.correct}</div>`}<p style=\"margin:8px 0 0;color:var(--muted)\">${a.explain}</p></div>`).join('')+'<div class= t 2`;document.getElementById('cueTitle').textContent=c.t;document.getElementById('cuePrompts').innerHTML=c.q.map(x=>`<li>${x}</li>`).join('');document.getElementById('cueEnd').textContent=c.e;document.getElementById('cueProgress').textContent=`${completed.size} of 5 free cards completed on this device`}\ndocument.getElementById('newCue').onclick=()=>drawCue(true);document.getElementById('cueCategory').onchange=()=>{current=0;drawCue()};document.getElementById('saveCue').onclick=()=>{const c=pool()[current%pool().length];completed.add(c.t);localStorage.setItem('rjCueCompleted',JSON.stringify([...completed]));drawCue();if(completed.size>=5)setTimeout(()=>openUpgrade('You completed all 5 free cue cards','Premium membership unlocks the larger IELTS Speaking cue-card library and synced progress.'),350)};\nfunction show(){document.getElementById('timer').textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}\nfunction run(s,label){clearInterval(timerInt);seconds=s;document.getElementById('timerLabel').textContent=label;show();timerInt=setInterval(()=>{seconds--;show();if(seconds<=0){clearInterval(timerInt);const msg=label==='Preparation time'?'Preparation finished — start speaking!':'Speaking time complete';document.getElementById('timerLabel').textContent=msg;speakBritish(msg)}},1000)}\ndocument.getElementById('prepBtn').onclick=()=>run(60,'Preparation time');document.getElementById('speakBtn').onclick=()=>run(120,'Speaking time');document.getElementById('resetBtn').onclick=()=>{clearInterval(timerInt);seconds=60;document.getElementById('timerLabel').textContent='Preparation time';show()};drawCue();\n","lessons.html":"\nconst lessonData={A1:[['Introductions','Name, country, job and simple personal questions.'],['Present simple','Daily routines and common verbs.'],['Everyday objects','Useful nouns for home and daily life.']],A2:[['Past events','Talk about yesterday and last weekend.'],['Travel basics','Hotels, directions and .addEventListener('click',()=>{const x=lessonData[l][0];out.innerHTML=`<div class=\"lesson-full\"><button class=\"btn btn-light\" id=\"backLessons\">← Back</button><div class=\"eyebrow\">${l} free lesson</div><h2>${x[0]}</h2><p class=\"lead small\">${x[1]}</p><div class=\"example-stack\"><div class=\"example-line\"><strong>Learn:</strong> clear explanation and examples.</div><div class=\"example-line\"><strong>Practise:</strong> complete a short check.</div><div class=\"example-line\"><strong>Use:</strong> finish with a speaking or writing task.</div></div><button class=\"btn btn-primary\" id=\"saveLesson\">Save lesson on this device</button></div>`;document.getElementById('backLessons').onclick=drawLessons;document.getElementById('saveLesson').onclick=()=>{localStorage.setItem('rjLastLesson',`${l}: ${x[0]}`);alert('Free lesson progress saved on this device. Account syncing comes with the live member system.')}})}drawLessons();\n","shop.html":"\nconst pm=document.getElementById('pdfPreviewModal'),pt=document.getElementById('previewTitle'),pp=document.getElementById('previewPages'),pc=document.getElementById('previewCopy');document.querySelectorAll('.pdf-preview').forEach(b=>b.onclick=()=>{pt.textContent=b.dataset.title;pp.innerHTML=`<div class=\"preview-page-img\"><img src=\"${b.dataset.img1}\" alt=\"${b.dataset.title} sample page\"></div>`+(b.dataset.img2?`<div class=\"preview-page-img\"><img src=\"${b.dataset.img2}\" alt=\"${b.dataset.title} sample page\"></div>`:'');pc.textContent=b.dataset.copy||'These are sample pages only. The full PDF is delivered after successful payment.';pm.classList.add('open')});pm.querySelector('.modal-close').onclick=()=>pm.classList.remove('open');pm.onclick=e=>{if(e.target===pm)pm.classList.remove('open')};\n","book.html":"\nconst lessonStripeKeys={\n  'General English & Conversation':'lesson_general',\n  'British English Pronunciation':'lesson_pronunciation',\n  'IELTS & TOEIC Preparation':'lesson_exam'\n};\n\nlet chosen={lesson:'',price:0,stripeKey:''};\nlet selectedDate='';\nlet selectedTime='';\nconst today=new Date();\ntoday.setHours(0,0,0,0);\nlet monthCursor=new Date(today.getFullYear(),today.getMonth(),1);\nconst maxMonth=new Date(today.getFullYear(),today.getMonth()+12,1);\n\n/*\n  When the live booking database is connected, it will supply booked times in this shape:\n  window.RJ_BOOKED_SLOTS = { '2026-10-14':['19:00','20:00','21:00'] };\n  If every time is booked, the date becomes \"Fully booked\" and cannot be selected.\n*/\nwindow.RJ_BOOKED_SLOTS = window.RJ_BOOKED_SLOTS || {};\n\nfunction isoDate(d){\n  const y=d.getFullYear();\n  const m=String(d.getMonth()+1).padStart(2,'0');\n  const day=String(d.getDate()).padStart(2,'0');\n  return `${y}-${m}-${day}`;\n}\nfunction niceDate(d){\n  return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});\n}\nfunction baseTimes(d){\n  const day=d.getDay();\n  if(day===0||day===6){\n    return ['10:00','11:00','12:00','14:00','15:00','16:00','17:00','18:00','19:00'];\n  }\n  return ['19:00','20:00','21:00'];\n}\nfunction availableTimes(d){\n  const iso=isoDate(d);\n  const booked=new Set(window.RJ_BOOKED_SLOTS[iso]||[]);\n  return baseTimes(d).filter(t=>!booked.has(t));\n}\nfunction isSameDay(a,b){\n  return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();\n}\nfunction canGoPrevious(){\n  return monthCursor.getFullYear()>today.getFullYear() ||\n    (monthCursor.getFullYear()===today.getFullYear() && monthCursor.getMonth()>today.getMonth());\n}\nfunction renderCalendar(){\n  const label=document.getElementById('calendarMonthLabel');\n  const grid=document.getElementById('calendarGrid');\n  label.textContent=monthCursor.toLocaleDateString('en-GB',{month:'long',year:'numeric'});\n  grid.innerHTML='';\n\n  const first=new Date(monthCursor.getFullYear(),monthCursor.getMonth(),1);\n  const last=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+1,0);\n  const monda   function qualityScore(text,level){
